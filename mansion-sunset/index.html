<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mansión Sunset Menú</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap">
<style>
/* Layout: an evening at the beach club — a live sunset hero, then one centered column of courses set like a fine-dining card: spaced caps, dotted leaders, gold hairlines. Deliberately one dark look. */
:root{
  --night:#02283B;     /* Azul noche — ground */
  --deep:#06344C;      /* raised panels */
  --ivory:#F3EADB;     /* Marfil — text */
  --mist:#B9C3C6;      /* secondary text */
  --gold:#D3A55E;      /* Dorado — accent */
  --sand:#CAAD85;      /* Arena */
  --ember:#E89A5C;     /* sunset, used once or twice */
  --hair:rgba(211,165,94,.30);
  --font-mark:"Cinzel", "Trajan Pro", Georgia, serif;
  --font-display:"Playfair Display", Georgia, serif;
  --font-script:"Playfair Display", Georgia, serif;
  --font-body:"Montserrat", "Helvetica Neue", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--night);color:var(--ivory);font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ——— Hero: the brand banner ——— */
.hero{position:relative;overflow:hidden;background:var(--night)}
.hero img{display:block;width:100%;height:clamp(280px,74vw,300px);object-fit:cover;object-position:82% 50%}
@media (min-width:720px){.hero img{height:auto;aspect-ratio:1744/692;max-height:620px;object-position:50% 50%}}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:70px;background:linear-gradient(rgba(2,40,59,0),var(--night));pointer-events:none}
.tagline{margin:0;text-align:center;font-family:var(--font-script);font-style:italic;font-size:19px;line-height:1.4;color:var(--ivory);opacity:.92;padding-block:6px 18px;text-wrap:balance}
@media (min-width:720px){html[lang="es"] .tagline{display:none}}
footer .mark{width:84px;height:auto;display:block;margin:0 auto 10px}

/* ——— Sticky bar ——— */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(2,40,59,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-block:6px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--mist);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;padding-bottom:4px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.nav a.on{color:var(--gold);border-color:var(--gold)}
.nav a:focus-visible,.switch:focus-visible{outline:1px solid var(--gold);outline-offset:4px}

.switch{flex:none;position:relative;display:grid;grid-template-columns:1fr 1fr;width:84px;height:34px;border-radius:999px;background:transparent;border:1px solid var(--gold);padding:2px;cursor:pointer;font:500 11px/1 var(--font-body);letter-spacing:.18em;color:var(--gold)}
.switch .knob{position:absolute;top:2px;left:2px;width:39px;height:28px;border-radius:999px;background:var(--gold);transition:transform .35s cubic-bezier(.6,0,.2,1)}
.switch[aria-checked="true"] .knob{transform:translateX(39px)}
.switch .l{position:relative;z-index:1;display:grid;place-items:center;padding-left:.18em;transition:color .3s}
.switch[aria-checked="false"] .l-es,.switch[aria-checked="true"] .l-en{color:var(--night)}

/* ——— Courses ——— */
main{padding-block:12px 24px}
.course{scroll-margin-top:70px;padding-top:56px}
.course-head{text-align:center;margin-bottom:22px}
.course-head svg{width:46px;height:12px;display:block;margin:0 auto 14px;color:var(--gold)}
.course-head h2{margin:0;font-family:var(--font-display);font-style:italic;letter-spacing:.01em;font-weight:400;font-size:clamp(32px,8vw,42px);line-height:1.05;color:var(--ivory);text-wrap:balance}
.course-head p{margin:10px auto 0;font-size:13px;color:var(--mist);max-width:40ch}
.dish{padding:16px 0}
.dish + .dish{border-top:1px solid rgba(242,236,225,.07)}
.line{display:flex;align-items:baseline;gap:10px}
.line h3{margin:0;font-family:var(--font-body);font-weight:500;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;line-height:1.35;min-width:0}
.dots{flex:1;min-width:16px;border-bottom:1px dotted rgba(210,176,122,.45);transform:translateY(-4px)}
.price{font-family:var(--font-display);font-size:18px;color:var(--gold);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.orig{display:block;margin-top:2px;font-family:var(--font-script);font-style:italic;font-size:15.5px;color:var(--gold);opacity:.85;letter-spacing:0}
.dish p{margin:6px 0 0;color:var(--mist);font-size:14.5px;max-width:52ch}
.opts{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:8px;font-family:var(--font-script);font-style:italic;font-size:16px;color:var(--ivory)}
.opts span:not(:last-child)::after{content:"·";color:var(--gold);margin:0 10px}
.tag{display:inline-block;margin-left:10px;vertical-align:2px;font-size:9.5px;letter-spacing:.24em;color:var(--ember);border:1px solid rgba(229,139,90,.55);border-radius:999px;padding:3px 8px 2px 10px;font-weight:400}

/* Signature course: framed panel */
.course.sig .panel{border:1px solid var(--hair);background:linear-gradient(180deg,rgba(210,176,122,.07),rgba(210,176,122,0) 70%),var(--deep);padding:8px 22px 10px;position:relative}
.course.sig .panel::before,.course.sig .panel::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold)}
.course.sig .panel::before{top:-5px;left:-5px;border-right:0;border-bottom:0}
.course.sig .panel::after{bottom:-5px;right:-5px;border-left:0;border-top:0}
.course.sig .dish + .dish{border-top-color:var(--hair)}

footer{margin-top:64px;border-top:1px solid var(--hair);text-align:center;padding-block:40px 48px}
footer h4{margin:0;font-family:var(--font-mark);font-weight:400;font-size:24px;letter-spacing:.06em}
footer p{margin:8px 0 0;color:var(--mist);font-size:12px;letter-spacing:.2em;text-transform:uppercase}

.swap{transition:opacity .25s ease}
.fading .swap{opacity:0}
</style>

const menuEl=document.getElementById('menu'),navEl=document.getElementById('nav'),sw=document.getElementById('lang');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titleCase=s=>s.toLowerCase().replace(/(^|[\s(&])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Del|Y|A|La|Las|Con|O|Al|En)\b/g,w=>w.toLowerCase()).replace(/^./,c=>c.toUpperCase()).replace(/\(1 Pza\)/,'(1 pza)').replace(/Pzas\)/,'pzas)').replace(/Gr\)/,'gr)').replace(/\(8 Pz\)/,'(8 pz)');
const orn='<svg viewBox="0 0 46 12" aria-hidden="true"><path d="M1 6 Q 6.5 1 12 6 T 23 6 T 34 6 T 45 6" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="23" cy="6" r="1.6" fill="currentColor"/></svg>';

function render(lang){
  const u=UI[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=u[el.dataset.i]);
  navEl.innerHTML=MENU.map(s=>`<a href="#${s.id}" data-id="${s.id}">${esc(s[lang])}</a>`).join('');
  menuEl.innerHTML=MENU.map(s=>{
    const sig=s.id==='especiales';
    const dishes=s.items.map(it=>{
      const [name,desc]=it[lang];
      const shown=lang==='es'?titleCase(name):name;
      const orig=lang==='en'?`<span class="orig">${esc(titleCase(it.es[0]))}</span>`:'';
      return `<article class="dish">
        <div class="line"><h3>${esc(shown)}${it.share?`<span class="tag">${u.share}</span>`:''}</h3><span class="dots" aria-hidden="true"></span><span class="price">${it.p}</span></div>
        ${orig}
        ${desc?`<p>${esc(desc)}</p>`:''}
        ${it.opts?`<div class="opts">${it.opts[lang].map(o=>`<span>${esc(o)}</span>`).join('')}</div>`:''}
      </article>`}).join('');
    return `<section class="course${sig?' sig':''}" id="${s.id}" aria-labelledby="h-${s.id}">
      <div class="course-head">${orn}<h2 id="h-${s.id}">${esc(s[lang])}</h2>${sig?`<p>${u.sig}</p>`:''}${s.note?`<p>${esc(s.note[lang])}</p>`:''}</div>
      ${sig?`<div class="panel">${dishes}</div>`:dishes}
    </section>`}).join('');
  sw.setAttribute('aria-checked',lang==='en');
  observe();
}

let io;
function observe(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    navEl.querySelectorAll('a').forEach(a=>{const on=a.dataset.id===e.target.id;a.classList.toggle('on',on);if(on)navEl.scrollTo({left:a.offsetLeft-navEl.offsetLeft-4,behavior:'smooth'})});
  }})},{rootMargin:'-90px 0px -65% 0px'});
  menuEl.querySelectorAll('section').forEach(s=>io.observe(s));
}

let lang='es';
try{const s=localStorage.getItem('ms-lang');if(s==='en'||s==='es')lang=s;else if(!/^es/i.test(navigator.language||'es'))lang='en'}catch(e){}
if(location.hash==='#en')lang='en';else if(location.hash==='#es')lang='es';
render(lang);
sw.addEventListener('click',()=>{
  lang=lang==='es'?'en':'es';
  sw.setAttribute('aria-checked',lang==='en');
  document.body.classList.add('fading');
  setTimeout(()=>{const y=scrollY;render(lang);scrollTo(0,y);requestAnimationFrame(()=>document.body.classList.remove('fading'))},250);
  try{localStorage.setItem('ms-lang',lang)}catch(e){}
});


</script>
