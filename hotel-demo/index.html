<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hotel Costa Azul ✝️</title>
<style>
@font-face{font-family:'Cormorant Garamond';src:url('fonts/cormorant-garamond-latin-500-normal.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('fonts/cormorant-garamond-latin-500-italic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('fonts/cormorant-garamond-latin-600-italic.woff2') format('woff2');font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter-latin-400-normal.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter-latin-500-normal.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter-latin-600-normal.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter-latin-700-normal.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

:root{
  --navy:#0b1e2d;
  --deep:#081624;
  --ocean:#1a4a6b;
  --wave:#2a7aad;
  --foam:#e8f4fb;
  --sand:#d4a853;
  --sand2:#f0c96a;
  --ink:#e2edf5;
  --ink2:#a8c4d8;
  --muted:#6a95b0;
  --line:rgba(42,122,173,.18);
  --line2:rgba(42,122,173,.4);
  --paper:#0f2538;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--deep);-webkit-text-size-adjust:100%}
body{max-width:560px;margin:0 auto;background:var(--navy);min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{background:none;border:none;cursor:pointer;font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;object-fit:cover}
.micro{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.num{font-variant-numeric:lining-nums tabular-nums}
.lead{font-size:14px;color:var(--ink2);line-height:1.6;margin-top:8px}

/* DEMO RIBBON */
.demo{background:var(--deep);border-bottom:1px solid var(--sand);padding:9px 18px;text-align:center;font-size:11.5px;color:var(--ink2);line-height:1.4}
.demo b{color:var(--sand);font-weight:700}

/* HERO */
.hero{position:relative;height:min(76vh,620px);background:var(--deep);overflow:hidden}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0b2d4a 0%,#1a4a6b 35%,#0d3d5f 60%,#0a1e2d 100%)}
.hero-wave{position:absolute;inset:0;opacity:.35;background:radial-gradient(ellipse 120% 60% at 60% 80%,#2a7aad 0%,transparent 70%)}
.hero-wave2{position:absolute;inset:0;opacity:.2;background:radial-gradient(ellipse 80% 40% at 20% 40%,#1a6a9a 0%,transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,22,36,.5) 0%,rgba(8,22,36,0) 25%,rgba(8,22,36,.0) 55%,rgba(8,22,36,.9) 100%)}
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.08)}}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 20s ease-in-out alternate infinite}
.bar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
.loc{color:var(--foam);opacity:.85}
.title{position:absolute;z-index:3;left:22px;right:22px;bottom:28px}
.hello{color:var(--ink2);margin-bottom:6px}
.title h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,11vw,62px);line-height:.95;color:#fff}
.title h1 i{font-style:italic;color:var(--sand2)}
.title h1 span{display:block;font-size:.52em;letter-spacing:.12em;text-transform:uppercase;font-weight:600;font-style:normal;color:var(--foam);opacity:.85;margin-top:4px}
.date{margin-top:10px;display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.date span:last-child{color:var(--sand);opacity:.9}

/* lang switch */
.sw{display:flex;align-items:center;width:68px;height:30px;border-radius:16px;background:rgba(11,30,45,.55);border:1px solid rgba(42,122,173,.35);position:relative;padding:0 6px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sw .knob{position:absolute;left:4px;width:22px;height:22px;border-radius:50%;background:var(--sand);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.sw[aria-checked="true"] .knob{transform:translateX(38px)}
.sw .es,.sw .en{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;position:absolute;transition:opacity .2s;color:#fff}
.sw .es{right:8px;opacity:1}
.sw .en{left:8px;opacity:0}
.sw[aria-checked="true"] .es{opacity:0}
.sw[aria-checked="true"] .en{opacity:1}

/* SECTIONS */
.wrap{padding-bottom:0}
.sec{display:none;padding:28px 22px 20px}
.sec.on{display:block}
.eyebrow{color:var(--wave);margin-bottom:8px}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(32px,8vw,44px);line-height:1.02;color:var(--foam)}
h2 em{font-style:italic;color:var(--sand2)}
.orn{display:flex;align-items:center;gap:10px;margin:28px 0;color:var(--ocean)}
.orn i{flex:1;height:1px;background:var(--line2)}
.orn b{color:var(--sand);font-size:14px}

/* NOW / NEXT */
.nn{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:24px}
.nn > div{background:var(--paper);padding:16px 14px}
.lab{color:var(--muted);margin-bottom:6px}
.lab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--sand);margin-right:6px;vertical-align:middle}
.what{font-size:15px;font-weight:600;color:var(--foam);line-height:1.3}
.where{font-size:12px;color:var(--muted);margin-top:3px}

/* SCHEDULE */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-top:16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;padding:8px 10px;border-radius:6px;border:1px solid var(--line);text-align:center;min-width:48px;color:var(--muted);transition:background .15s,color .15s}
.day.on{background:var(--sand);color:var(--deep);border-color:var(--sand)}
.day .d{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.day .n{font-size:20px;font-family:var(--serif);font-weight:500;margin-top:1px}

/* SHOW CARD */
.show{position:relative;margin:20px 0;border-radius:6px;overflow:hidden;height:260px;background:var(--paper)}
.show::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,22,36,.4) 0%,rgba(8,22,36,0) 30%,rgba(8,22,36,.88) 100%)}
.show::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(26,74,107,.4) 0%,transparent 60%)}
.show img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.show .in{position:absolute;z-index:2;left:20px;right:20px;top:18px;bottom:20px;display:flex;flex-direction:column;justify-content:space-between}
.show .badge{color:var(--sand2)}
.show h3{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.02;color:#fff}
.show p{font-size:13px;color:#c5dce9;margin-top:6px;line-height:1.5}
.show .meta{display:flex;gap:20px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(42,122,173,.35);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--foam)}

/* FILTERS */
.filters{display:flex;gap:20px;overflow-x:auto;margin-top:28px;border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:0 0 11px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;position:relative}
.filters button.on{color:var(--foam)}
.filters button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--wave)}

/* TIMELINE */
.ev{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.ev .t{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--foam)}
.ev .n{font-size:14.5px;font-weight:500;color:var(--foam)}
.ev .p{font-size:12px;color:var(--muted);margin-top:3px}
.ev .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ev .k.live{color:var(--sand2);font-weight:600}
.ev.past{opacity:.35}
.empty{padding:26px 0;color:var(--muted);font-size:13.5px;text-align:center}

/* PHOTO */
.photo{position:relative;margin:0 -22px;height:260px;overflow:hidden;background:var(--deep)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cap{position:absolute;left:22px;bottom:14px;color:#e8f4fb;font-family:var(--serif);font-style:italic;font-size:16px;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.photo-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,22,36,.5),transparent 60%)}

/* VENUES / DINING */
.venue{padding:24px 0;border-bottom:1px solid var(--line)}
.venue .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.venue h4{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.05;color:var(--foam)}
.venue .type{color:var(--wave);margin-top:5px;font-size:13px}
.venue p{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-top:10px}
.st{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.st i{width:5px;height:5px;border-radius:50%;background:var(--line2)}
.st.open{color:#5bbf8a} .st.open i{background:#5bbf8a}
.hours{margin-top:12px}
.hours div{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.hours div span:first-child{color:var(--muted)}
.link{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--foam);padding-bottom:3px;border-bottom:1px solid var(--wave)}
.link svg{width:13px;height:13px}

/* RELAX */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:24px}
.duo > div{background:var(--paper);padding:18px 14px 18px 0}
.duo > div:nth-child(even){padding-left:14px;padding-right:0}
.duo .ic{color:var(--wave);width:24px;height:24px}
.duo h5{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.08;margin-top:10px;color:var(--foam)}
.duo p{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.split figure{position:relative;height:190px;overflow:hidden;border-radius:4px;background:var(--paper)}
.split figure .ph{width:100%;height:100%;background:linear-gradient(135deg,var(--ocean) 0%,var(--deep) 100%);display:flex;align-items:center;justify-content:center;font-size:40px;opacity:.5}
.split figcaption{position:absolute;left:10px;bottom:9px;color:#fff;font-family:var(--serif);font-style:italic;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* EXPLORE */
.xp{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:22px 0;border-bottom:1px solid var(--line)}
.xp .no{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--sand);padding-top:4px}
.xp h4{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.08;color:var(--foam)}
.xp .pr{color:var(--muted);margin-top:5px;font-size:12.5px}
.xp p{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-top:8px}
.btn-xp{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--sand);padding:8px 14px;border:1px solid rgba(212,168,83,.4);border-radius:2px}

/* INFO */
.dl{margin-top:20px;border-top:1px solid var(--line)}
.dl div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl div span:first-child{color:var(--muted)}
.dl b{font-weight:500;color:var(--foam);text-align:right}
.copy{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--wave);margin-left:10px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:20px;padding:16px;background:var(--ocean);color:var(--foam);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;text-decoration:none;border-radius:3px;border:1px solid var(--wave)}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--ink2)}
.rate{display:flex;gap:12px;justify-content:center;margin:18px 0 4px}
.rate button{font-size:28px;color:var(--line2);transition:.15s}
.rate button.on{color:var(--sand)}
textarea{width:100%;margin-top:12px;border:1px solid var(--line2);border-radius:3px;padding:12px;font:inherit;font-size:13.5px;background:var(--paper);min-height:85px;resize:vertical;color:var(--ink)}
textarea:focus{outline:1px solid var(--wave);border-color:var(--wave)}

/* FOOTER */
.foot{text-align:center;font-size:10.5px;color:var(--muted);padding:38px 10px 14px;line-height:1.7;letter-spacing:.02em}
.foot .mark{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--foam);display:block;margin-bottom:5px;letter-spacing:0}

/* NAV */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(11,30,45,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{padding:11px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--muted)}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--foam)}
nav button.on svg{color:var(--sand)}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);opacity:0;background:var(--ocean);color:#fff;padding:12px 16px;border-radius:3px;font-size:12.5px;max-width:88%;text-align:center;transition:.3s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

.rt{display:flex;gap:8px;align-items:center}
.rf{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(11,30,45,.35);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.rf.spin svg{animation:rfs .8s linear infinite}
@keyframes rfs{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="demo" id="demo"></div>
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-wave"></div>
    <div class="hero-wave2"></div>
    <div class="bar">
      <div class="loc micro" id="crest"></div>
      <span class="rt">
        <button class="rf" id="rf" aria-label="Actualizar / Refresh"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
        <button class="sw" id="langSw" role="switch" aria-checked="false" aria-label="Español / English"><i class="knob"></i><span class="es">ES</span><span class="en">EN</span></button>
      </span>
    </div>
    <div class="title">
      <div class="hello micro" id="hello"></div>
      <h1><i>Costa</i><span>AZUL · ACAPULCO</span></h1>
      <div class="date"><span id="date"></span><span id="tagline"></span></div>
    </div>
  </header>

  <main>
    <section class="sec" id="s-today">
      <div class="nn">
        <div><div class="lab micro"><i class="dot"></i><span id="l-now"></span></div><div class="what" id="now-what"></div><div class="where" id="now-where"></div></div>
        <div><div class="lab micro" id="l-next"></div><div class="what" id="next-what"></div><div class="where" id="next-where"></div></div>
      </div>
      <div class="eyebrow micro" id="e-schedule"></div>
      <h2 id="h-schedule"></h2>
      <div class="days" id="days"></div>
      <div class="show" id="show">
        <div class="in"><div class="badge micro" id="show-badge"></div>
        <div><h3 id="show-title" style="color:#fff;font-family:var(--serif);font-weight:500;font-size:34px"></h3><p id="show-desc" style="font-size:13px;color:#c5dce9;margin-top:6px;line-height:1.5"></p>
        <div class="meta"><span>21:00</span><span id="show-venue"></span></div></div></div>
      </div>
      <div class="filters" id="chips"></div>
      <div id="tl"></div>
    </section>

    <section class="sec" id="s-dine">
      <div class="eyebrow micro" id="e-dine"></div>
      <h2 id="h-dine"></h2>
      <p class="lead" id="p-dine"></p>
      <div class="photo" style="margin-top:24px">
        <div style="width:100%;height:100%;background:linear-gradient(135deg,#1a4a6b 0%,#0a2a3d 100%);display:flex;align-items:center;justify-content:center;font-size:72px;opacity:.4">🌊</div>
        <div class="photo-grad"></div>
        <div class="cap" id="c-dine"></div>
      </div>
      <div id="dine"></div>
    </section>

    <section class="sec" id="s-relax">
      <div class="eyebrow micro" id="e-relax"></div>
      <h2 id="h-relax"></h2>
      <p class="lead" id="p-relax"></p>
      <div class="split">
        <figure><div class="ph">🏊</div><figcaption id="c-pool"></figcaption></figure>
        <figure><div class="ph">🏖️</div><figcaption id="c-beach"></figcaption></figure>
      </div>
      <div class="duo" id="relax"></div>
      <div class="venue" id="kids"></div>
    </section>

    <section class="sec" id="s-explore">
      <div class="eyebrow micro" id="e-explore"></div>
      <h2 id="h-explore"></h2>
      <p class="lead" id="p-explore"></p>
      <div id="explore" style="margin-top:8px"></div>
    </section>

    <section class="sec" id="s-info">
      <div class="eyebrow micro" id="e-info"></div>
      <h2 id="h-info"></h2>
      <div class="dl" id="info"></div>
      <a class="btn" id="call" href="tel:+527444693500"></a>
      <div class="orn"><i></i><b>✦</b><i></i></div>
      <div class="eyebrow micro" id="e-fb" style="margin-top:26px"></div>
      <h2 id="h-fb" style="font-size:32px"></h2>
      <p class="lead" id="p-fb"></p>
      <div class="rate" id="rate"></div>
      <textarea id="fbtext"></textarea>
      <button class="btn line" id="fbsend"></button>
    </section>

    <div class="foot" id="foot"></div>
  </main>
</div>

<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
const T = {
  es:{
    demo:'<b>DEMO</b> · Concepto de app para huéspedes por MX Studio · No es la app oficial del hotel',
    crest:'Bahía de Acapulco · Todo incluido', tagline:'Todo incluido',
    morning:'Buenos días', afternoon:'Buenas tardes', evening:'Buenas noches',
    now:'Ahora', next:'A continuación', nothingNow:'Tiempo libre', nothingNext:'Mañana',
    eSchedule:'Tu día en el hotel', schedule:'Programa <em>del día</em>', tonight:'Esta noche', theater:'Teatro',
    filters:{all:'Todo',pool:'Alberca',fit:'Bienestar',kids:'Niños',fun:'Juegos',night:'Noche'},
    live:'En curso', empty:'No hay actividades en esta categoría.',
    nav:['Hoy','Comer','Relax','Explorar','Info'],
    eDine:'Gastronomía', dine:'Restaurantes <em>y bares</em>', pDine:'Todo incluido: alimentos y bebidas nacionales en los horarios indicados.',
    cDine:'Cenas frente al Pacífico',
    open:'Abierto', closed:'Cerrado', reserve:'Reservar mesa',

/* STATE */
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let lang = store.get('ca-lang') || ((navigator.language||'es').startsWith('en') ? 'en' : 'es');
let tab = 'today', filter = 'all', stars = 0;
const nowMx = () => new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}));
let selDay = nowMx().getDay();
const L = o => (o && typeof o === 'object' && 'es' in o) ? o[lang] : o;
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const endMins = (s,e) => { let x = mins(e); if(x <= mins(s)) x += 1440; return x; };
const $ = id => document.getElementById(id);
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const h = (id, v) => { $(id).innerHTML = v; };

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }

function render(){
  const t = T[lang]; document.documentElement.lang = lang;
  h('demo', t.demo); $('crest').textContent = t.crest; $('tagline').textContent = t.tagline;
  $('langSw').setAttribute('aria-checked', lang==='en' ? 'true' : 'false');
  const n = nowMx(), hr = n.getHours();
  $('hello').textContent = hr<12 ? t.morning : hr<19 ? t.afternoon : t.evening;
  const ds = n.toLocaleDateString(t.locale,{weekday:'long',day:'numeric',month:'long'});
  $('date').textContent = ds.charAt(0).toUpperCase()+ds.slice(1);

  const tabs = ['today','dine','relax','explore','info'];
  const navIc = [
    '<rect x="3.5" y="4.5" width="17" height="16" rx="1"/><path d="M16 2.5v4M8 2.5v4M3.5 10h17"/>',
    '<path d="M6 3v7a3 3 0 0 0 3 3v8M9 3v6M12 3v7a3 3 0 0 1-3 3M18 21V3c-2 1-3 3-3 6v5h3"/>',
    ICON.beach,
    '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
    '<circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h1v5h1"/>'
  ];
  h('nav', tabs.map((k,i)=>`<button data-t="${k}" class="${tab===k?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${navIc[i]}</svg>${t.nav[i]}</button>`).join(''));
  tabs.forEach(k=>$('s-'+k).classList.toggle('on',tab===k));
  document.body.dataset.tab = tab;
  renderToday(); renderDine(); renderRelax(); renderExplore(); renderInfo();
  h('foot', `<span class="mark">Hotel Costa Azul ✝️</span>${t.foot}`);
}

const programFor = day => PROGRAM.filter(e=>!e.days || e.days.includes(day));

function renderToday(){
  const t = T[lang], n = nowMx(), today = n.getDay(), cur = n.getHours()*60+n.getMinutes();
  const list = programFor(today);
  const nowE = list.filter(e=>cur>=mins(e.s) && cur<endMins(e.s,e.e)).sort((a,b)=>mins(b.s)-mins(a.s))[0];
  const nextE = list.find(e=>mins(e.s)>cur);
  $('l-now').textContent = t.now; $('l-next').textContent = t.next;
  $('now-what').textContent = nowE ? L(nowE.n) : t.nothingNow;
  $('now-where').textContent = nowE ? `${L(nowE.p)} · ${nowE.s}` : '—';
  $('next-what').textContent = nextE ? L(nextE.n) : t.nothingNext;
  $('next-where').textContent = nextE ? `${L(nextE.p)} · ${nextE.s}` : `${L(list[0].n)} · ${list[0].s}`;
  $('e-schedule').textContent = t.eSchedule; h('h-schedule', t.schedule);

  let d = '';
  for(let i=0;i<7;i++){ const dt = new Date(n); dt.setDate(n.getDate()+i); const wd = dt.getDay();
    d += `<button class="day ${wd===selDay?'on':''}" data-d="${wd}"><div class="d">${t.days[wd]}</div><div class="n">${dt.getDate()}</div></button>`; }
  h('days', d);

  const sh = SHOWS[selDay][lang];
  $('show-badge').textContent = t.tonight;
  $('show-title').textContent = sh[0];
  $('show-desc').textContent = sh[1];
  $('show-venue').textContent = t.theater;

  h('chips', Object.entries(t.filters).map(([k,v])=>`<button class="${filter===k?'on':''}" data-f="${k}">${v}</button>`).join(''));

  const isToday = selDay===today;
  const evs = programFor(selDay).filter(e=>filter==='all'||e.c===filter);
  const sh2 = SHOWS[selDay][lang];
  h('tl', evs.length ? evs.map(e=>{
    const on = isToday && cur>=mins(e.s) && cur<endMins(e.s,e.e);
    const past = isToday && cur>=endMins(e.s,e.e);
    const name = e.n.en==='Nightly show' ? `${L(e.n)}: ${sh2[0]}` : L(e.n);
    return `<div class="ev ${past?'past':''}"><div class="t num">${e.s}</div><div><div class="n">${name}</div><div class="p">${L(e.p)} · ${e.s}–${e.e}</div></div><span class="k ${on?'live':''}">${on?t.live:t.filters[e.c]}</span></div>`;
  }).join('') : `<div class="empty">${t.empty}</div>`);
}

function renderDine(){
  const t = T[lang];
  $('e-dine').textContent = t.eDine; h('h-dine', t.dine); $('p-dine').textContent = t.pDine; $('c-dine').textContent = t.cDine;
  const now = nowMx().getHours()*60 + nowMx().getMinutes();
  h('dine', DINING.map(v=>{
    const open = v.h.some(([s,e])=>now>=mins(s)&&now<mins(e));
    const hrs = v.h.map(([s,e,lbl])=>`<div><span>${L(lbl)||''}</span><span>${s} – ${e}</span></div>`).join('');
    return `<div class="venue"><div class="row"><h4>${v.n}</h4><span class="st ${open?'open':''}"><i></i>${open?t.open:t.closed}</span></div>
      <div class="type micro">${L(v.t)}</div><p>${L(v.d)}</p><div class="hours">${hrs}</div>
      ${v.reserve?`<a class="link" href="#" onclick="toast(T[lang].demoAct);return false">${t.reserve}${ARROW}</a>`:''}</div>`;
  }).join(''));
}

function renderRelax(){
  const t = T[lang];
  $('e-relax').textContent = t.eRelax; h('h-relax', t.relax); $('p-relax').textContent = t.pRelax;
  $('c-pool').textContent = t.cPool; $('c-beach').textContent = t.cBeach;
  h('relax', RELAX.map(r=>`<div><div class="ic">${svg(r.i)}</div><h5>${L(r.n)}</h5><p>${L(r.d)}</p></div>`).join(''));

function renderExplore(){
  const t = T[lang];
  $('e-explore').textContent = t.eExplore; h('h-explore', t.explore); $('p-explore').textContent = t.pExplore;
  h('explore', EXPLORE.map((x,i)=>`<div class="xp">
    <div class="no">${String(i+1).padStart(2,'0')}.</div>
    <div><h4>${L(x.n)}</h4><div class="pr micro">${'$'.repeat(x.pr.length)} · ${x.pr==='$'?'Económico':x.pr==='$$'?'Moderado':'Premium'}</div>
    <p>${L(x.d)}</p>
    <button class="btn-xp" onclick="toast(T[lang].demoAct)">${t.request}${ARROW}</button></div>
  </div>`).join(''));
}

function renderInfo(){
  const t = T[lang];
  $('e-info').textContent = t.eInfo; h('h-info', t.info);
  h('info', INFO.map(([lbl,val,flag])=>{
    const isArr = Array.isArray(val);
    const v = isArr ? L(val) : val;
    const copy = flag==='copy' ? `<span class="copy" onclick="try{navigator.clipboard.writeText('${v}').then(()=>toast(T[lang].copied))}catch(e){toast('${v}')}">${t.copy}</span>` : '';
    return `<div><span>${L(lbl)}</span><b>${v}${copy}</b></div>`;
  }).join(''));
  $('call').textContent = t.call;
  $('e-fb').textContent = t.eFb; h('h-fb', t.fb); $('p-fb').textContent = t.pFb;
  $('fbtext').placeholder = t.fbPh; $('fbsend').textContent = t.send;
  h('rate', [1,2,3,4,5].map(n=>`<button class="${stars>=n?'on':''}" data-s="${n}">★</button>`).join(''));
  if(!$('rate').dataset.bound){
    $('rate').dataset.bound='1';
    $('rate').addEventListener('click',e=>{
      const s=e.target.closest('[data-s]');
      if(s){stars=+s.dataset.s; h('rate',[1,2,3,4,5].map(n=>`<button class="${stars>=n?'on':''}" data-s="${n}">★</button>`).join(''));}
    });
  }
  $('fbsend').onclick=()=>{
    if(!stars){toast(T[lang].pick);return;}
    toast(T[lang].thanks);
    setTimeout(()=>{stars=0;$('fbtext').value='';renderInfo();},1600);
  };
}

/* EVENTS */
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-t]');
  if(btn){tab=btn.dataset.t;render();window.scrollTo(0,0);return;}
  const day = e.target.closest('[data-d]');
  if(day){selDay=+day.dataset.d;renderToday();return;}
  const chip = e.target.closest('[data-f]');
  if(chip){filter=chip.dataset.f;renderToday();return;}
});

$('langSw').addEventListener('click',()=>{
  lang = lang==='es'?'en':'es'; store.set('ca-lang',lang); render();
});

$('rf').addEventListener('click',()=>{
  $('rf').classList.add('spin'); render(); setTimeout(()=>$('rf').classList.remove('spin'),800);
});

render();
</script>
</body>
