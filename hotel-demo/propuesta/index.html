<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propuesta para Ritz Acapulco · MX Studio</title>
<meta name="robots" content="noindex">
<meta name="description" content="Propuesta de MX Studio para Ritz Acapulco: app para huéspedes con códigos QR, panel de gerencia y app de inglés gratis para el personal.">
<meta property="og:title" content="Propuesta para Ritz Acapulco · MX Studio">
<meta property="og:description" content="App para huéspedes con QR, panel de gerencia y app de inglés gratis para su personal.">
<meta property="og:image" content="https://go.myjefetech.app/ritz-acapulco/img/hero.jpg">
<meta name="theme-color" content="#f6f1e8">
<link rel="icon" href="../icons/favicon-32.png">
<style>
@font-face{font-family:Cg;src:url(../fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Cg;src:url(../fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Cg;src:url(../fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2");font-weight:500;font-style:italic}
@font-face{font-family:In;src:url(../fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:In;src:url(../fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:In;src:url(../fonts/inter-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--bg:#f6f1e8;--card:#fffdf9;--ink:#1d1a16;--mut:#6b6257;--line:#e3d8c6;--gold:#b8782a;--teal:#0083a3;--wa:#25d366}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 In,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(246,241,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar b{flex:1;font:600 12px In,sans-serif;letter-spacing:.18em;color:var(--gold)}
.pill{display:flex;background:#ece3d4;border-radius:999px;padding:3px}.pill button{border:0;background:none;color:var(--mut);font:700 13px In,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}.pill button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rf{border:0;width:36px;height:36px;border-radius:50%;background:#ece3d4;color:var(--ink);font-size:17px;cursor:pointer}
.hero{position:relative;height:300px;background:#1d1a16 url(../img/hero.jpg) center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.hero div{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px 18px;color:#fff;max-width:760px;margin:0 auto}
.hero small{font:600 11.5px In,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#f1d3a6}
h1{font:600 clamp(34px,8vw,48px)/1.05 Cg,serif;margin:6px 0 0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
.lead{font:500 italic 21px/1.4 Cg,serif;color:var(--ink);margin:22px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}.tags span{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px}
h2{font:600 28px/1.15 Cg,serif;margin:34px 0 6px}.rule{width:46px;height:1px;background:var(--gold);margin:0 0 14px}
.grid{display:grid;gap:12px}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h3{margin:0 0 8px;font:600 21px/1.2 Cg,serif}
.card ul{margin:0;padding-left:18px}.card li{margin:6px 0;font-size:15px}.card li b{color:var(--gold);font-weight:600}
.gift{border-color:rgba(184,120,42,.55);background:linear-gradient(135deg,#fff8ec,#fffdf9)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px 10px;font:700 14.5px In,sans-serif;cursor:pointer}
.btn.dk{background:var(--ink);color:var(--bg)}.btn.ln{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.wa{background:var(--wa);color:#06290f}
.price{background:var(--ink);color:var(--bg);border:0}.price .k{font:600 11.5px In,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#d9b27a}
.big{font:600 44px/1.05 Cg,serif;color:#f1d3a6;margin-top:4px}.sub{color:#cfc5b6;font-size:14.5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #3a342c;font-size:14.5px}.row:last-child{border:0}.row span:last-child{font-weight:700;text-align:right}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}.steps li{counter-increment:s;position:relative;padding:3px 0 12px 42px;font-size:15px}.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font:600 18px Cg,serif;display:grid;place-items:center}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(246,241,232,.96);border-top:1px solid var(--line)}
footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:30px;line-height:1.6}footer b{color:var(--gold)}
</style>
</head>
<body>
<div class="bar"><b>MX STUDIO ✝</b><div class="pill" id="lang"><button data-l="es" aria-pressed="true">ES</button><button data-l="en" aria-pressed="false">EN</button></div><button class="rf" id="rf" aria-label="Actualizar">↻</button></div>
<div class="hero"><div><small id="kick"></small><h1 id="ttl"></h1></div></div>
<div class="wrap" id="app"></div>
<div class="cta"><a class="btn wa" id="ctaWa" target="_blank" rel="noopener"></a><button class="btn ln" id="ctaSh"></button></div>
<script>
const WA="527441930502",HABLA="https://claude.ai/artifact/EvwhbuJfWUT15dywsAe8HD";
const T={
es:{kick:"Propuesta de MX Studio",title:"App para huéspedes · Ritz Acapulco",lead:"Sus huéspedes escanean un QR en la habitación y tienen todo el hotel en su teléfono, en español e inglés, sin descargar nada.",
tags:["📱 App para huéspedes","🔳 QR en habitaciones","📊 Panel de gerencia","🌎 Español e inglés","📶 Funciona sin internet","🎁 Inglés gratis para su personal"],
hDemo:"Véala funcionando",demoApp:"📱 Ver app de huéspedes",demoPanel:"📊 Ver panel de gerencia",demoNote:"Demo con fotos ilustrativas y datos de ejemplo. Se arma con su información, fotos y horarios reales.",
h1:"Qué incluye",
blocks:[["📱 App para huéspedes",["<b>Hoy:</b> qué está pasando ahora y lo que sigue, programa de 7 días y show de la noche.","<b>Comer:</b> restaurantes y bares con horario y aviso de abierto o cerrado.","<b>Relax:</b> albercas, playa y club de niños.","<b>Explorar:</b> excursiones en Acapulco que se reservan por WhatsApp con su concierge.","<b>Info:</b> WiFi, check-out, teléfonos y reglamento."]],
["⭐ Reputación",["<b>Calificación privada de la estancia:</b> los comentarios llegan a gerencia antes que a Google.","<b>Botón de reseña en Google</b> para huéspedes contentos.","Respuestas más rápidas a cualquier problema durante la estancia."]],
["🔳 Códigos QR",["<b>Tarjeta para cada habitación</b> y tarjetas de mesa, listas para imprimir.","QR ilimitados, probados para que escaneen a la primera.","En su propio dominio (ej. app.ritzacapulco.mx) para que los QR impresos duren."]],
["📊 Panel de gerencia",["Escaneos, huéspedes únicos, idiomas y horas de más uso.","Secciones más vistas y excursiones solicitadas.","Reseñas de Google y comentarios privados en un solo lugar.","Actualiza horarios, show y menús desde el teléfono."]]],
gT:"🎁 Gratis para su personal: Habla",gL:["<b>App para aprender inglés</b> para todas las personas que trabajan en el hotel, sin costo.","Recepción, meseros, camaristas, concierge y seguridad.","3 niveles: primeras palabras, frases útiles y conversación real, con audio para escuchar y repetir.","Mejor atención a huéspedes de Estados Unidos y Canadá."],gB:"👉 Probar Habla",
hP:"Inversión",pk:"Ecosistema digital para hotel",from:"Desde $23,000 MXN",sub:"Todo incluido · primer año incluido",
rows:[["Pagos","Disponibles, desde $13,000"],["Forma de pago","Sin comisiones"],["Hosting desde el 2º año","$400 al mes"],["Códigos QR","Ilimitados (impresión aparte)"],["App de inglés para su personal","Gratis"],["Idiomas","Español e inglés · MXN, US$, CA$"]],
hS:"Cómo empezamos",steps:["Nos comparte horarios, restaurantes, actividades y fotos del hotel.","En pocos días le presentamos su app con su información real.","Imprimimos los QR para habitaciones y mesas, y activamos la app de inglés para su equipo."],
wa:"💬 Me interesa",share:"📤 Compartir",copied:"✓ Link copiado",waMsg:"Hola Brian, vi la propuesta de la app para Ritz Acapulco y me interesa.",
foot:"Propuesta preparada por <b>MX Studio</b> · Acapulco<br>WhatsApp +52 744 193 0502 · No es una app oficial del hotel hasta su aprobación."},
en:{kick:"A proposal from MX Studio",title:"Guest App · Ritz Acapulco",lead:"Your guests scan a QR code in the room and have the whole hotel on their phone, in Spanish and English, with nothing to download.",
tags:["📱 Guest app","🔳 Room QR codes","📊 Management dashboard","🌎 Spanish & English","📶 Works offline","🎁 Free English for your staff"],
hDemo:"See it working",demoApp:"📱 See the guest app",demoPanel:"📊 See the dashboard",demoNote:"Demo with illustrative photos and sample data. Built with your real information, photos and schedules.",
h1:"What's included",
blocks:[["📱 Guest app",["<b>Today:</b> what's on now and next, the 7-day program and tonight's show.","<b>Dine:</b> restaurants and bars with hours and open/closed status.","<b>Relax:</b> pools, beach and kids' club.","<b>Explore:</b> Acapulco excursions booked on WhatsApp with your concierge.","<b>Info:</b> Wi-Fi, check-out, phone numbers and house rules."]],
["⭐ Reputation",["<b>Private stay rating:</b> feedback reaches management before it reaches Google.","<b>Google review button</b> for happy guests.","Faster answers to any issue during the stay."]],
["🔳 QR codes",["<b>A card for every room</b> and table tents, ready to print.","Unlimited QR codes, tested to scan the first time.","On your own domain (e.g. app.ritzacapulco.mx) so printed codes last."]],
["📊 Management dashboard",["Scans, unique guests, languages and busiest hours.","Most viewed sections and excursion requests.","Google reviews and private feedback in one place.","Update schedules, shows and menus from your phone."]]],
gT:"🎁 Free for your staff: Habla",gL:["<b>An app to learn English</b> for everyone who works at the hotel, at no cost.","Front desk, waiters, housekeeping, concierge and security.","3 levels: first words, useful phrases and real conversation, with audio to listen and repeat.","Better service for guests from the US and Canada."],gB:"👉 Try Habla",
hP:"Investment",pk:"Hotel digital ecosystem",from:"From $23,000 MXN",sub:"Everything included · first year included",
rows:[["Payments","Available, from $13,000"],["Payment method","No fees"],["Hosting from year 2","$400 a month"],["QR codes","Unlimited (printing separate)"],["English app for your staff","Free"],["Languages","Spanish & English · MXN, US$, CA$"]],
hS:"How we start",steps:["You share schedules, restaurants, activities and hotel photos.","Within a few days we present your app with your real information.","We print the QR codes for rooms and tables and turn on the English app for your team."],
wa:"💬 I'm interested",share:"📤 Share",copied:"✓ Link copied",waMsg:"Hi Brian, I saw the guest app proposal for Ritz Acapulco and I'm interested.",
foot:"Proposal prepared by <b>MX Studio</b> · Acapulco<br>WhatsApp +52 744 193 0502 · Not an official hotel app until approved."}};
let lang=new URLSearchParams(location.search).get("l")==="en"?"en":"es";try{const s=localStorage.getItem("ritz-prop-lang");if(s&&!new URLSearchParams(location.search).get("l"))lang=s}catch(_){}
const $=id=>document.getElementById(id);
function render(){const t=T[lang];document.documentElement.lang=lang;document.title=(lang==="es"?"Propuesta para Ritz Acapulco":"Proposal for Ritz Acapulco")+" · MX Studio";
 document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));$("kick").textContent=t.kick;$("ttl").textContent=t.title;
 $("app").innerHTML=`<p class="lead">${t.lead}</p><div class="tags">${t.tags.map(x=>`<span>${x}</span>`).join("")}</div>
 <h2>${t.hDemo}</h2><div class="rule"></div><div class="demo"><a class="btn dk" href="../">${t.demoApp}</a><a class="btn ln" href="../panel/">${t.demoPanel}</a></div><p style="color:var(--mut);font-size:13px;margin:8px 0 0">${t.demoNote}</p>
 <h2>${t.h1}</h2><div class="rule"></div><div class="grid">${t.blocks.map(([h,l])=>`<div class="card"><h3>${h}</h3><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
 <div class="card gift" style="grid-column:1/-1"><h3>${t.gT}</h3><ul>${t.gL.map(x=>`<li>${x}</li>`).join("")}</ul><a class="btn dk" style="margin-top:12px" href="${HABLA}" target="_blank" rel="noopener">${t.gB}</a></div></div>
 <h2>${t.hP}</h2><div class="rule"></div><div class="card price"><div class="k">${t.pk}</div><div class="big">${t.from}</div><div class="sub">${t.sub}</div><div style="margin-top:10px">${t.rows.map(([a,b])=>`<div class="row"><span>${a}</span><span>${b}</span></div>`).join("")}</div></div>
 <h2>${t.hS}</h2><div class="rule"></div><div class="card"><ol class="steps">${t.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>
 <footer>${t.foot}</footer>`;
 $("ctaWa").textContent=t.wa;$("ctaWa").href="https://wa.me/"+WA+"?text="+encodeURIComponent(t.waMsg);$("ctaSh").textContent=t.share}
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("ritz-prop-lang",lang)}catch(_){}render()};
$("ctaSh").onclick=async()=>{const t=T[lang],u=location.origin+location.pathname+(lang==="en"?"?l=en":"");try{if(navigator.share){await navigator.share({title:t.title,text:t.lead,url:u});return}}catch(_){return}
 try{await navigator.clipboard.writeText(u);const b=$("ctaSh");b.textContent=t.copied;setTimeout(()=>b.textContent=t.share,1800)}catch(_){location.href="https://wa.me/?text="+encodeURIComponent(t.title+"\n"+u)}};
$("rf").onclick=async()=>{$("rf").textContent="⏳";try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(_){}const q=new URLSearchParams(location.search);q.set("fresh",Date.now());location.replace(location.pathname+"?"+q)};
render();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("../sw.js").catch(()=>{});
</script>
</body>
</html>
