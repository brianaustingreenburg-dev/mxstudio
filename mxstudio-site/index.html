  @media (max-width:860px){ .links a{display:none} .stats{grid-template-columns:1fr 1fr} .stats div:nth-child(2){border-right:0} .stats div:nth-child(-n+2){border-bottom:1px solid var(--line)} .band .wrap{grid-template-columns:1fr} .band .c + .c{border-left:0;border-top:1px solid rgba(201,164,108,.3)} section{padding-top:72px} }
  @media (max-width:520px){ .wrap{padding:0 18px} .brand b{font-size:19px} .hero .wrap{padding-bottom:52px} .stats b{font-size:36px} .work{grid-template-columns:1fr 1fr;gap:16px} .phone{border-width:5px;border-radius:22px} .w h3{font-size:21px} .w p{font-size:13px} .w .tags{display:none} }
