  @font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
  :root{--bone:#f5f0e8;--paper:#fbf8f3;--line:#e3d9c8;--line-2:#d6c8b1;--ink:#14232c;--ink-2:#3a4852;--muted:#6f777d;--brass:#a8834f;--brass-2:#c9a46c;--wa:#1f8f4e;

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;background:var(--bone)}
  body{font-family:var(--sans);color:var(--ink);background:var(--bone);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}

  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  .micro{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;font-weight:500}
  .serif{font-family:var(--serif);font-weight:500}

  /* nav */
  nav{position:fixed;top:0;left:0;right:0;z-index:20;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
  nav.solid{background:rgba(245,240,232,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--line)}
  nav .in{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:12px;color:#fdfaf4}
  nav.solid .brand,nav.solid .links a{color:var(--ink)}
  .brand img{width:38px;height:38px;border-radius:50%}
  .brand b{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:.02em}
  .links{display:flex;gap:28px;align-items:center}
  .links a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#f1e7d6;font-weight:500}
  .sw{position:relative;display:grid;grid-template-columns:1fr 1fr;width:84px;height:30px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(12,23,29,.25);font-size:11px;font-weight:600;letter-spacing:.14em}
  nav.solid .sw{border-color:var(--ink);background:transparent}
  .sw .knob{position:absolute;top:2px;left:2px;width:39px;height:24px;border-radius:999px;background:#fbf8f3;transition:transform .3s cubic-bezier(.4,1.3,.6,1)}
  nav.solid .sw .knob{background:var(--ink)}
  .sw[aria-checked="true"] .knob{transform:translateX(41px)}
  .sw span{position:relative;z-index:1;display:grid;place-items:center;color:#fff;padding-left:.14em;transition:color .3s}
  .sw[aria-checked="false"] .es,.sw[aria-checked="true"] .en{color:var(--ink)}
  nav.solid .sw span{color:var(--ink)} nav.solid .sw[aria-checked="false"] .es,nav.solid .sw[aria-checked="true"] .en{color:#fbf8f3}

  /* hero */
  .hero{position:relative;min-height:min(92vh,820px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#14232c}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.04);animation:kb 20s ease-out forwards}
  @keyframes kb{to{transform:scale(1)}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,23,29,.6) 0%,rgba(12,23,29,.15) 28%,rgba(12,23,29,.5) 55%,rgba(12,23,29,.92) 100%),linear-gradient(90deg,rgba(12,23,29,.6) 0%,rgba(12,23,29,.15) 65%,rgba(12,23,29,0) 100%)}
  .hero h1{text-shadow:0 2px 24px rgba(0,0,0,.35)}
  .hero .wrap{position:relative;z-index:1;padding-bottom:72px;width:100%}
  .hero .k{color:var(--brass-2)}
  .hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(42px,6.4vw,84px);line-height:1;margin-top:16px;max-width:15ch}
  .hero h1 em{color:#e3c693}
  .hero p{font-size:clamp(15px,1.5vw,18px);line-height:1.6;color:#e6ddcf;margin-top:20px;max-width:56ch}
  .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
  .b1,.b2{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;border-radius:2px}
  .b1{background:#fbf8f3;color:var(--ink)}
  .b2{border:1px solid rgba(255,255,255,.6);color:#fff}
  .b1 svg{width:17px;height:17px;color:var(--wa)}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
  .stats div{padding:28px 0 26px;text-align:center;border-right:1px solid var(--line)}
  .stats div:last-child{border-right:0}
  .stats b{display:block;font-family:var(--serif);font-weight:500;font-size:44px;line-height:1}
  .stats span{display:block;margin-top:8px;font-size:12.5px;color:var(--muted)}

  section{padding:96px 0 0}
  .eb{color:var(--brass)}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4.4vw,56px);line-height:1.02;margin-top:12px;max-width:18ch}

  .lead{font-size:16px;line-height:1.65;color:var(--ink-2);margin-top:16px;max-width:60ch}

  /* work */
  .work{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:44px}
  .w{display:flex;flex-direction:column}
  .phone{position:relative;aspect-ratio:390/700;border-radius:30px;overflow:hidden;background:#14232c;border:7px solid #14232c;box-shadow:0 22px 50px rgba(20,35,44,.18)}

  .w .t{margin-top:18px}
  .w .cat{color:var(--brass)}

  .w p{font-size:14px;line-height:1.55;color:var(--ink-2);margin-top:8px}
  .w .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

  .lk{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--brass);padding-bottom:3px;align-self:flex-start}

  /* services */
  .svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;background:var(--paper);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:44px}
  .svc div{background:var(--paper);padding:30px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .fine{font-size:12.5px;line-height:1.6;color:var(--muted);margin-top:14px;max-width:80ch}
  .svc svg{width:30px;height:30px;color:var(--brass)}
  .svc h3{font-family:var(--serif);font-weight:500;font-size:25px;margin-top:16px;line-height:1.1}
  .svc p{font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:8px}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:30px;margin-top:44px;counter-reset:s}
  .steps div{border-top:1px solid var(--line-2);padding-top:20px}
  .steps i{font-family:var(--serif);font-style:italic;font-size:40px;color:var(--brass);line-height:1}
  .steps h3{font-family:var(--serif);font-weight:500;font-size:24px;margin-top:10px}
  .steps p{font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:6px}

  .band{margin-top:96px;background:var(--ink);color:#f1e7d6}
  .band .wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:0}
  .band .c{padding:46px 32px}
  .band .c + .c{border-left:1px solid rgba(201,164,108,.3)}
  .band .k{color:var(--brass-2)}
  .band h3{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.05;margin-top:12px;color:#fdfaf4}
  .band p{font-size:14.5px;line-height:1.6;color:#cfc6b8;margin-top:10px;max-width:44ch}
  .band .lk{color:#fdfaf4;border-color:var(--brass-2)}

  .contact{text-align:center;padding:110px 0 70px}
  .contact h2{margin:12px auto 0;max-width:20ch}
  .contact .lead{margin:16px auto 0}
  .contact .ctas{justify-content:center}
  .contact .b1{background:var(--ink);color:#fbf8f3}
  .contact .b1 svg{color:#5fd38f}
  .contact .b2{border-color:var(--ink);color:var(--ink)}
  .meta{margin-top:26px;font-size:13.5px;color:var(--muted);line-height:1.8}
  footer{border-top:1px solid var(--line);padding:30px 0 40px;text-align:center;font-size:12px;color:var(--muted)}
  footer .mk{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink);display:block;margin-bottom:4px}
  .wa-float{position:fixed;right:18px;bottom:18px;z-index:30;width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
  .wa-float svg{width:28px;height:28px;color:#fff}
  .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}
  .rv.on{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.hero img{animation:none}}
  @media (max-width:860px){ .links a{display:none} .stats{grid-template-columns:1fr 1fr} .stats div:nth-child(2){border-right:0} .stats div:nth-child(-n+2){border-bottom:1px solid var(--line)} .band .wrap{grid-template-columns:1fr} .band .c + .c{border-left:0;border-top:1px solid rgba(201,164,108,.3)} section{padding-top:72px} }
  @media (max-width:520px){ .wrap{padding:0 18px} .brand b{font-size:19px} .hero .wrap{padding-bottom:52px} .stats b{font-size:36px} .work{grid-template-columns:1fr 1fr;gap:16px} .phone{border-width:5px;border-radius:22px} .w h3{font-size:21px} .w p{font-size:13px} .w .tags{display:none} }
</style>
</head>
