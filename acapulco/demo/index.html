<style>
:root{--c:#000000;--bg:#faf6f0;--card:#fff;--line:#ece3d8;--ink:#1d1715;--muted:#776a63;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;font-size:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{position:relative;min-height:230px;background:var(--c);color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.hero img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05) 35%,rgba(0,0,0,.72))}
.hero .wrap{position:relative;z-index:1;width:100%;padding-top:calc(60px + env(safe-area-inset-top));padding-bottom:44px}
.topbar{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top));left:0;right:0}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px}
.demo{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#f3d9a8;font-weight:800;font-size:11px;letter-spacing:.08em;padding:8px 12px;border-radius:999px;text-decoration:none;border:1px solid rgba(243,217,168,.35)}
.pop{margin-top:18px}
.pop h2{font-size:19px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pc{flex:0 0 62%;max-width:240px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(40,25,15,.08)}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#f1e8dc}
.pc .pb{padding:10px 12px 12px}
.pc b{display:block;font-size:15px;line-height:1.2;min-height:36px}
.pc .row{padding-top:6px}
.lang{display:flex;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font-weight:800;font-size:13px;padding:7px 13px;border-radius:999px;color:rgba(255,255,255,.75)}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink)}
.id{display:flex;gap:12px;align-items:center}
.logo{width:64px;height:64px;border-radius:18px;background:#fff;object-fit:cover;flex:0 0 auto;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.logo.txt{display:grid;place-items:center;font-weight:800;font-size:24px;color:var(--c)}
h1{font-size:27px;font-weight:800;line-height:1.08;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.tag{font-size:14px;opacity:.92;margin-top:3px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-26px 0 6px;position:relative;z-index:3}
.q{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:var(--card);border-radius:16px;padding:12px 6px;box-shadow:0 6px 18px rgba(40,25,15,.12);font-weight:800;font-size:13.5px}
.q i{display:block;font-style:normal;font-size:22px;margin-bottom:3px}
.info{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;font-size:14.5px;display:grid;gap:8px}
.info div{display:flex;gap:10px}
.info b{flex:0 0 22px;text-align:center}
.cats{position:sticky;top:0;z-index:5;background:rgba(250,246,240,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:16px -16px 0;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.cats::-webkit-scrollbar{display:none}
.cat{all:unset;cursor:pointer;white-space:nowrap;font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.cat.on{background:var(--c);color:#fff;border-color:transparent}
.sec{font-size:19px;font-weight:800;margin:22px 0 10px;scroll-margin-top:70px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.item img{width:92px;height:92px;border-radius:14px;object-fit:cover;flex:0 0 auto;background:#f1e8dc}
.it{flex:1;min-width:0;display:flex;flex-direction:column}
.it b{font-size:16px;line-height:1.2}
.it small{color:var(--muted);font-size:13.5px;margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.price{font-weight:800;font-size:16px;color:var(--c)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:19px;background:var(--c);color:#fff}
.qty button.m{background:#f0e6da;color:var(--ink)}
.qty span{min-width:14px;text-align:center;font-weight:800}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(250,246,240,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{padding:0;display:flex;gap:8px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;font-weight:800;font-size:14px;padding:14px 8px;border-radius:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-wa{background:var(--wa);color:#063117}
.b-c{background:var(--c);color:#fff;flex:1.6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.box{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.box h3{font-size:19px;font-weight:800;margin-bottom:10px}
.box label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.box input,.box select,.box textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.box .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:10px 0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:11px;border-radius:12px;border:1.5px solid var(--line);font-weight:700}
.seg button.on{border-color:var(--c);background:var(--c);color:#fff}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.btn.g{background:#f0e6da;color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:30px}
.inst{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:22px}
.inst h3{font-size:17px;font-weight:800}
.inst p{color:var(--muted);font-size:13.5px;margin-top:2px}
.os{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 10px}
.os button{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;font-size:14px}
.os button.on{background:var(--c);border-color:var(--c);color:#fff}
.steps{list-style:none;counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:14.5px;align-items:flex-start}
.steps li:before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#f0e6da;color:var(--ink)}
.ibtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;margin-top:12px;padding:13px;border-radius:14px;background:var(--c);color:#fff;font-weight:800}
</style>
</head>
