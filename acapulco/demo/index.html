 const f=(id,l,t="text",ph="")=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(s[id]||"")}" placeholder="${esc(ph)}">`;
 $("box").innerHTML=`<h3>✅ ${u.aT}</h3>${f("aO",u.aOwner)}${f("aW",u.aWa,"tel","744 123 4567")}${f("aN",u.aWn,"text","Infinitum_A1B2")}${f("aP",u.aWp)}
 <label>${u.aOpts}</label><div class="tryo" style="margin:0">${[["aw","waiter",u.oWaiter],["ac","carryout",u.oCarry],["ar","reservations",u.oRes]].map(([id,k,l])=>`<label class="opt ${(s[id]??D[k])?"on":""}"><input type="checkbox" id="${id}" ${(s[id]??D[k])?"checked":""} style="display:none" onchange="this.parentNode.classList.toggle('on',this.checked)"><i>✓</i>${l}</label>`).join("")}<small style="margin:4px 0 0">${u.aMenuOnly}</small></div>
 <label>${u.aStory}</label><textarea id="aS" rows="4">${esc(s.aS||"")}</textarea><label>${u.aMenu}</label><textarea id="aM" rows="2">${esc(s.aM||"")}</textarea>
 <div class="acts"><button class="btn g" data-x="close">${u.cancel}</button><button class="btn b-wa" data-x="asend">${u.aSend}</button></div>`;
 $("sheet").classList.add("on");
}
function openRes(){
 const u=U[lang];const d=new Date().toISOString().slice(0,10);
 $("box").innerHTML=`<h3>${u.rT}</h3><div class="two"><div><label>${u.people}</label><select id="rP">${[1,2,3,4,5,6,7,8,10,12,15,20].map(n=>`<option ${n===2?"selected":""}>${n}</option>`).join("")}</select></div><div><label>${u.rtime}</label><input id="rT" type="time" value="20:00"></div></div>
 <label>${u.date}</label><input id="rD" type="date" value="${d}" min="${d}"><label>${u.name}</label><input id="rN" autocomplete="name">
 <div class="acts"><button class="btn g" data-x="close">${u.cancel}</button><button class="btn b-wa" data-x="rsend">${u.rsend}</button></div>`;
 $("sheet").classList.add("on");
}
document.addEventListener("click",e=>{
 const l=e.target.closest("#lang button");if(l){lang=l.dataset.l;try{localStorage.setItem(KEY+"-lang",lang)}catch(_){}render();return}
 const o=e.target.closest("[data-os]");if(o){os=o.dataset.os;render();return}
 if(e.target.closest("[data-inst]")&&deferred){deferred.prompt();deferred=null;render();return}
 const c=e.target.closest(".cat");if(c){const el=$("c"+c.dataset.c);if(el)el.scrollIntoView({behavior:"smooth"});return}
 const a=e.target.closest("[data-a]");
 if(a){const k=a.dataset.a;if(k==="res")return openRes();if(k==="wifi")return openWifi();if(k==="act")return openAct();if(k==="cart")return openCart();cart[k]=(cart[k]||0)+1;render();return}
 const d=e.target.closest("[data-d]");if(d){cart[d.dataset.d]--;if(!cart[d.dataset.d])delete cart[d.dataset.d];render();return}
 const h=e.target.closest("[data-how]");if(h){how=h.dataset.how;openCart();return}
 const wh=e.target.closest("[data-where]");if(wh){where=wh.dataset.where;openCart();return}
 const tg=e.target.closest("[data-opt]");if(tg){const k=tg.dataset.opt;D[k]=!D[k];if(!canOrder())cart={};render();return}
 if(e.target.closest("#show")){$("show").classList.remove("on");return}
 if(e.target.id==="sheet")return $("sheet").classList.remove("on");
 const x=e.target.closest("[data-x]");if(!x)return;const u=U[lang];
 if(x.dataset.x==="close")return $("sheet").classList.remove("on");
 if(x.dataset.x==="clear"){cart={};render();$("sheet").classList.remove("on");return}
 if(x.dataset.x==="show"){const u=U[lang],its=items().filter(it=>cart[it.id]),m=new URLSearchParams(location.search).get("mesa");
  $("show").innerHTML=`<div class="sw"><small>${esc(D.name)}</small>${m?`<div class="sm">${u.mesa} ${esc(m)}</div>`:""}${its.map(it=>`<div class="si"><b>${cart[it.id]}×</b><span>${esc(tx(it.name))}</span></div>`).join("")}<p>${u.showT}<br><i>${u.showS}</i></p><em>${u.showX}</em></div>`;
  $("sheet").classList.remove("on");$("show").classList.add("on");return}
 if(x.dataset.x==="asend"){const u=U[lang],v=id=>($(id).value||"").trim(),s={aO:v("aO"),aW:v("aW"),aN:v("aN"),aP:$("aP").value,aS:v("aS"),aM:v("aM"),aw:$("aw").checked,ac:$("ac").checked,ar:$("ar").checked};
  try{localStorage.setItem(KEY+"-act",JSON.stringify(s))}catch(_){}
  for(const id of ["aO","aW","aN"]){if(!s[id]||(id==="aW"&&s.aW.replace(/\D/g,"").length<10)){$(id).focus();$(id).style.borderColor="#e0703a";$(id).placeholder=u.aNeed;return}}
  const q=new URLSearchParams(location.search);
  const m=`✅ *ACTIVAR APP · MX Studio ✝*\nID: ${q.get("id")||D.slug}\nNegocio: ${D.name}\nDueño: ${s.aO}\nWhatsApp: ${s.aW}\nWiFi: ${s.aN}\nContraseña WiFi: ${s.aP||"(sin contraseña)"}\nLista para el mesero: ${s.aw?"Sí":"No"}\nPara llevar por WhatsApp: ${s.ac?"Sí":"No"}\nReservar por WhatsApp: ${s.ar?"Sí":"No"}\nHistoria: ${s.aS||"-"}\nCambios al menú: ${s.aM||"-"}\nIdioma: ${lang}`;
  open(`https://api.whatsapp.com/send?phone=${MXW}&text=${encodeURIComponent(m)}`,"_blank");return}
 if(x.dataset.x==="wcopy"){const p=(D.wifi||{}).pass||"",ok=()=>{x.textContent=U[lang].wOk};
  const fb=()=>{const t=document.createElement("textarea");t.value=p;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(_){}t.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(p).then(ok,fb);else fb();return}
 if(x.dataset.x==="send"){const its=items().filter(it=>cart[it.id]);const tot=its.reduce((s,it)=>s+cart[it.id]*(+it.price||0),0);
  const ls=its.map(it=>`• ${cart[it.id]} × ${tx(it.name)} (${money(cart[it.id]*(+it.price||0))})`).join("\n");
  const n=($("fName")||{}).value||"",del=how==="d"&&D.delivery;
  const extra=del?u.delA+(($("fAddr")||{}).value||""):(($("fTime")||{}).value?u.pickT+$("fTime").value:"");
  open(wa(u.mOrder(n,ls,money(tot),del?u.howD:u.howP,extra,($("fNotes")||{}).value||"")),"_blank");return}
 if(x.dataset.x==="rsend"){const dt=$("rD").value?new Date($("rD").value+"T12:00").toLocaleDateString(lang==="es"?"es-MX":"en-US",{weekday:"long",day:"numeric",month:"long"}):"";
  open(wa(u.mRes($("rP").value,dt,$("rT").value,$("rN").value)),"_blank");}
});
// live settings (WhatsApp, WiFi, options) set from Rutas → config.json
const CFGK=["whatsapp","phone","wifi","carryout","reservations","waiter","delivery"];
function applyCfg(c){if(!c||typeof c!=="object")return;CFGK.forEach(k=>{if(c[k]!==undefined&&c[k]!==null&&c[k]!=="")D[k]=c[k]})}
// settings built into the link (?a=…) — made by Rutas, no upload needed
const UA=(()=>{try{const s=new URLSearchParams(location.search).get("a");if(!s)return null;const j=JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));const o=j.o||"";
 return {whatsapp:j.w||"",wifi:j.n?{name:j.n,pass:j.p||""}:null,waiter:o.includes("m"),carryout:o.includes("c"),reservations:o.includes("r")}}catch(_){return null}})();
if(UA&&!D.demo){Object.assign(D,UA);if(UA.whatsapp&&!D.phone)D.phone=UA.whatsapp;
 try{const m=document.querySelector('link[rel="manifest"]');if(m)fetch(m.href).then(r=>r.json()).then(j=>{j.start_url=location.href;j.scope=location.origin+location.pathname;j.icons=(j.icons||[]).map(i=>Object.assign({},i,{src:new URL(i.src,m.href).href}));m.href=URL.createObjectURL(new Blob([JSON.stringify(j)],{type:"application/json"}))}).catch(()=>{})}catch(_){}}
else if(!D.demo){try{applyCfg(JSON.parse(localStorage.getItem(KEY+"-cfg")||"null"))}catch(_){}
 fetch("config.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{if(c){applyCfg(c);try{localStorage.setItem(KEY+"-cfg",JSON.stringify(c))}catch(_){}render()}}).catch(()=>{})}
render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.__PREVIEW__){navigator.serviceWorker.register("../sw.js").catch(()=>{})}
</script>
</body>
</html>
