<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Actividades · Casa Axolotl</title>
<meta name="theme-color" content="#120e1e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sunset1:#f5a623;--sunset2:#e8607a;--purple:#6b3fa0;
  --navy:#1a2457;--ocean:#2563a8;--wave:#4ba3d9;
  --bg:#120e1e;--card:#1c1530;--text:#f5f0ea;--muted:#a09ab8;
  --border:rgba(245,166,35,.18);
}
html{background:var(--bg)}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
.page{max-width:600px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 80px rgba(0,0,0,.6)}

/* header */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#1c1530;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.back{background:none;border:none;color:var(--sunset1);font-size:1.3rem;cursor:pointer;padding:0 4px;line-height:1;-webkit-tap-highlight-color:transparent}
.topbar h1{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;color:var(--text);flex:1}
.lang-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:3px 9px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif}
.lang-btn.on{color:var(--sunset1);border-color:var(--sunset1)}

/* intro */
.intro{padding:16px 16px 4px;font-size:.82rem;color:var(--muted);line-height:1.5}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px;padding:12px 16px 32px}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.card-accent{width:5px;flex-shrink:0}
.card-body{flex:1;padding:14px 14px 12px}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-num{font-size:.65rem;font-weight:600;color:var(--muted);letter-spacing:.06em;width:22px;flex-shrink:0;padding-top:3px}
.card-icon{font-size:1.5rem;flex-shrink:0}
.card-info{flex:1}
.card-name{font-family:'Playfair Display',Georgia,serif;font-size:1rem;line-height:1.25;color:var(--text)}
.card-pr{font-size:.68rem;color:var(--sunset1);letter-spacing:.05em;margin-top:2px}
.card-desc{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:8px}
.card-wa{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(100,220,130,.08);border:1px solid rgba(100,220,130,.2);color:#72e09a;font-size:.75rem;font-weight:600;padding:7px 14px;border-radius:50px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.card-wa:active{opacity:.7}

/* credit */
.credit{text-align:center;padding:0 0 28px;opacity:.35}
.credit a{color:var(--muted);font-size:.65rem;text-decoration:none;letter-spacing:.05em}
.credit strong{color:var(--sunset1)}
</style>
</head>
<body>
<div class="page">

<div class="topbar">
  <button class="back" onclick="history.back()">‹</button>
  <h1 id="hTitle">Actividades</h1>
  <button class="lang-btn on" id="esBtn" onclick="setLang('es')">ES</button>
  <span style="color:#333;font-size:.7rem;padding:0 2px">|</span>
  <button class="lang-btn" id="enBtn" onclick="setLang('en')">EN</button>
</div>

<p class="intro" id="intro">Descubre lo mejor de Pie de la Cuesta y Acapulco. Pregúntanos en recepción para reservar cualquier actividad.</p>

<div class="cards" id="cards"></div>

<div class="credit">
  <a href="https://myjefetech.app" target="_blank">✦ App by <strong>MX Studio</strong> · myjefetech.app</a>
</div>

</div>

<script>
const WA = '527474999032';
const ACT = [
  {ic:'🚣',col:'#2563a8',pr:'$',
   n:{es:'Kayak en Pie de la Cuesta',en:'Kayak at Pie de la Cuesta'},
   d:{es:'Rema entre la laguna de Coyuca y el Pacífico. Uno de los mejores spots de kayak en Acapulco, justo aquí.',en:'Paddle between Coyuca Lagoon and the Pacific. One of the best kayak spots in Acapulco, right here.'},
   msg:{es:'Hola, me gustaría reservar un kayak en Casa Axolotl',en:'Hello, I\'d like to book a kayak at Casa Axolotl'}},
  {ic:'🌅',col:'#e8607a',pr:'$',
   n:{es:'Fogata AcáFree · 7:30 pm',en:'AcáFree Bonfire · 7:30 pm'},
   d:{es:'Reúnete con otros viajeros alrededor de la fogata cada noche. Música, cerveza y el atardecer más famoso de México.',en:'Join fellow travelers around the bonfire every evening. Music, drinks and Mexico\'s most famous sunset.'},
   msg:{es:'Hola, ¿a qué hora es la fogata esta noche?',en:'Hello, what time is the bonfire tonight?'}},
  {ic:'🏄',col:'#f5a623',pr:'$$',
   n:{es:'Surf y tabla en la playa',en:'Surf & board rental'},
   d:{es:'Las olas de Pie de la Cuesta son perfectas para principiantes. Tablas disponibles, instructor opcional.',en:'The waves at Pie de la Cuesta are perfect for beginners. Boards available, instructor optional.'},
   msg:{es:'Hola, me gustaría rentar una tabla de surf',en:'Hello, I\'d like to rent a surfboard'}},
  {ic:'🤿',col:'#16495e',pr:'$$',
   n:{es:'Snorkel en Isla La Roqueta',en:'Snorkeling at La Roqueta Island'},
   d:{es:'Lancha con fondo de cristal, la Virgen de los Mares bajo el agua y arrecife de coral. Incluye equipo.',en:'Glass-bottom boat, the underwater Virgin statue and coral reef. Equipment included.'},
   msg:{es:'Hola, me gustaría info sobre el snorkel en La Roqueta',en:'Hello, I\'d like info about snorkeling at La Roqueta'}},
  {ic:'⚡',col:'#9b6dd4',pr:'$$',
   n:{es:'Paseo en lancha por la laguna',en:'Boat tour of Coyuca Lagoon'},
   d:{es:'Recorre la laguna de Coyuca entre manglares, aves y el canal que separa el Pacífico de la laguna.',en:'Cruise Coyuca Lagoon through mangroves, birds and the channel separating the Pacific from the lagoon.'},
   msg:{es:'Hola, me gustaría reservar un paseo en lancha por la laguna',en:'Hello, I\'d like to book a boat tour of the lagoon'}},
  {ic:'🤸',col:'#b85a3c',pr:'$$$',
   n:{es:'Clavadistas de La Quebrada',en:'La Quebrada Cliff Divers'},
   d:{es:'El espectáculo más famoso de Acapulco: clavados de 35 m al atardecer o de noche. Transporte disponible.',en:'Acapulco\'s most famous show: 35m cliff dives at sunset or after dark. Transport available.'},
   msg:{es:'Hola, me gustaría ir a ver los clavadistas de La Quebrada',en:'Hello, I\'d like to go see the La Quebrada cliff divers'}},
  {ic:'⛵',col:'#0d3446',pr:'$$',
   n:{es:'Paseo en yate por la bahía',en:'Bay cruise by yacht'},
   d:{es:'Recorre la bahía de Acapulco con música, bebidas y vistas a las mansiones de la Costera.',en:'Cruise Acapulco bay with music, drinks and views of the Costera mansions.'},
   msg:{es:'Hola, me gustaría info sobre el paseo en yate',en:'Hello, I\'d like info about the yacht cruise'}},
  {ic:'🏰',col:'#8a6a45',pr:'$',
   n:{es:'Fuerte de San Diego',en:'Fort San Diego'},
   d:{es:'Museo Histórico de Acapulco dentro de una fortaleza del siglo XVII. Media hora en taxi desde aquí.',en:'Acapulco History Museum inside a 17th-century fortress. Half hour by taxi from here.'},
   msg:{es:'Hola, ¿cómo llego al Fuerte de San Diego?',en:'Hello, how do I get to Fort San Diego?'}},
];

let lang = (navigator.language||'es').startsWith('en') ? 'en' : 'es';

function waLink(msg){ return `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`; }

function render(){
  const es = lang==='es';
  document.getElementById('hTitle').textContent = es ? 'Actividades' : 'Activities';
  document.getElementById('intro').textContent = es
    ? 'Descubre lo mejor de Pie de la Cuesta y Acapulco. Pregúntanos en recepción para reservar cualquier actividad.'
    : 'Discover the best of Pie de la Cuesta and Acapulco. Ask at the front desk to book any activity.';
  document.getElementById('esBtn').className = 'lang-btn'+(lang==='es'?' on':'');
  document.getElementById('enBtn').className = 'lang-btn'+(lang==='en'?' on':'');
  document.documentElement.lang = lang;

  document.getElementById('cards').innerHTML = ACT.map((a,i)=>`
    <div class="card">
      <div class="card-accent" style="background:${a.col}"></div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-num">${String(i+1).padStart(2,'0')}</span>
          <span class="card-icon">${a.ic}</span>
          <div class="card-info">
            <div class="card-name">${es?a.n.es:a.n.en}</div>
            <div class="card-pr">${a.pr} · ${a.pr==='$'?(es?'Económico':'Budget'):a.pr==='$$'?(es?'Precio medio':'Mid-range'):(es?'Premium':'Premium')}</div>
          </div>
        </div>
        <p class="card-desc">${es?a.d.es:a.d.en}</p>
        <a class="card-wa" href="${waLink(es?a.msg.es:a.msg.en)}" target="_blank">
          💬 ${es?'Reservar por WhatsApp':'Book via WhatsApp'} ›
        </a>
      </div>
    </div>
  `).join('');
}

function setLang(l){ lang=l; render(); }
render();
</script>
</body>
</html>
