<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Actividades · AcaFree</title>
<meta name="theme-color" content="#1a1a2e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --yellow:#f5e94a;--pink:#e8407a;--navy:#1a1a2e;--navylt:#252545;
  --wave:#5bc8dc;--text:#f5f0ea;--muted:#9898b8;--border:rgba(245,233,74,.2);
}
html{background:var(--navy)}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--navy);overflow-x:hidden}
.page{max-width:600px;margin:0 auto;min-height:100vh;background:var(--navy);box-shadow:0 0 80px rgba(0,0,0,.6)}

/* header */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--navylt);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.back{background:none;border:none;color:var(--yellow);font-size:1.3rem;cursor:pointer;padding:0 4px;line-height:1;-webkit-tap-highlight-color:transparent}
.topbar-logo{width:40px;height:40px;object-fit:contain;border-radius:8px;background:var(--yellow);flex-shrink:0}
.topbar h1{font-size:1rem;font-weight:800;color:var(--text);flex:1;line-height:1.1}
.topbar h1 span{display:block;font-size:.65rem;font-weight:400;color:var(--wave);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.lang-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:3px 9px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif}
.lang-btn.on{color:var(--yellow);border-color:var(--yellow)}

/* intro */
.intro{padding:14px 16px 4px;font-size:.82rem;color:var(--muted);line-height:1.5}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px;padding:12px 16px 32px}
.card{background:var(--navylt);border-radius:14px;overflow:hidden;display:flex;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.card-accent{width:5px;flex-shrink:0}
.card-body{flex:1;padding:14px 14px 12px}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-num{font-size:.65rem;font-weight:600;color:var(--muted);letter-spacing:.06em;width:22px;flex-shrink:0;padding-top:3px}
.card-icon{font-size:1.5rem;flex-shrink:0}
.card-info{flex:1}
.card-name{font-size:1rem;font-weight:700;line-height:1.25;color:var(--text)}
.card-pr{font-size:.68rem;color:var(--yellow);letter-spacing:.05em;margin-top:2px}
.card-desc{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:8px}
.card-wa{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(232,64,122,.12);border:1px solid rgba(232,64,122,.35);color:#f07aa8;font-size:.75rem;font-weight:600;padding:7px 14px;border-radius:50px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.card-wa:active{opacity:.7}

/* credit */
.credit{text-align:center;padding:0 0 28px;opacity:.35}
.credit a{color:var(--muted);font-size:.65rem;text-decoration:none;letter-spacing:.05em}
.credit strong{color:var(--yellow)}
</style>
</head>
<body>
<div class="page">

<div class="topbar">
  <a class="back" href="../">‹</a>
  <img class="topbar-logo" src="../img/acafree-logo.png" alt="AcaFree">
  <h1>AcaFree<span id="hSub">Turismo de Aventura</span></h1>
  <button class="lang-btn on" id="esBtn" onclick="setLang('es')">ES</button>
  <span style="color:#333;font-size:.7rem;padding:0 2px">|</span>
  <button class="lang-btn" id="enBtn" onclick="setLang('en')">EN</button>
</div>

<p class="intro" id="intro">Descubre lo mejor de Pie de la Cuesta y Acapulco. Pregúntanos en recepción para reservar cualquier actividad.</p>

<div class="cards" id="cards"></div>

<div class="credit">
  <a href="https://myjefetech.app" target="_blank">✦ App by <strong>MX Studio</strong> · myjefetech.app</a>
</div>

</div>

<script>
const WA = '527474999032';
const ACT = [
  {ic:'🔥',col:'#e8607a',
   n:{es:'Fogata AcáFree · 7:30 pm',en:'AcáFree Bonfire · 7:30 pm'},
   d:{es:'Reúnete con otros viajeros alrededor de la fogata cada noche. Música, buena compañía y el atardecer más famoso de México. Entrada gratuita.',en:'Join fellow travelers around the bonfire every evening. Music, good company and Mexico\'s most famous sunset. Free entry.'},
   msg:{es:'Hola, ¿a qué hora es la fogata esta noche en Casa Axolotl?',en:'Hello, what time is the bonfire tonight at Casa Axolotl?'}},
];

let lang = (navigator.language||'es').startsWith('en') ? 'en' : 'es';

function waLink(msg){ return `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`; }

function render(){
  const es = lang==='es';
  document.getElementById('hSub').textContent = es ? 'Turismo de Aventura' : 'Adventure Tourism';
  document.getElementById('intro').textContent = es
    ? 'Eventos gratuitos para huéspedes y visitantes. Próximamente más actividades.'
    : 'Free events for guests and visitors. More activities coming soon.';
  document.getElementById('esBtn').className = 'lang-btn'+(lang==='es'?' on':'');
  document.getElementById('enBtn').className = 'lang-btn'+(lang==='en'?' on':'');
  document.documentElement.lang = lang;

  document.getElementById('cards').innerHTML = ACT.map((a,i)=>`
    <div class="card">
      <div class="card-accent" style="background:${a.col}"></div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-num">${String(i+1).padStart(2,'0')}</span>
          <span class="card-icon">${a.ic}</span>
          <div class="card-info">
            <div class="card-name">${es?a.n.es:a.n.en}</div>
            <div class="card-pr">🎟 ${es?'Entrada gratuita':'Free entry'}</div>
          </div>
        </div>
        <p class="card-desc">${es?a.d.es:a.d.en}</p>
        <a class="card-wa" href="${waLink(es?a.msg.es:a.msg.en)}" target="_blank">
          💬 ${es?'Reservar por WhatsApp':'Book via WhatsApp'} ›
        </a>
      </div>
    </div>
  `).join('');
}

function setLang(l){ lang=l; render(); }
render();
</script>
</body>
</html>
