<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa Axolotl</title>
<meta name="theme-color" content="#0d1a1a">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1a1a;
  --card:#132020;
  --gold:#c9963a;
  --gold2:#e8b84b;
  --text:#f0ede6;
  --muted:#8ca8a0;
  --btn-r:#1a3a2a;
  --btn-h:#1f4a30;
  --btn-ho:#2a5a35;
  --btn-a:#0d2535;
  --btn-ac:#1a3a4a;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}
.page{max-width:600px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.5)}

/* ── SLIDESHOW ── */
.slides{position:relative;width:100%;height:320px;overflow:hidden;background:#0a1515}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;background-size:cover;background-position:center}
.slide.active{opacity:1}
.slide-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s}
.dot.on{background:var(--gold)}

/* ── LOGO BAR ── */
.logo-bar{display:flex;align-items:center;gap:12px;background:#0a1515;padding:12px 20px;border-bottom:1px solid rgba(201,150,58,.2)}
.logo-bar img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex-shrink:0}
.logo-bar-text h2{font-size:1.1rem;font-weight:700;color:var(--text);line-height:1.2}
.logo-bar-text p{font-size:.72rem;color:var(--muted);margin-top:2px}

/* ── HEADER ── */
.header{margin-top:16px;text-align:center;padding:0 20px 8px}
.header h1{font-size:1.55rem;font-weight:700;letter-spacing:.02em;color:var(--text)}
.header p{color:var(--muted);font-size:.82rem;margin-top:4px}

/* ── BUTTONS ── */
.btns{display:flex;flex-direction:column;gap:12px;padding:18px 20px 8px}
.btn{display:flex;align-items:center;gap:14px;padding:17px 20px;border-radius:14px;text-decoration:none;font-size:1rem;font-weight:600;color:var(--text);transition:background .18s,transform .12s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-r{background:var(--btn-r)}
.btn-r:hover{background:var(--btn-h)}
.btn-h{background:var(--btn-a)}
.btn-h:hover{background:var(--btn-ac)}
.btn-a{background:#1f1a0d}
.btn-a:hover{background:#2a2410}
.btn-icon{font-size:1.6rem;width:40px;text-align:center;flex-shrink:0}
.btn-text{display:flex;flex-direction:column;line-height:1.25}
.btn-sub{font-size:.72rem;font-weight:400;color:var(--muted);margin-top:2px}
.btn-arr{margin-left:auto;color:var(--gold);font-size:1.1rem;opacity:.7}

/* ── DIVIDER ── */
.divider{height:1px;background:linear-gradient(to right,transparent,rgba(201,150,58,.25),transparent);margin:4px 20px}

/* ── WA BUTTON ── */
.wa-wrap{padding:12px 20px 32px;display:flex;justify-content:center}
.wa-btn{display:flex;align-items:center;gap:10px;background:#1a3320;border:1px solid #2a5235;color:#72e09a;padding:12px 24px;border-radius:50px;font-size:.9rem;font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent}
.wa-btn:active{opacity:.8}
.wa-icon{font-size:1.3rem}

/* ── LANG ── */
.lang-row{display:flex;justify-content:flex-end;padding:6px 20px 0}
.lang-btn{background:none;border:1px solid rgba(201,150,58,.3);color:var(--muted);font-size:.72rem;padding:3px 10px;border-radius:20px;cursor:pointer}
.lang-btn.active{color:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
<div class="page">

<!-- Logo bar -->
<div class="logo-bar">
  <img src="img/logo.png" alt="Casa Axolotl">
  <div class="logo-bar-text">
    <h2>Casa Axolotl</h2>
    <p>Pie de la Cuesta · Acapulco</p>
  </div>
</div>

<!-- Slideshow -->
<div class="slides" id="slides">
  <div class="slide active" style="background-image:url('img/hub1.jpg')"></div>
  <div class="slide" style="background-image:url('img/hub2.jpg')"></div>
  <div class="slide" style="background-image:url('img/hub3.jpg')"></div>
  <div class="slide" style="background-image:url('img/hub4.jpg')"></div>
  <div class="slide" style="background-image:url('img/hub5.jpg')"></div>
  <div class="slide" style="background-image:url('img/hub6.jpg')"></div>
  <div class="slide-dots" id="dots"></div>
</div>

<!-- Lang toggle -->
<div class="lang-row">
  <button class="lang-btn active" id="esBtn" onclick="setLang('es')">ES</button>
  <span style="color:#333;padding:0 4px;font-size:.7rem">|</span>
  <button class="lang-btn" id="enBtn" onclick="setLang('en')">EN</button>
</div>

<!-- Buttons -->
<div class="btns">
  <a class="btn btn-r" href="menu/" id="linkMenu">
    <span class="btn-icon">🍽️</span>
    <span class="btn-text">
      <span id="lblMenu">Restaurante</span>
      <span class="btn-sub" id="subMenu">Menú · Bar · Desayunos</span>
    </span>
    <span class="btn-arr">›</span>
  </a>

  <a class="btn btn-h" href="hotel/" id="linkHotel">
    <span class="btn-icon">🏨</span>
    <span class="btn-text">
      <span id="lblHotel">Hotel</span>
      <span class="btn-sub" id="subHotel">Habitaciones · Servicios · Guía</span>
    </span>
    <span class="btn-arr">›</span>
  </a>

  <a class="btn btn-a" href="https://wa.me/527474999032?text=Hola%2C%20me%20gustar%C3%ADa%20info%20sobre%20actividades%20en%20Acapulco" target="_blank" id="linkAct">
    <span class="btn-icon">🎯</span>
    <span class="btn-text">
      <span id="lblAct">Actividades</span>
      <span class="btn-sub" id="subAct">Kayak · Tours · Aventura</span>
    </span>
    <span class="btn-arr">›</span>
  </a>
</div>

<div class="divider"></div>

<!-- WhatsApp -->
<div class="wa-wrap">
  <a class="wa-btn" href="https://wa.me/527474999032" target="_blank">
    <span class="wa-icon">💬</span>
    <span id="waLabel">Contactar por WhatsApp</span>
  </a>
</div>

<!-- MX Studio credit -->
<div style="text-align:center;padding:0 0 20px;opacity:.45">
  <a href="https://myjefetech.app" target="_blank" style="color:#8ca8a0;font-size:.68rem;text-decoration:none;letter-spacing:.04em">
    ✦ App by <strong style="color:#c9963a">MX Studio</strong> · myjefetech.app
  </a>
</div>

<script>
// Slideshow
const slides=document.querySelectorAll('.slide');
const dotsEl=document.getElementById('dots');
let cur=0,timer;
slides.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===0?' on':'');dotsEl.appendChild(d)});
const dots=dotsEl.querySelectorAll('.dot');
function go(n){slides[cur].classList.remove('active');dots[cur].classList.remove('on');cur=(n+slides.length)%slides.length;slides[cur].classList.add('active');dots[cur].classList.add('on')}
function next(){go(cur+1)}
timer=setInterval(next,3500);
// swipe
let sx=0;
document.getElementById('slides').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.getElementById('slides').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){clearInterval(timer);go(dx<0?cur+1:cur-1);timer=setInterval(next,3500)}},{passive:true});

// Lang
const T={
  es:{tagline:'Acapulco · Hotel & Restaurante',lblMenu:'Restaurante',subMenu:'Menú · Bar · Desayunos',lblHotel:'Hotel',subHotel:'Habitaciones · Servicios · Guía',lblAct:'Actividades',subAct:'Kayak · Tours · Aventura',wa:'Contactar por WhatsApp',linkAct:'https://wa.me/527474999032?text=Hola%2C%20me%20gustar%C3%ADa%20info%20sobre%20actividades%20en%20Acapulco'},
  en:{tagline:'Acapulco · Hotel & Restaurant',lblMenu:'Restaurant',subMenu:'Menu · Bar · Breakfast',lblHotel:'Hotel',subHotel:'Rooms · Amenities · Guest Guide',lblAct:'Activities',subAct:'Kayak · Tours · Adventure',wa:'Contact via WhatsApp',linkAct:'https://wa.me/527474999032?text=Hello%2C%20I%27d%20like%20info%20about%20activities%20in%20Acapulco'}
};
function setLang(l){
  const t=T[l];
  document.getElementById('tagline').textContent=t.tagline;
  document.getElementById('lblMenu').textContent=t.lblMenu;
  document.getElementById('subMenu').textContent=t.subMenu;
  document.getElementById('lblHotel').textContent=t.lblHotel;
  document.getElementById('subHotel').textContent=t.subHotel;
  document.getElementById('lblAct').textContent=t.lblAct;
  document.getElementById('subAct').textContent=t.subAct;
  document.getElementById('waLabel').textContent=t.wa;
  document.getElementById('linkAct').href=t.linkAct;
  document.getElementById('esBtn').classList.toggle('active',l==='es');
  document.getElementById('enBtn').classList.toggle('active',l==='en');
}
</script>
</div><!-- /page -->
</body>
</html>
