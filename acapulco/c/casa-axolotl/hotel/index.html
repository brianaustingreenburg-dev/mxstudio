  if(cur>=0&&cur===H.day.length-1&&n>mins(H.day[cur][0])+150){$("nowT").textContent=t.done;$("nowS").textContent=""}
  else if(nx){$("nowT").textContent=t.next+" · "+fmt(nx[0])+" — "+nx[1][lang];$("nowS").textContent=nx[2][lang]}
  else{const c=H.day[cur];$("nowT").textContent=t.now+" · "+c[1][lang];$("nowS").textContent=c[2][lang]}
  $("exp").innerHTML=H.exp.map(x=>`<article class="card"><img src="${x.img}" alt="" loading="lazy"><div class="b"><h3>${esc(x.h[lang])}</h3><p>${esc(x.p[lang])}</p><div class="tags">${x.t.map(g=>`<span>${esc(g[lang])}</span>`).join("")}</div>${x.wa?`<a class="btn wa" target="_blank" rel="noopener" href="${wa(x.wa[lang])}">💬 ${t.book}</a>`:""}${x.menu?`<a class="btn" href="#rest">🍽️ ${t.seeMenu}</a>`:""}</div></article>`).join("");
  $("room").innerHTML=H.room.map(r=>`<div><i>${r[0]}</i><p><b>${esc(r[1][lang])}</b><span>${esc(r[2][lang])}</span></p></div>`).join("");
  $("near").innerHTML=H.near.map(r=>`<a target="_blank" rel="noopener" href="${wa(t.ask+r[1][lang])}"><i>${r[0]}</i><b>${esc(r[1][lang])}</b><span>${esc(r[2][lang])}</span></a>`).join("");
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("axo-lang",lang)}catch(e){}render()});
$("qWifi").onclick=()=>{const t=T[lang];$("pw").innerHTML=`📶 <b>${esc(H.wifi.net)}</b><br>`+(H.wifi.pass?t.wifiP+`<b>${esc(H.wifi.pass)}</b>`:t.wifiAsk);$("sheet").classList.add("on")};
$("closeS").onclick=$("sheet").onclick=e=>{if(e.target.id==="sheet"||e.target.id==="closeS")$("sheet").classList.remove("on")};

let MENU=[],mcat=0;const MB="/acapulco/c/casa-axolotl/";
function renderMenu(){if(!MENU.length)return;
 $("mcats").innerHTML=MENU.map((c,i)=>`<button class="${i===mcat?"on":""}" data-mc="${i}">${esc(c.cat[lang]||c.cat.es)}</button>`).join("");
 $("mlist").innerHTML=MENU[mcat].items.map(x=>`<div class="mi">${x.img?`<img src="${MB+x.img}" alt="" loading="lazy">`:""}<div><b>${esc(x.name[lang]||x.name.es)}</b><span>${esc((x.desc&&(x.desc[lang]||x.desc.es))||"")}</span></div><em>$${esc(x.price)}</em></div>`).join("");
 document.querySelectorAll("[data-mc]").forEach(b=>b.onclick=()=>{mcat=+b.dataset.mc;renderMenu()})}
fetch(MB+"menu.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(m=>{MENU=m;renderMenu()}).catch(()=>{});
const _r=render;render=function(){_r();renderMenu()};
render();setInterval(render,60000);
</script>
</body>
</html>
