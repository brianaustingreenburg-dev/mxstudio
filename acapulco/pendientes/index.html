 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),W=340,H=220,pad=22;
 const sc=Math.min((W-2*pad)/((x1-x0)||1e-6),(H-2*pad)/((y1-y0)||1e-6));
 const P=pts.map(p=>({...p,x:pad+(p.c[1]*k-x0)*sc+((W-2*pad)-(x1-x0)*sc)/2,y:pad+(-p.c[0]-y0)*sc+((H-2*pad)-(y1-y0)*sc)/2}));
 const line=P.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;background:rgba(255,255,255,.04);border-radius:14px;margin-top:8px"><polyline points="${line}" fill="none" stroke="#d9a35f" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>${P.map(p=>`<g><circle cx="${p.x}" cy="${p.y}" r="11" fill="${p.i===1?"#25d366":"#d98b5f"}" stroke="#120d0b" stroke-width="2"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#120d0b">${p.i}</text></g>`).join("")}</svg>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:.78em;margin-top:6px;opacity:.85">${P.map(p=>`<span><b style="color:var(--gold)">${p.i}</b> ${esc(p.s.n)}</span>`).join("")}</div>`}
function navBlock(r){const t=L(),st=r.stops.filter(s=>CO[s.id]);if(!st.length)return "";const legs=[];let i=0;
 while(i<st.length){const end=Math.min(i+4,st.length),seg=st.slice(i,end),prev=i>0?st[i-1]:null,dest=seg[seg.length-1],way=seg.slice(0,-1);
  const ll=s=>CO[s.id][0]+","+CO[s.id][1];
  let u="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+ll(dest)+"&destination_place_id="+dest.id;
  if(prev)u+="&origin="+ll(prev)+"&origin_place_id="+prev.id;
  if(way.length)u+="&waypoints="+encodeURIComponent(way.map(ll).join("|"))+"&waypoint_place_ids="+encodeURIComponent(way.map(s=>s.id).join("|"));
  legs.push(`<a class="leg" href="${u}" target="_blank" rel="noopener">${end-i===1?"Parada · Stop "+end:t.navP+" "+(i+1)+"–"+end}</a>`);i=end;if(i===st.length-1&&st.length>1){}}
 return `<div class="navb"><b>${t.navT}</b><p>${t.navS}</p><div class="legs">${legs.join("")}</div><details><summary>${t.mapT}</summary>${routeMap(r)}</details></div>`}

function summary(){
 const t=L();const lines=[t.sumT+" · "+new Date().toLocaleDateString(t.locale)];
 DATA.routes.forEach(r=>{const items=r.stops.filter(s=>{const m=st.marks[s.id];return m&&(m.v||m.i||m.f||m.note)});
  if(!items.length)return;lines.push("",t.route+" "+r.num+" · "+F(r,"title"));
  items.forEach(s=>{const m=st.marks[s.id];const f=[m.v?t.sv:"",m.i?t.si:"",m.f?t.sf:""].filter(Boolean).join(", ");
   lines.push("• "+s.n+(f?" — "+f:"")+(m.note?"\n   "+m.note:""))})});
 return lines.length>1?lines.join("\n"):t.none;
}

$("prices").onclick=showPrices;
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.lang=b.dataset.l;save();applyLang();render()};
$("sheet").onclick=e=>{if(e.target.id==="aPub"){publishAct();return}if(e.target.id==="copyL"){const u=e.target.dataset.u;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(L().copied)).catch(()=>toast(u));return}if(e.target.id==="sheet"||e.target.id==="closeSheet")$("sheet").classList.remove("on")};
$("main").addEventListener("click",async e=>{
 const ac=e.target.closest("[data-act]");if(ac){openAct(ac.dataset.act,ac.dataset.nm);return}
 const go=e.target.closest("[data-go]");if(go){if(!navigator.onLine){toast(L().noNet);return}
  const s=DATA.routes.flatMap(r=>r.stops).find(x=>x.id===go.dataset.go);open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.n+" Acapulco")+"&query_place_id="+s.id,"_blank");return}
 if(e.target.closest("#share")){const t=summary();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(_){return}
  try{await navigator.clipboard.writeText(t);toast(L().copied)}catch(_){toast(L().noCopy)};return}
 const a=e.target.closest(".a");if(!a)return;const id=a.closest(".card").dataset.id,m=mk(id);m[a.dataset.k]=m[a.dataset.k]?0:1;
 if(a.dataset.k!=="v"&&m[a.dataset.k])m.v=1;save();
 const y=scrollY;render();scrollTo({top:y});
});
$("main").addEventListener("input",e=>{if(!e.target.matches("[data-note]"))return;const id=e.target.closest(".card").dataset.id;mk(id).note=e.target.value;save()});
const net=()=>document.body.classList.toggle("is-off",!navigator.onLine);addEventListener("online",net);addEventListener("offline",net);net();
applyFs();applyLang();render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("../sw.js").catch(()=>{})}
</script>
<div id="offok" style="position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d7a4a;color:#fff;font:700 13px system-ui,sans-serif;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:99;display:none;white-space:nowrap">✓ Funciona sin internet · Works offline</div>
<script>try{if("serviceWorker"in navigator&&"caches"in window)navigator.serviceWorker.ready.then(()=>caches.match(location.pathname)).then(m=>{if(m){const b=document.getElementById("offok");b.style.display="block";setTimeout(()=>b.style.display="none",2500)}}).catch(()=>{})}catch(e){}</script>
