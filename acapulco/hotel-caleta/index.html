<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hotel Caleta · Demo MX Studio ✝️</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0f2a36">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f8;--card:#fff;--line:#e2eaed;--ink:#0f2a36;--muted:#5f7680;--brand:#1f5e7a;--accent:#e0a43a;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.demo{background:#000;color:#e8c48c;text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;padding:7px 10px;padding-top:calc(7px + env(safe-area-inset-top))}
.hero{background:linear-gradient(160deg,#0f2a36,#1f5e7a 70%,#2f7f8f);color:#fff;padding:16px 0 22px;border-radius:0 0 26px 26px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;letter-spacing:.2em;font-size:12px;color:#cfe6ee}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:99px;padding:3px}
.lang button{all:unset;cursor:pointer;font-weight:700;font-size:12px;padding:6px 12px;border-radius:99px;color:#cfe6ee}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink)}
.room{display:inline-block;margin-top:18px;font-weight:800;font-size:12px;letter-spacing:.14em;background:var(--accent);color:#2a1a05;padding:6px 12px;border-radius:99px}
.hero h1{font-size:26px;font-weight:800;margin-top:8px}
.hero p{color:#cfe6ee;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:3px;min-height:104px;box-shadow:0 2px 10px rgba(15,42,54,.05)}
.tile i{font-style:normal;font-size:24px}
.tile b{font-size:14.5px}
.tile small{color:var(--muted);font-size:12px}
.sec{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--brand);text-transform:uppercase;margin:22px 0 8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.emo{width:48px;height:48px;border-radius:14px;background:#e9f1f4;display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.info{flex:1}.info b{display:block;font-size:14.5px}.info small{color:var(--muted);font-size:12px}
.info .p{font-weight:800;color:var(--brand);font-size:13.5px;margin-top:2px}
.add{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--ink);color:#fff}
.add.on{background:var(--accent);color:#2a1a05}
.charge{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;font-weight:800;font-size:14.5px;padding:14px;border-radius:14px;background:var(--brand);color:#fff;margin-top:6px}
.charge[disabled]{opacity:.45;pointer-events:none}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px}
.wa{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));all:unset;box-sizing:border-box;cursor:pointer;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));text-align:center;font-weight:800;font-size:15px;padding:15px;border-radius:16px;background:var(--wa);color:#063117;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sheet{position:fixed;inset:0;background:rgba(15,42,54,.5);display:none;align-items:flex-end;z-index:30}
.sheet.on{display:flex}
.sheet .box{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:18px;font-weight:800}
.sheet p{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
.sheet input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;margin-bottom:10px}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .row button{all:unset;cursor:pointer;text-align:center;font-weight:800;padding:13px;border-radius:12px}
.cancel{background:#e9f1f4}.ok{background:var(--brand);color:#fff}
.toast{position:fixed;left:50%;top:calc(46px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;padding:12px 16px;border-radius:14px;transition:.25s;z-index:40;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="demo" data-t="demo"></div>
<section class="hero"><div class="wrap">
  <div class="top"><span class="brand">HOTEL CALETA</span>
    <div class="lang" id="lang"><button data-l="es" aria-pressed="true">ES</button><button data-l="en" aria-pressed="false">EN</button></div></div>
  <span class="room" id="room"></span>
  <h1 data-t="welcome"></h1>
  <p data-t="sub"></p>
</div></section>
<div class="wrap">
  <div class="grid" id="tiles"></div>
  <div class="sec" id="rsT" data-t="rs"></div>
  <div id="menu"></div>
  <button class="charge" id="charge"></button>
  <p class="foot" data-t="foot"></p>
</div>
<button class="wa" id="wa" data-t="desk"></button>
<div class="sheet" id="sheet"><div class="box">
  <h3 data-t="vT"></h3><p data-t="vS"></p>
  <input id="last" autocomplete="family-name">
  <div class="row"><button class="cancel" id="cancel" data-t="cancel"></button><button class="ok" id="ok" data-t="confirm"></button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const PHONE="527441930502";
const T={
 es:{demo:"DEMO · MX STUDIO ✝ · Así se vería la app de tu hotel",room:n=>`HABITACIÓN ${n}`,noRoom:"BIENVENIDO",welcome:"Bienvenido a Hotel Caleta",sub:"Todo lo que necesitas durante tu estancia, desde tu teléfono.",
  rs:"Servicio a cuarto",foot:"Ejemplo de muestra creado por MX Studio ✝ · Acapulco",desk:"💬 Hablar con recepción",
  charge:(n,t)=>n?`Cargar a la habitación · ${n} · $${t}`:"Elige del menú",
  vT:"Confirma tu reservación",vS:"Por seguridad, escribe el apellido del huésped principal.",ph:"Apellido",cancel:"Cancelar",confirm:"Confirmar",
  tOrder:n=>`Pedido enviado a cocina. Llega a la Habitación ${n} en unos 30 min.`,tNeed:"Escribe tu apellido para continuar.",tNoRoom:"Escanea el QR de tu habitación para pedir.",
  tiles:[["📶","WiFi","Toca para ver la clave","wifi"],["🧴","Toallas extra","Llegan en 10 min","towels"],["🕛","Check-out","12:00 pm · pedir tarde","late"],["🚤","Tours","Bahía y Pie de la Cuesta","tours"]],
  tWifi:"Red: HotelCaleta-Huespedes · Clave: bahia2026 (ejemplo)",tTowels:n=>`Listo. Toallas en camino a la Habitación ${n}.`,tLate:"Solicitud de salida tarde enviada a recepción.",tTours:"Recepción te comparte los tours de hoy por WhatsApp.",
  wa:n=>`Hola recepción, soy de la Habitación ${n}.`,waNo:"Hola recepción, tengo una pregunta."},
 en:{demo:"DEMO · MX STUDIO ✝ · What your hotel's app would look like",room:n=>`ROOM ${n}`,noRoom:"WELCOME",welcome:"Welcome to Hotel Caleta",sub:"Everything you need during your stay, from your phone.",
  rs:"Room service",foot:"Sample example built by MX Studio ✝ · Acapulco",desk:"💬 Chat with the front desk",
  charge:(n,t)=>n?`Charge to room · ${n} · $${t}`:"Pick from the menu",
  vT:"Confirm your booking",vS:"For security, enter the main guest's last name.",ph:"Last name",cancel:"Cancel",confirm:"Confirm",
  tOrder:n=>`Order sent to the kitchen. Arriving at Room ${n} in about 30 min.`,tNeed:"Enter your last name to continue.",tNoRoom:"Scan your room's QR to order.",
  tiles:[["📶","WiFi","Tap for the password","wifi"],["🧴","Extra towels","Arrive in 10 min","towels"],["🕛","Check-out","12:00 pm · ask for late","late"],["🚤","Tours","Bay & Pie de la Cuesta","tours"]],
  tWifi:"Network: HotelCaleta-Guests · Password: bahia2026 (sample)",tTowels:n=>`Done. Towels on the way to Room ${n}.`,tLate:"Late check-out request sent to the front desk.",tTours:"The front desk will share today's tours on WhatsApp.",
  wa:n=>`Hi front desk, this is Room ${n}.`,waNo:"Hi front desk, I have a question."}
};
const MENU=[
 {id:1,e:"🍳",p:210,es:["Desayuno mexicano","Huevos, frijoles, fruta y café"],en:["Mexican breakfast","Eggs, beans, fruit and coffee"]},
 {id:2,e:"🥗",p:190,es:["Ensalada de mango y camarón","Ligera y fresca"],en:["Mango shrimp salad","Light and fresh"]},
 {id:3,e:"🍔",p:240,es:["Hamburguesa Caleta","Con papas"],en:["Caleta burger","With fries"]},
 {id:4,e:"🍹",p:120,es:["Margarita","Limón o mango"],en:["Margarita","Lime or mango"]},
 {id:5,e:"☕",p:55,es:["Café de olla","Con canela"],en:["Café de olla","With cinnamon"]}
];
const $=id=>document.getElementById(id);
let lang="es",cart={};
try{lang=localStorage.getItem("hc-lang")||((navigator.language||"es").toLowerCase().startsWith("es")?"es":"en")}catch(e){}
const hab=(new URLSearchParams(location.search).get("hab")||"").replace(/[^0-9A-Za-z]/g,"").slice(0,5);
const n=()=>Object.values(cart).reduce((a,b)=>a+b,0),tot=()=>MENU.reduce((s,m)=>s+(cart[m.id]||0)*m.p,0);
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),3000)}
function render(){
 const u=T[lang];document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=u[el.dataset.t]);
 $("lang").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 $("room").textContent=hab?u.room(hab):u.noRoom;$("last").placeholder=u.ph;
 $("tiles").innerHTML=u.tiles.map(t=>`<button class="tile" data-k="${t[3]}"><i>${t[0]}</i><b>${t[1]}</b><small>${t[2]}</small></button>`).join("");
 $("menu").innerHTML=MENU.map(m=>`<div class="item"><div class="emo">${m.e}</div><div class="info"><b>${m[lang][0]}</b><small>${m[lang][1]}</small><div class="p">$${m.p}</div></div><button class="add ${cart[m.id]?"on":""}" data-a="${m.id}">${cart[m.id]||"+"}</button></div>`).join("");
 $("charge").textContent=u.charge(n(),tot());$("charge").disabled=!n();
}
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("hc-lang",lang)}catch(_){}render()};
$("menu").onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;const id=a.dataset.a;cart[id]=((cart[id]||0)+1)%4;if(!cart[id])delete cart[id];render()};
$("tiles").onclick=e=>{const t=e.target.closest(".tile");if(!t)return;const u=T[lang],k=t.dataset.k;
 if(k==="wifi")toast(u.tWifi);else if(k==="tours")toast(u.tTours);else if(!hab)toast(u.tNoRoom);else if(k==="towels")toast(u.tTowels(hab));else toast(u.tLate)};
$("charge").onclick=()=>{if(!hab){toast(T[lang].tNoRoom);return}$("last").value="";$("sheet").classList.add("on");setTimeout(()=>$("last").focus(),50)};
$("cancel").onclick=()=>$("sheet").classList.remove("on");
$("ok").onclick=()=>{if($("last").value.trim().length<2){toast(T[lang].tNeed);return}$("sheet").classList.remove("on");toast(T[lang].tOrder(hab));cart={};render()};
$("wa").onclick=()=>{const u=T[lang];open(`https://api.whatsapp.com/send?phone=${PHONE}&text=${encodeURIComponent(hab?u.wa(hab):u.waNo)}`,"_blank")};
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}))}
</script>
</body>
</html>
