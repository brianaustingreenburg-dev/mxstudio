body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.35;padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}

.tab i{display:block;font-style:normal;font-size:19px;margin-bottom:1px}

.wrap{max-width:620px;margin:0 auto;padding:14px}
h2{font-size:22px;margin:4px 0 4px}
.hint{color:var(--muted);font-size:14px;margin-bottom:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}

.toast.on{opacity:1;transform:translate(-50%,0)}

 return `<h2>${t.menuH}</h2><p class="hint">${t.menuHint}</p>`+D.menu.map((c,ci)=>`<div class="cat"><div class="cath"><span class="num">${t.cat} ${ci+1}</span></div>

   ${field(t.price,`menu.${ci}.items.${ii}.price`,"number","180")}
   <label>${t.photo}</label><div class="row" style="margin-top:0"><button class="btn sm" data-iimg="${k}">${t.pick}</button>${it.img?`<button class="btn sm red" data-irm="${k}">${t.remove}</button>`:""}</div>
   <div class="row"><button class="btn sm" data-mv="${k}|-1">${t.up}</button><button class="btn sm" data-mv="${k}|1">${t.down}</button><button class="btn sm red" data-idel="${k}">${t.del}</button></div></div>`:""}</div>`}).join("")}</div>
  <div class="row"><button class="btn gold sm" data-additem="${ci}">${t.addItem}</button>${D.menu.length>1?`<button class="btn sm red" data-delcat="${ci}">${t.delCat}</button>`:""}</div>
  <details class="quick" style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted);font-weight:700;font-size:14px">⚡ ${t.quickH}</summary><p class="hint" style="margin:6px 0">${t.quickHint}</p><textarea id="q${ci}" placeholder="Ceviche de pescado | Fish ceviche | 180&#10;Tacos de pescado | Fish tacos | 150"></textarea><button class="btn sm" style="margin-top:6px" data-quick="${ci}">${t.quickBtn}</button></details>
 </div>`).join("")+`<button class="btn full" data-addcat="1">${t.addCat}</button><p class="saved">💾 ${t.autosave}</p>`}
function pPrev(){const t=T();return `<h2>${t.prevH}</h2><p class="hint">${t.prevHint}</p><div class="preview"><iframe id="pf" title="preview"></iframe></div>`}
function pPub(){const t=T();const key=getKey();const exists=pubList&&D.slug&&pubList.includes(D.slug);
 return `<h2>${t.pubH}</h2><p class="hint">${t.pubHint}</p>
 ${!navigator.onLine?`<div class="status err">${t.offline}</div>`:""}
 ${!key?`<div class="status err">${t.needKey}</div>`:""}
 <div class="card"><div class="hint" style="margin:0">${t.link}</div><div class="link">${SITE}${esc(D.slug||"…")}/</div>${exists?`<div class="status">${t.exists}</div>`:""}</div>
 <button class="btn gold full" data-publish="1" ${!key?"disabled":""}>${t.pubBtn}</button><div id="pubStatus"></div>
 ${lastPub&&lastPub.slug===D.slug?pubResult():""}`}
function pubResult(){const t=T(),u=SITE+D.slug+"/";
 return `<div class="card" style="margin-top:12px;text-align:center"><div class="status ok" style="margin:0 0 8px">${t.pubOk}</div><div class="link">${u}</div><div class="qr" id="qrBox"></div>
 <div class="row" style="justify-content:center"><button class="btn sm" data-dlqr="1">${t.dlQr}</button><button class="btn sm" data-copy="${u}">${t.copy}</button><a class="btn sm" href="${u}" target="_blank" rel="noopener">${t.open}</a></div></div>`}
function pSet(){const t=T(),key=getKey();
 return `<h2>${t.appsH}</h2><p class="hint">${t.appsHint}</p><div class="card list" id="appList">${t.loading}</div>
 <div class="row" style="margin:-4px 0 14px"><button class="btn gold sm" data-new="1">＋ ${t.newApp}</button><button class="btn sm" data-loadpub="1">${t.loadPub}</button></div>
 <h2>${t.instH}</h2><p class="hint">${t.instHint}</p><div class="card"><div class="os"><button data-os="ios" class="${os==="ios"?"on":""}">iPhone</button><button data-os="and" class="${os==="and"?"on":""}">Android</button></div><ol class="steps">${t[os].map(s=>`<li>${s}</li>`).join("")}</ol></div>
 <h2>${t.keyH}</h2><p class="hint">${t.keyHint}</p><div class="card"><ol class="steps">${t.keySteps.map(s=>`<li>${s}</li>`).join("")}</ol>
 <label>${t.key}</label><input type="text" id="ghKey" value="${esc(key)}" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
 <div class="row"><button class="btn gold sm" data-savekey="1">${t.save}</button><button class="btn sm" data-testkey="1">${t.test}</button></div><div id="keyStatus"></div></div>`}
async function fillApps(){const t=T();const el=$("appList");if(!el)return;const ds=(await allDrafts()).sort((a,b)=>b.updated-a.updated);
 let h=`<div class="hint" style="margin:0 0 4px;font-weight:800">${t.drafts}</div>`+(ds.length?ds.map(d=>`<div class="li"><b>${esc(d.name||t.untitled)}<small>${d.publishedSlug?"🌐 "+esc(d.publishedSlug):"📝"} · ${new Date(d.updated).toLocaleDateString()}</small></b><button class="btn sm" data-edit="${d.id}">${t.edit}</button><button class="btn sm red" data-deld="${d.id}">✕</button></div>`).join(""):`<div class="hint">${t.none}</div>`);
 if(pubList)h+=`<div class="hint" style="margin:12px 0 4px;font-weight:800">${t.published}</div>`+(pubList.length?pubList.map(s=>`<div class="li"><b>${esc(s)}<small>${SITE}${esc(s)}/</small></b><button class="btn sm" data-editpub="${esc(s)}">${t.edit}</button></div>`).join(""):`<div class="hint">${t.none}</div>`);
 el.innerHTML=h}
function renderFoot(){const t=T();$("foot").innerHTML=tab<2?`<button class="btn" data-tab="${tab===0?1:0}">${tab===0?"📖 "+t.tabs[1][1]:"🏪 "+t.tabs[0][1]}</button><button class="btn gold" data-tab="2">👀 ${t.tabs[2][1]}</button>`:tab===2?`<button class="btn" data-tab="1">📖 ${t.tabs[1][1]}</button><button class="btn gold" data-tab="3">🚀 ${t.tabs[3][1]}</button>`:`<button class="btn" data-tab="0">🏪 ${t.tabs[0][1]}</button><button class="btn" data-tab="2">👀 ${t.tabs[2][1]}</button>`}
function render(){renderTop();if(!D&&tab!==4)tab=4;
 $("main").innerHTML=[pBiz,pMenu,pPrev,pPub,pSet][tab]();renderFoot();
 if(tab===2)loadPreview();if(tab===4)fillApps();if(tab===3&&lastPub&&lastPub.slug===D.slug)drawQR()}
/* ---------- build app from template ---------- */
let TPL=null;
async function template(){if(TPL)return TPL;const r=await fetch("../app/plantilla.html",{cache:"no-cache"});if(!r.ok)throw new Error("plantilla "+r.status);TPL=await r.text();return TPL}
function appData(d,forPub){const o={slug:d.slug,name:d.name.trim(),tagline:d.tagline,color:d.color,logo:d.logo,cover:d.cover,whatsapp:waNum(d.whatsapp),phone:waNum(d.phone||d.whatsapp),address:d.address,map:d.map,hours:d.hours,wifi:(d.wifi&&String(d.wifi.name||"").trim())?{name:String(d.wifi.name).trim(),pass:String(d.wifi.pass||"")}:null,
 reservations:d.reservations,carryout:d.carryout,waiter:d.waiter!==false,delivery:d.delivery,menu:d.menu.map(c=>({cat:c.cat,items:c.items.map(it=>({name:it.name,desc:it.desc,price:String(it.price||"").replace(/[^0-9.]/g,""),img:it.img}))})).filter(c=>c.items.length)};return o}
function waNum(v){let n=String(v||"").replace(/\D/g,"");if(n.length===10)n="52"+n;if(n.length===12&&n.startsWith("52"))return n;if(n.startsWith("521")&&n.length===13)return "52"+n.slice(3);return n}
const escA=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fill(tpl,d,preview){const icon=d.logo||"../../icon-192.png";let out=tpl.replace("/*__DATA__*/null",JSON.stringify(d).replace(/</g,"\\u003c"));
 const m={"__TITLE__":d.name,"__DESC__":(d.tagline&&d.tagline.es)||d.name,"__COLOR__":d.color,"__ICON__":icon,"__SHORT__":d.name.slice(0,14)};
 for(const k in m)out=out.split(k).join(escA(m[k]));
 if(preview)out=out.replace("<head>",`<head><script>window.__PREVIEW__=true;try{Object.defineProperty(window,"localStorage",{value:{getItem:()=>null,setItem:()=>{}}})}catch(e){}<\/script>${d.slug&&D.publishedSlug?`<base href="${location.origin}/acapulco/c/${D.publishedSlug}/">`:""}`);
 return out}
async function loadPreview(){try{const tpl=await template();const d=appData(D);if(!d.menu.length)d.menu=[{cat:{es:"Menú",en:"Menu"},items:[]}];if(!d.name)d.name=T().untitled;$("pf").srcdoc=fill(tpl,d,true)}catch(e){$("pf").srcdoc=`<p style="font-family:sans-serif;padding:20px">${esc(T().offline)}<br>${esc(e.message)}</p>`}}
/* ---------- GitHub publish (one commit) ---------- */
async function gh(path,opt={}){const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+path,Object.assign({},opt,{headers:Object.assign({"Authorization":"Bearer "+getKey(),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.body?{"Content-Type":"application/json"}:{})}));
 if(!r.ok){let m=r.status+"";try{m+=" "+(await r.json()).message}catch(e){}throw new Error(m)}return r.status===204?null:r.json()}
const b64u=s=>btoa(unescape(encodeURIComponent(s)));
async function sha8(s){const h=await crypto.subtle.digest("SHA-1",new TextEncoder().encode(s));return Array.from(new Uint8Array(h)).slice(0,5).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function publish(){const t=T(),st=$("pubStatus");const say=(m,c)=>st.innerHTML=`<div class="status ${c||""}">${m}</div>`;
 if(!D.name.trim())return say(t.needName,"err");if(waNum(D.whatsapp).length<12)return say(t.needWa,"err");if(!D.menu.some(c=>c.items.length))return say(t.needMenu,"err");
 if(!D.slug)D.slug=slugify(D.name);const slug=D.slug,base="acapulco/c/"+slug+"/";
 try{say(t.pubbing);
  const tpl=await template();const d=appData(D,true);const files=[];
  const conv=async v=>{if(!v||!v.startsWith("data:"))return v;const b=v.split(",")[1];const p="img/"+(await sha8(b))+".jpg";files.push({path:base+p,b64:b});return p};
  d.logo=await conv(d.logo);d.cover=await conv(d.cover);
  for(const c of d.menu)for(const it of c.items)it.img=await conv(it.img);
  files.push({path:base+"index.html",b64:b64u(fill(tpl,d,false))});
  const icon=d.logo||"../../icon-192.png";
  files.push({path:base+"manifest.json",b64:b64u(JSON.stringify({name:d.name,short_name:d.name.slice(0,14),start_url:"./",scope:"./",display:"standalone",background_color:"#faf6f0",theme_color:d.color,icons:[{src:icon,sizes:"192x192",type:"image/png"},{src:icon,sizes:"512x512",type:"image/png"}]}))});
  files.push({path:base+"datos.json",b64:b64u(JSON.stringify(d,null,1))});
  const ref=await gh("/git/ref/heads/"+BRANCH);const head=ref.object.sha;const com=await gh("/git/commits/"+head);
  const tree=[];let i=0;for(const f of files){i++;say(`${t.pubbing} ${i}/${files.length}`);const bl=await gh("/git/blobs",{method:"POST",body:JSON.stringify({content:f.b64,encoding:"base64"})});tree.push({path:f.path,mode:"100644",type:"blob",sha:bl.sha})}
  const nt=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:com.tree.sha,tree})});
  const nc=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:"App "+d.name+" ✝️ (Crear app)",tree:nt.sha,parents:[head]})});
  await gh("/git/refs/heads/"+BRANCH,{method:"PATCH",body:JSON.stringify({sha:nc.sha})});
  // keep the draft's photos as their online paths (smaller draft, same app)
  D.logo=d.logo;D.cover=d.cover;
  const flat=d.menu.flatMap(c=>c.items);let k=0;
  D.menu.forEach(c=>c.items.forEach(it=>{const f=flat[k++];if(f)it.img=f.img}));
  D.publishedSlug=slug;save();lastPub={slug};if(pubList&&!pubList.includes(slug))pubList.push(slug);st.innerHTML="";render();
 }catch(e){say(t.pubErr+e.message,"err")}}
function drawQR(){const box=$("qrBox");if(!box)return;const u=SITE+D.slug+"/";
 if(!window.qrcode){box.innerHTML=`<div style="color:#000;font-size:13px">QR…</div>`;setTimeout(drawQR,500);return}
 const q=qrcode(0,"M");q.addData(u);q.make();const n=q.getModuleCount(),s=10,m=4,c=document.createElement("canvas");c.width=c.height=(n+m*2)*s;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*s,(r+m)*s,s,s);box.innerHTML="";box.appendChild(c)}
/* ---------- events ---------- */
function setPath(p,v){const ks=p.split(".");let o=D;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
document.addEventListener("input",e=>{const p=e.target.dataset.p;if(!p||!D)return;let v=e.target.value;
 if(p==="slug"){v=slugify(v);}
 setPath(p,v);if(p==="name"&&!D.publishedSlug){D.slug=slugify(v);const s=document.querySelector('[data-p="slug"]');if(s)s.value=D.slug;const h=s&&s.nextElementSibling;if(h)h.innerHTML=SITE+"<b>"+esc(D.slug||"…")+"</b>/";$("curName").textContent=D.name||T().untitled}
 if(p==="color")document.querySelectorAll("[data-color]").forEach(b=>b.classList.toggle("on",b.dataset.color===v));
 save()});
document.addEventListener("click",async e=>{const g=s=>e.target.closest(s);let el;
 if(el=g("#lang button")){lang=el.dataset.l;try{localStorage.setItem("crear-lang",lang)}catch(_){}render();return}
 if(el=g("[data-tab]")){if(!D&&+el.dataset.tab!==4){toast(T().newApp+" ↓");tab=4}else tab=+el.dataset.tab;render();scrollTo({top:0});return}
 if(el=g("[data-os]")){os=el.dataset.os;render();return}
 if(el=g("[data-tog]")){D[el.dataset.tog]=!D[el.dataset.tog];el.setAttribute("aria-pressed",D[el.dataset.tog]);save();return}
 if(el=g("[data-color]")){D.color=el.dataset.color;save();render();return}
 if(el=g("[data-img]")){const k=el.dataset.img;const v=await pickImg(k==="cover"?1400:600);if(v){D[k]=v;save();render()}return}
 if(el=g("[data-rmimg]")){D[el.dataset.rmimg]="";save();render();return}
 if(el=g("[data-open]")){open1=open1===el.dataset.open?null:el.dataset.open;render();return}
 if(el=g("[data-additem]")){const ci=+el.dataset.additem;D.menu[ci].items.push({name:{es:"",en:""},desc:{es:"",en:""},price:"",img:""});open1=ci+"-"+(D.menu[ci].items.length-1);save();render();return}
 if(el=g("[data-addcat]")){D.menu.push({cat:{es:"",en:""},items:[]});save();render();return}
 if(el=g("[data-delcat]")){const ci=+el.dataset.delcat;if(confirm(T().delCat+"?")){D.menu.splice(ci,1);save();render()}return}
 if(el=g("[data-idel]")){const[ci,ii]=el.dataset.idel.split("-").map(Number);D.menu[ci].items.splice(ii,1);open1=null;save();render();return}
 if(el=g("[data-mv]")){const[k,dir]=el.dataset.mv.split("|");const[ci,ii]=k.split("-").map(Number);const a=D.menu[ci].items,j=ii+(+dir);if(j<0||j>=a.length)return;[a[ii],a[j]]=[a[j],a[ii]];open1=ci+"-"+j;save();render();return}
 if(el=g("[data-iimg]")){const[ci,ii]=el.dataset.iimg.split("-").map(Number);const v=await pickImg(900);if(v){D.menu[ci].items[ii].img=v;save();render()}return}
 if(el=g("[data-irm]")){const[ci,ii]=el.dataset.irm.split("-").map(Number);D.menu[ci].items[ii].img="";save();render();return}
 if(el=g("[data-quick]")){const ci=+el.dataset.quick,ta=$("q"+ci);const lines=ta.value.split("\n").map(s=>s.trim()).filter(Boolean);
  lines.forEach(l=>{const p=l.split("|").map(s=>s.trim());let es=p[0]||"",en="",pr="";if(p.length>=3){en=p[1];pr=p[2]}else if(p.length===2){if(/^\$?\d/.test(p[1]))pr=p[1];else en=p[1]}else{const m=es.match(/^(.*?)[\s\-–:]+\$?\s*(\d[\d.,]*)$/);if(m){es=m[1];pr=m[2]}}
   D.menu[ci].items.push({name:{es,en},desc:{es:"",en:""},price:pr.replace(/[^0-9.]/g,""),img:""})});save();render();toast("+"+lines.length);return}
 if(g("[data-publish]")){publish();return}
 if(g("[data-dlqr]")){const c=document.querySelector("#qrBox canvas");if(!c)return;const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="QR-"+D.slug+".png";a.click();return}
 if(el=g("[data-copy]")){try{await navigator.clipboard.writeText(el.dataset.copy);toast(T().copied)}catch(_){toast(el.dataset.copy)}return}
 if(g("[data-new]")){D=blank();await putDraft(D);lastPub=null;open1=null;tab=0;render();return}
 if(el=g("[data-edit]")){D=await getDraft(el.dataset.edit);lastPub=null;open1=null;tab=0;render();return}
 if(el=g("[data-deld]")){if(confirm(T().confirmDel)){await delDraft(el.dataset.deld);if(D&&D.id===el.dataset.deld)D=null;render()}return}
 if(g("[data-loadpub]")){$("appList").innerHTML=T().loading;try{const r=await gh("/contents/acapulco/c?ref="+BRANCH);pubList=r.filter(x=>x.type==="dir").map(x=>x.name).sort()}catch(err){toast(T().keyBad+err.message);pubList=null}fillApps();return}
 if(el=g("[data-editpub]")){const s=el.dataset.editpub;try{const r=await fetch("../c/"+s+"/datos.json",{cache:"no-cache"});if(!r.ok)throw new Error(r.status);const d=await r.json();
  const ds=await allDrafts();const ex=ds.find(x=>x.publishedSlug===s);
  D=Object.assign(blank(),d,{id:ex?ex.id:"d"+Date.now(),publishedSlug:s,slug:s,whatsapp:String(d.whatsapp||"").replace(/^52/,""),phone:String(d.phone||"").replace(/^52/,"")});
  D.menu.forEach(c=>c.items.forEach(it=>{it.desc=it.desc||{es:"",en:""};it.name=it.name||{es:"",en:""}}));await putDraft(D);lastPub=null;tab=0;render()}catch(err){toast("⚠️ "+err.message)}return}
 if(g("[data-savekey]")){try{localStorage.setItem("crear-gh",$("ghKey").value.trim())}catch(_){}toast(T().keySaved);return}
 if(g("[data-testkey]")){try{localStorage.setItem("crear-gh",$("ghKey").value.trim())}catch(_){}const ks=$("keyStatus");ks.innerHTML=`<div class="status">${T().loading}</div>`;
  try{const r=await gh("");ks.innerHTML=`<div class="status ok">${T().keyOk} · ${esc(r.full_name)}</div>`}catch(err){ks.innerHTML=`<div class="status err">${T().keyBad}${esc(err.message)}</div>`}return}
});
(async()=>{try{const ds=(await allDrafts()).sort((a,b)=>b.updated-a.updated);D=ds[0]||null}catch(e){D=null}if(!D){D=blank();try{await putDraft(D)}catch(e){}}render()})();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("../sw.js").catch(()=>{})}
