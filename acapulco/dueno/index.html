 const cnt={};R.forEach(x=>{const n=x.n||(es?"Sin nombre":"No name");cnt[n]=(cnt[n]||0)+1});const rk=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);

function revIdeas(){const L=window.MX_REV||[];if(!L.length)return "";const es=lang==="es",nm=D.name||slug,H=es?["Fácil, gratis","Fácil","Lo revisamos"]:["Easy, free","Easy","We check it"];
 return `<details style="margin-top:12px;border:1px solid #eadfd3;border-radius:14px;padding:10px 12px;background:#fff"><summary style="cursor:pointer;font-weight:800">💡 ${es?"Ideas para conseguir más reseñas":"Ideas to get more reviews"}</summary>

// ---------- 🧰 Setup guides ----------
function stGet(){try{return JSON.parse(localStorage.getItem("mx-setup-"+slug)||"{}")}catch(_){return {}}}
function stSet(o){try{localStorage.setItem("mx-setup-"+slug,JSON.stringify(o))}catch(_){}}
function setupCard(){const L=window.MX_SETUP||[];if(!L.length)return "";const es=lang==="es",done=stGet(),n=L.filter(x=>done[x.k]).length,nm=D.name||slug;
 const money=v=>"$"+v.toLocaleString("en-US");
 return `<div class="card" id="setup"><h2>🧰 ${es?"Configura todo, paso a paso":"Set up everything, step by step"}</h2>
 <p>${es?`<b>${n} de ${L.length}</b> listos. Hazlo tú con estas guías, o pídeme que lo haga yo.`:`<b>${n} of ${L.length}</b> done. Do it yourself with these guides, or ask me to do it for you.`}</p>
 <div style="height:8px;background:#eadfd3;border-radius:9px;overflow:hidden;margin:6px 0 10px"><div style="height:100%;width:${Math.round(n/L.length*100)}%;background:#25d366"></div></div>
 ${L.map(x=>{const t=x[es?"es":"en"],ok=!!done[x.k],pr=x.price?money(x.price)+(t.n?" "+t.n:""):(es?"incluido":"included");
  const msg=(es?`Hola Brian, quiero que me hagas: ${t.d} (${pr}) para ${nm}.`:`Hi Brian, please do this for me: ${t.d} (${pr}) for ${nm}.`);
  return `<details style="border:1px solid #eadfd3;border-radius:14px;padding:10px 12px;margin:8px 0;background:${ok?"#eef9f1":"#fff"}"><summary style="cursor:pointer;font-weight:800;list-style:none;display:flex;gap:8px;align-items:center"><span>${ok?"✅":x.i}</span><span style="flex:1">${t.t}</span><small style="font-weight:700;opacity:.65">${x.price?(es?"o yo: ":"or me: ")+money(x.price):(es?"incluido":"included")}</small></summary>
  <ol style="margin:10px 0 6px;padding-left:20px;line-height:1.5">${t.s.map(s=>`<li style="margin:4px 0">${s}</li>`).join("")}</ol>
  <label style="display:flex;gap:8px;align-items:center;font-weight:700;margin:8px 0"><input type="checkbox" data-stk="${x.k}" ${ok?"checked":""} style="width:22px;height:22px"> ${es?"Ya lo hice":"Done"}</label>
  <a class="b ${x.price?"g":"l"}" target="_blank" href="https://api.whatsapp.com/send?phone=${BR}&text=${encodeURIComponent(msg)}">🙋 ${t.d} · ${pr}</a></details>`}).join("")}
 <p class="tip">${es?"Los precios de “hazlo por mí” son un solo pago. Lo que dice incluido no cuesta extra.":"“Do it for me” prices are a one-time payment. Anything marked included costs nothing extra."}</p></div>`}
document.addEventListener("change",e=>{const c=e.target.closest("[data-stk]");if(!c)return;const o=stGet();if(c.checked)o[c.dataset.stk]=1;else delete o[c.dataset.stk];stSet(o);const y=scrollY;render();scrollTo(0,y);const s=document.querySelector(`[data-stk="${c.dataset.stk}"]`);if(s)s.closest("details").open=true});
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("mx-dueno-lang",lang)}catch(_){}render()};

// ---------- Owner menu editor ----------
let EM=null,SP={es:"",en:""},QT="";
const r5=n=>String(Math.round(n/5)*5);
function parseQ(txt){const out=[];let pend="",cur="";for(let raw of txt.split(/\n+/)){let l=raw.replace(/[|_•·]+/g," ").replace(/\s{2,}/g," ").trim();if(!l)continue;
 if(!/\d/.test(l)&&l.length<26&&/[A-ZÁÉÍÓÚÑ]/.test(l)&&l===l.toUpperCase()){pend="";cur=l.charAt(0)+l.slice(1).toLowerCase();continue}
 const m=l.match(/^(.*?)[\s.\-–:…]*\$?\s*(\d{2,4})(?:[.,]\d{1,2})?\s*(?:mxn|pesos)?\s*$/i);
 if(m&&+m[2]>=10){let n=(m[1]||"").replace(/[.\-–:…$]+$/,"").trim();if(!n&&pend)n=pend;pend="";if(n.length>=2)out.push({es:n.charAt(0).toUpperCase()+n.slice(1),price:r5(+m[2]),sec:cur});continue}
 pend=pend?pend+" "+l:l}return out}
async function openEd(){const es=lang==="es";$("w").innerHTML=`<div class="card"><p>${es?"Cargando…":"Loading…"}</p></div>`;
 try{let d=null;try{d=JSON.parse(localStorage.getItem("mx-dueno-draft-"+slug)||"null")}catch(_){}
  if(d&&d.m){EM=d.m;SP=d.sp||SP}else{EM=await (await fetch("../c/"+slug+"/menu.json?t="+Date.now(),{cache:"no-store"})).json();try{const s=await (await fetch("../c/"+slug+"/special.json?t="+Date.now(),{cache:"no-store"})).json();if(s&&s.on)SP={es:s.es||"",en:s.en||""}}catch(_){}}}
 catch(_){$("w").innerHTML=`<div class="card"><p>${es?"Necesitas internet para abrir el editor.":"You need internet to open the editor."}</p><button class="b l" id="bk">←</button></div>`;$("bk").onclick=render;return}
 drawEd()}
function saveDraft(){try{localStorage.setItem("mx-dueno-draft-"+slug,JSON.stringify({m:EM,sp:SP}))}catch(_){}}
function drawEd(){const es=lang==="es";
 $("w").innerHTML=`<div class="card ed"><h2>🔥 ${es?"Especial de hoy":"Today's special"}</h2><p class="sm">${es?"Sale arriba en tu app. Déjalo vacío para quitarlo.":"Shows at the top of your app. Leave empty to remove."}</p><input data-sp="es" placeholder="${es?"Ej: 2×1 en margaritas de 5 a 7":"E.g. 2-for-1 margaritas 5–7 pm"}" value="${esc(SP.es)}"><input data-sp="en" placeholder="English (opcional)" value="${esc(SP.en)}"></div>
 <div class="card ed"><h2>📷 ${es?"Agregar rápido":"Quick add"}</h2><p class="sm">${es?"Toma foto de tu menú o escribe un platillo por línea con su precio.":"Photograph your menu or type one dish per line with its price."}</p>
  <label class="b l" style="margin-top:4px">📷 ${es?"Foto del menú":"Menu photo"}<input type="file" accept="image/*" id="ph" style="display:none"></label><p class="sm" id="phs"></p>
  <textarea id="qt" rows="5" placeholder="Limonada 55&#10;Flan 75">${esc(QT)}</textarea><button class="b" id="qa">➕ ${es?"Agregar al menú":"Add to the menu"}</button></div>
 ${EM.map((c,ci)=>`<div class="sec2 ed"><div class="it" style="grid-template-columns:1fr 38px"><input data-c="${ci}" value="${esc(c.cat.es)}" style="font-weight:800"><button class="x" data-dc="${ci}">🗑</button></div>
  ${c.items.map((it,ii)=>`<div class="it"><div><input data-i="${ci}-${ii}" data-f="es" value="${esc(it.name.es)}"><input data-i="${ci}-${ii}" data-f="en" value="${esc(it.name.en||"")}" placeholder="English" style="font-size:13px"></div><input data-i="${ci}-${ii}" data-f="price" inputmode="decimal" value="${esc(it.price)}" placeholder="$"><button class="x" data-di="${ci}-${ii}">✕</button></div>`).join("")}
  <button class="chip" data-ai="${ci}">+ ${es?"Platillo":"Dish"}</button></div>`).join("")}
 <div class="card"><button class="chip" data-as="Bebidas|Drinks">🥤 ${es?"Bebidas":"Drinks"}</button><button class="chip" data-as="Postres|Desserts">🍰 ${es?"Postres":"Desserts"}</button><button class="chip" data-as="?">✍️ ${es?"Otra sección":"Other section"}</button></div>
 <div class="card"><button class="b g" id="pub">📤 ${es?"Publicar cambios":"Publish changes"}</button><p class="tip">${es?"Se manda a MX Studio por WhatsApp y queda en tu app en minutos.":"It's sent to MX Studio by WhatsApp and goes live in your app within minutes."}</p><button class="b l" id="bk">← ${es?"Volver":"Back"}</button></div>`;
 const W=$("w");
 W.oninput=e=>{const el=e.target;if(el.dataset.sp){SP[el.dataset.sp]=el.value}else if(el.dataset.c!==undefined&&!el.dataset.i){EM[+el.dataset.c].cat.es=el.value}else if(el.dataset.i){const [ci,ii]=el.dataset.i.split("-").map(Number),it=EM[ci].items[ii];if(el.dataset.f==="es")it.name.es=el.value;else if(el.dataset.f==="en")it.name.en=el.value;else it.price=el.value.replace(/[^0-9.]/g,"")}else if(el.id==="qt")QT=el.value;saveDraft()};
 W.onchange=e=>{if(e.target.id==="ph")ocr(e.target.files[0])};
 W.onclick=e=>{const t=e.target;const es=lang==="es";
  if(t.id==="bk"){render();return}
  if(t.id==="pub"){publish();return}
  if(t.id==="qa"){const L=parseQ(QT);if(!L.length)return;L.forEach(x=>{let k=EM.length-1;if(x.sec){const nm=x.sec.toLowerCase();k=EM.findIndex(c=>c.cat.es.toLowerCase().startsWith(nm.slice(0,5))||nm.startsWith(c.cat.es.toLowerCase().slice(0,5)));if(k<0){EM.push({cat:{es:x.sec,en:x.sec},items:[]});k=EM.length-1}}if(k<0){EM.push({cat:{es:"Menú",en:"Menu"},items:[]});k=0}EM[k].items.push({name:{es:x.es,en:x.es},desc:{es:"",en:""},price:x.price,img:""})});QT="";saveDraft();drawEd();return}
  const di=t.closest("[data-di]");if(di){const [ci,ii]=di.dataset.di.split("-").map(Number);EM[ci].items.splice(ii,1);saveDraft();drawEd();return}
  const dc=t.closest("[data-dc]");if(dc){if(confirm(es?"¿Borrar toda la sección?":"Delete the whole section?")){EM.splice(+dc.dataset.dc,1);saveDraft();drawEd()}return}
  const ai=t.closest("[data-ai]");if(ai){EM[+ai.dataset.ai].items.push({name:{es:"",en:""},desc:{es:"",en:""},price:"",img:""});saveDraft();drawEd();return}
  const as=t.closest("[data-as]");if(as){let v=as.dataset.as;if(v==="?"){const n=prompt(es?"Nombre de la sección":"Section name");if(!n)return;v=n+"|"+n}const [a,b]=v.split("|");EM.push({cat:{es:a,en:b},items:[{name:{es:"",en:""},desc:{es:"",en:""},price:"",img:""}]});saveDraft();drawEd()}}}
async function ocr(file){if(!file)return;const s=$("phs"),es=lang==="es";s.textContent=es?"⏳ Leyendo la foto… (10–30 s)":"⏳ Reading photo… (10–30 s)";
 try{if(!window.Tesseract)await new Promise((ok,no)=>{const x=document.createElement("script");x.src="../lib/ocr/tesseract.min.js";x.onload=ok;x.onerror=no;document.head.appendChild(x)});
  const img=await createImageBitmap(file),k=Math.min(1,2000/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=img.width*k;cv.height=img.height*k;const cx=cv.getContext("2d");cx.filter="grayscale(1) contrast(1.4)";cx.drawImage(img,0,0,cv.width,cv.height);
  const base=new URL("../lib/ocr/",location.href).href,w=await Tesseract.createWorker("spa",1,{workerPath:base+"worker.min.js",corePath:base,langPath:base.replace(/\/$/,""),gzip:true});const r=await w.recognize(cv);await w.terminate();
  QT=(QT?QT+"\n":"")+r.data.text.trim();saveDraft();drawEd();$("phs").textContent=(es?"✓ Revisa el texto y toca Agregar":"✓ Check the text and tap Add")}catch(_){s.textContent=es?"❌ No se pudo leer la foto":"❌ Couldn't read the photo"}}
async function pack(o){const bytes=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let s="";buf.forEach(b=>s+=String.fromCharCode(b));return "z"+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
 let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return "j"+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function publish(){const es=lang==="es";const clean=EM.map(c=>({cat:c.cat,items:c.items.filter(i=>(i.name.es||"").trim()).map(i=>({name:{es:i.name.es.trim(),en:(i.name.en||i.name.es).trim()},desc:i.desc||{es:"",en:""},price:String(i.price||""),img:i.img||""}))})).filter(c=>c.items.length);
 const code=await pack({s:slug,m:clean,sp:{on:!!(SP.es.trim()||SP.en.trim()),es:SP.es.trim(),en:(SP.en||SP.es).trim()},t:Date.now()});
 const link="https://go.myjefetech.app/acapulco/rutas/#chg="+code,msg=(es?"🧑‍🍳 Cambios de *":"🧑‍🍳 Changes for *")+(D.name||slug)+(es?"* — toca para publicar:\n":"* — tap to publish:\n")+link;
 open("https://api.whatsapp.com/send?phone="+BR+"&text="+encodeURIComponent(msg),"_blank");try{localStorage.removeItem("mx-dueno-draft-"+slug)}catch(_){}
 $("w").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:42px">✅</div><h2>${es?"Cambios enviados":"Changes sent"}</h2><p>${es?"Toca Enviar en WhatsApp. Tu app se actualiza en unos minutos.":"Tap Send in WhatsApp. Your app updates in a few minutes."}</p><button class="b l" id="bk">← ${es?"Volver":"Back"}</button></div>`;$("bk").onclick=render}
load();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("../sw.js").catch(()=>{})}
</script></body></html>
