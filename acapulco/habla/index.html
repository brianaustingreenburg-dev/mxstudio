async function supaFetch(path,opts={}){
  const url=SUPA_URL+"/rest/v1/"+path;

    const rows=await supaFetch("habla_progress?uid=eq."+encodeURIComponent(USER.uid)+"&select=level_unlocked");
    if(rows&&rows.length>0){UNLOCKED=Math.max(UNLOCKED,rows[0].level_unlocked||1);}
  }catch(e){console.warn("Supabase load:",e);}
}
async function saveProgress(levelUnlocked,tiktokUrl){
  if(!USER.uid)return;
  try{
    await supaFetch("habla_progress",{
      method:"POST",
      headers:{"Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({uid:USER.uid,name:USER.name,level_unlocked:levelUnlocked,tiktok_url:tiktokUrl||null,verified_at:new Date().toISOString()})
    });
  }catch(e){console.warn("Supabase save:",e);}
}
async function registerUser(){
  if(!USER.uid)return;
  try{
    await supaFetch("habla_users",{
      method:"POST",
      headers:{"Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({uid:USER.uid,name:USER.name,created_at:new Date().toISOString()})
    });
  }catch(e){console.warn("Supabase register:",e);}
}

/* ===== SAVE LOCAL ===== */
function save(){
  try{localStorage.setItem("habla",JSON.stringify({dir:S.dir,level:S.level}));}catch(e){}
}
function loadLocal(){
  try{const sv=JSON.parse(localStorage.getItem("habla")||"null");if(sv){S.dir=sv.dir||"es";S.level=Math.min(sv.level||1,UNLOCKED);}}catch(e){}
  try{const d=new URLSearchParams(location.search).get("d");if(d==="en"||d==="es"||d==="fr")S.dir=d;}catch(e){}
}

/* ===== AUDIO ===== */
let voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];checkVoices();}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(lang){
  const pref=lang==="es"?["es-MX","es-US","es-419","es-ES","es"]:
             lang==="fr"?["fr-FR","fr-CA","fr"]:
             ["en-US","en-GB","en"];
  for(const p of pref){const v=voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase()));if(v)return v;}
  return null;
}
function speak(text,lang,slow){
  if(!window.speechSynthesis){showNote("This browser can't play speech. Try Chrome, Safari or Edge.");return;}
  speechSynthesis.cancel();
  const clean=text.replace(/ \/ /g,", o ");
  const langMap={es:"es-MX",en:"en-US",fr:"fr-FR"};
  const u=new SpeechSynthesisUtterance(clean);
  u.lang=langMap[lang]||"en-US";
  const v=pickVoice(lang);if(v)u.voice=v;
  const r=parseFloat(document.getElementById("rate").value)||.9;
  u.rate=slow?Math.max(.4,r*.6):r;
  speechSynthesis.speak(u);
}
function checkVoices(){
  if(!window.speechSynthesis)return;
}
function showNote(t){const n=document.getElementById("voiceNote");n.textContent=t;n.hidden=false;}

/* ===== HELPERS ===== */
const T=()=>S.dir;
function otherLangs(){return["es","en","fr"].filter(l=>l!==S.dir);}
function word(it,lang){return lang==="en"?it[1]:lang==="es"?it[2]:it[5];}
function pron(it,lang){return lang==="es"?it[3]:lang==="en"?it[4]:it[6];}
const items=()=>LEVELS[S.level-1].items;
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function nativeLang(){
  // Show one of the other two langs as "translation"
  const others=otherLangs();return others[0];
}

/* ===== RENDER ===== */
function renderLadder(){
  const el=document.getElementById("ladder");
  const isFr=S.dir==="fr";const isEn=S.dir==="en";
  const tTitles={es:["","Primeras palabras","Frases útiles","Conversación real"],
                 en:["","First words","Useful phrases","Real conversation"],
                 fr:["","Premiers mots","Phrases utiles","Vraie conversation"]};
  const tDescs={es:["","Cosas, colores, familia","Saludos, necesidades","Pasado, futuro, opiniones"],
                en:["","Things, colors, family","Greetings, needs","Past, future, opinions"],
                fr:["","Choses, couleurs, famille","Salutations, besoins","Passé, futur, opinions"]};
  el.innerHTML=LEVELS.map(L=>{
    const pct=Math.round(S.seen[L.n].size/L.items.length*100);
    const locked=L.n>UNLOCKED;
    return `<button class="lvl${locked?" locked":""}" id="lvl${L.n}" aria-pressed="${S.level===L.n&&!locked}" data-l="${L.n}" ${locked?"disabled":""}>
      <span class="n">${L.n}</span>
      <span class="t">${tTitles[S.dir][L.n]}</span>
      <span class="d">${tDescs[S.dir][L.n]}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
    </button>`;
  }).join("");
  el.querySelectorAll(".lvl:not(.locked)").forEach(b=>b.onclick=()=>{S.level=+b.dataset.l;S.idx=0;S.quiz=null;save();render();});
}
function setPressed(groupId,attr,val){document.querySelectorAll(`#${groupId} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset[attr]===val));}

function render(){
  setPressed("dir","dir",S.dir);setPressed("mode","mode",S.mode);
  const isEs=S.dir==="es";const isEn=S.dir==="en";const isFr=S.dir==="fr";
  document.getElementById("m-learn").textContent=isEs?"Aprender":isFr?"Apprendre":"Learn";
  document.getElementById("m-list").textContent=isEs?"Lista":isFr?"Liste":"Word list";
  document.getElementById("m-quiz").textContent=isEs?"Prueba auditiva":isFr?"Quiz d'écoute":"Listening quiz";
  renderLadder();
  if(S.mode==="learn")renderLearn();else if(S.mode==="list")renderList();else renderQuiz();
}

function renderLearn(){
  const its=items(),it=its[S.idx];S.seen[S.level].add(S.idx);
  const isEs=S.dir==="es";const isFr=S.dir==="fr";const isEn=S.dir==="en";
  const p=pron(it,T());
  const native1=nativeLang();
  const st=document.getElementById("stage");
  st.innerHTML=`
    <div class="counter">${isEs?"Tarjeta":isFr?"Carte":"Card"} ${S.idx+1} / ${its.length}</div>
    <div class="pic big" aria-hidden="true">${it[0]}</div>
    <p class="target" lang="${T()}">${esc(word(it,T()))}</p>
    ${p?`<div class="pron">${esc(p)}</div>`:""}
    <div class="native" id="native" hidden lang="${native1}">${esc(word(it,native1))}</div>
    <div class="row">
      <button class="btn primary" id="b-play">${ICON_PLAY}${isEs?"Escuchar":isFr?"Écouter":"Listen"}</button>
      <button class="btn" id="b-slow">${ICON_SLOW}${isEs?"Despacio":isFr?"Lentement":"Slowly"}</button>
      <button class="btn warm" id="b-reveal">${isEs?"Ver significado":isFr?"Voir la traduction":"Show meaning"}</button>
    </div>
    <div class="row">
      <button class="btn" id="b-prev" ${S.idx===0?"disabled":""}>← ${isEs?"Atrás":isFr?"Retour":"Back"}</button>
      <button class="btn" id="b-next">${S.idx===its.length-1?(isEs?"Hacer la prueba →":isFr?"Faire le quiz →":"Take the quiz →"):(isEs?"Siguiente →":isFr?"Suivant →":"Next →")}</button>
    </div>
    <div class="dots">${its.map((_,i)=>`<i class="${i===S.idx?"on":S.seen[S.level].has(i)?"seen":""}"></i>`).join("")}</div>
    <p class="note">${TIPS[T()][S.level]}</p>`;
  document.getElementById("b-play").onclick=()=>speak(word(it,T()),T());
  document.getElementById("b-slow").onclick=()=>speak(word(it,T()),T(),true);
  document.getElementById("b-reveal").onclick=()=>{const n=document.getElementById("native");n.hidden=false;speak(word(it,native1),native1);};
  document.getElementById("b-prev").onclick=()=>{S.idx--;render();};
  document.getElementById("b-next").onclick=()=>{if(S.idx<its.length-1){S.idx++;}else{S.mode="quiz";S.quiz=null;}render();};
}

function renderList(){
  const isEs=S.dir==="es";const isFr=S.dir==="fr";
  const native1=nativeLang();
  const st=document.getElementById("stage");
  st.innerHTML=`<div class="counter">${isEs?"Toca una fila para escucharla":isFr?"Touche une ligne pour l'entendre":"Tap any row to hear it"}</div>
   <div class="list">${items().map((it,i)=>`<button data-i="${i}"><span class="e" aria-hidden="true">${it[0]}</span>
     <span class="tx"><b lang="${T()}">${esc(word(it,T()))}</b><small lang="${native1}">${esc(word(it,native1))}</small></span></button>`).join("")}</div>`;
  st.querySelectorAll(".list button").forEach(b=>b.onclick=()=>{const it=items()[+b.dataset.i];S.seen[S.level].add(+b.dataset.i);speak(word(it,T()),T());renderLadder();});
}

function newQuiz(){S.quiz={order:shuffle(items().map((_,i)=>i)),q:0,score:0,answered:false,opts:null};}
function renderQuiz(){
  if(!S.quiz)newQuiz();
  const Q=S.quiz,its=items();
  const isEs=S.dir==="es";const isFr=S.dir==="fr";
  const native1=nativeLang();
  const st=document.getElementById("stage");
  if(Q.q>=Q.order.length){
    const pct=Math.round(Q.score/Q.order.length*100);
    const passed=pct>=80;
    const msg=passed?
      (isEs?"¡Excelente! Listo para el siguiente nivel.":isFr?"Excellent ! Prêt pour le niveau suivant.":"Excellent! Ready for the next level."):
      pct>=50?
      (isEs?"Buen progreso. Repasa la lista y vuelve a intentarlo.":isFr?"Bon progrès. Revois la liste et réessaie.":"Good progress. Review the word list and try again."):
      (isEs?"Sigue practicando primero con las tarjetas.":isFr?"Continue à pratiquer avec les cartes d'abord.":"Keep practicing with the Learn cards first.");
    const canUnlock=passed&&S.level<3&&S.level>=UNLOCKED;
    st.innerHTML=`<div class="pic" aria-hidden="true">${passed?"🏆":pct>=50?"⭐":"💪"}</div>
      <p class="target">${Q.score} / ${Q.order.length}</p>
      <div class="native">${msg}</div>
      <div class="row">
        <button class="btn primary" id="b-again">${isEs?"Otra vez":isFr?"Réessayer":"Try again"}</button>
        ${S.level<3&&!canUnlock&&S.level<UNLOCKED?`<button class="btn warm" id="b-up">${isEs?"Ir al nivel":isFr?"Niveau":""} ${S.level+1} →</button>`:""}
      </div>
      ${canUnlock?`<div style="width:100%;border-top:1px solid var(--line);padding-top:16px">
        <p style="font-size:.82rem;color:var(--muted);margin:0 0 10px;text-align:center">
          ${isEs?"🎉 ¡Pasaste! Desbloquea el Nivel "+(S.level+1)+" gratis:":isFr?"🎉 Réussi ! Débloque le Niveau "+(S.level+1)+" gratuitement :":"🎉 You passed! Unlock Level "+(S.level+1)+" free:"}
        </p>
        <button class="btn warm" id="b-tt" style="width:100%;justify-content:center">
          📲 ${isEs?"Comparte en TikTok → Nivel "+(S.level+1)+" gratis":isFr?"Partage sur TikTok → Niveau "+(S.level+1)+" gratuit":"Share on TikTok → Free Level "+(S.level+1)}
        </button>
      </div>`:""}`;
    document.getElementById("b-again").onclick=()=>{newQuiz();render();};
    const up=document.getElementById("b-up");if(up)up.onclick=()=>{S.level++;S.idx=0;S.mode="learn";S.quiz=null;save();render();};
    if(canUnlock)document.getElementById("b-tt").onclick=()=>showTikTokUnlock(isEs,isFr,S.level+1);
    return;
  }
  const ans=Q.order[Q.q];
  if(!Q.opts){const others=shuffle(its.map((_,i)=>i).filter(i=>i!==ans)).slice(0,3);Q.opts=shuffle([ans,...others]);}
  const it=its[ans];
  st.innerHTML=`<div class="row" style="width:100%;justify-content:space-between;align-items:center">
      <span class="counter">${isEs?"Pregunta":isFr?"Question":"Question"} ${Q.q+1} / ${Q.order.length}</span>
      <span class="score">${Q.score} pts</span></div>
    <p class="native">${isEs?"Escucha y toca la imagen correcta.":isFr?"Écoute et touche l'image correcte.":"Listen, then tap the picture that matches."}</p>
    <div class="row">
      <button class="btn primary" id="q-play">${ICON_PLAY}${isEs?"Reproducir":isFr?"Jouer":"Play"}</button>
      <button class="btn" id="q-slow">${ICON_SLOW}${isEs?"Despacio":isFr?"Lentement":"Slowly"}</button>
    </div>
    <div class="opts">${Q.opts.map(i=>`<button class="opt" data-i="${i}"><span class="e" aria-hidden="true">${its[i][0]}</span><span lang="${native1}">${esc(word(its[i],native1))}</span></button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <button class="btn warm" id="q-next" hidden>${isEs?"Siguiente →":isFr?"Suivant →":"Next →"}</button>`;
  document.getElementById("q-play").onclick=()=>speak(word(it,T()),T());
  document.getElementById("q-slow").onclick=()=>speak(word(it,T()),T(),true);
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(Q.answered)return;Q.answered=true;
    const ok=+b.dataset.i===ans;if(ok)Q.score++;
    st.querySelectorAll(".opt").forEach(o=>{if(+o.dataset.i===ans)o.classList.add("right");});
    if(!ok)b.classList.add("wrong");
    const fb=document.getElementById("fb");fb.className="feedback "+(ok?"ok":"no");
    fb.innerHTML=(ok?(isEs?"¡Correcto! ":isFr?"Correct ! ":"Correct! "):(isEs?"Casi. Era: ":isFr?"Presque. C'était : ":"Not quite. It was: "))+`<span lang="${T()}">${esc(word(it,T()))}</span>`;
    S.seen[S.level].add(ans);renderLadder();
    const nx=document.getElementById("q-next");nx.hidden=false;nx.focus();
    nx.onclick=()=>{Q.q++;Q.answered=false;Q.opts=null;render();};
  });
}

/* ===== TIKTOK UNLOCK ===== */
function showTikTokUnlock(isEs,isFr,nextLevel){
  const overlay=document.createElement("div");
  overlay.className="tt-overlay";
  overlay.setAttribute("role","dialog");
  overlay.setAttribute("aria-modal","true");
  const msgEs=`¡Acabo de aprobar el Nivel ${nextLevel-1} en Habla × MX Studio! 🏆\nID: ${USER.uid}\ngo.myjefetech.app/habla`;
  const msgEn=`I just passed Level ${nextLevel-1} on Habla × MX Studio! 🏆\nID: ${USER.uid}\ngo.myjefetech.app/habla`;
  const msgFr=`Je viens de réussir le Niveau ${nextLevel-1} sur Habla × MX Studio ! 🏆\nID: ${USER.uid}\ngo.myjefetech.app/habla`;
  const msg=isEs?msgEs:isFr?msgFr:msgEn;
  overlay.innerHTML=`<div class="tt-sheet">
    <div style="font-size:2.2rem">🎵</div>
    <h3>${isEs?"¡Desbloquea el Nivel "+nextLevel+" gratis!":isFr?"Débloque le Niveau "+nextLevel+" gratuitement !":"Unlock Level "+nextLevel+" Free!"}</h3>
    <p>${isEs?"Publica en TikTok con tu ID y pegamos el enlace aquí para activar tu nivel.":isFr?"Publie sur TikTok avec ton ID et colle le lien ici pour activer ton niveau.":"Post on TikTok with your ID, then paste the link here to activate your level."}</p>
    <ol class="tt-steps">
      <li><span>1</span><span>${isEs?"Copia el mensaje y publica en TikTok":isFr?"Copie le message et publie sur TikTok":"Copy the message and post on TikTok"}</span></li>
      <li><span>2</span><span>${isEs?"Etiqueta <b>${TT_HANDLE}</b> en tu post":isFr?"Tague <b>${TT_HANDLE}</b> dans ton post":"Tag <b>${TT_HANDLE}</b> in your post"}</span></li>
      <li><span>3</span><span>${isEs?"Pega el enlace de tu post abajo":isFr?"Colle le lien de ton post ci-dessous":"Paste your post link below"}</span></li>
    </ol>
    <textarea id="tt-msg" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.82rem;background:var(--cobalt-soft);color:var(--ink);resize:none;min-height:72px">${msg}</textarea>
    <button class="btn primary" id="tt-copy" style="width:100%;justify-content:center">${isEs?"📋 Copiar mensaje":isFr?"📋 Copier le message":"📋 Copy message"}</button>
    <a class="tt-btn-tt" href="${TT_URL}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-4.77-4.32V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.84a8.17 8.17 0 0 0 4.77 1.52V6.9a4.84 4.84 0 0 1-1-.21z"/></svg>
      ${isEs?"Ir a TikTok ("+TT_HANDLE+")":isFr?"Aller sur TikTok ("+TT_HANDLE+")":"Go to TikTok ("+TT_HANDLE+")"}
    </a>
    <div style="width:100%;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px">
      <p style="font-size:.82rem;color:var(--muted);margin:0;text-align:center">
        ${isEs?"Ya publicaste? Pega el enlace aquí:":isFr?"Déjà publié ? Colle le lien ici :":"Already posted? Paste your TikTok link here:"}
      </p>
      <input class="tt-url-input" id="tt-url-in" type="url" placeholder="https://www.tiktok.com/@user/video/...">
      <button class="btn primary" id="tt-verify" style="width:100%;justify-content:center">
        ${isEs?"✓ Verificar y desbloquear":isFr?"✓ Vérifier et débloquer":"✓ Verify & unlock"}
      </button>
      <div class="tt-status" id="tt-status" style="display:none"></div>
    </div>
    <button class="tt-btn-skip" id="tt-skip">${isEs?"Ahora no →":isFr?"Pas maintenant →":"Not now →"}</button>
  </div>`;
  document.body.appendChild(overlay);

  document.getElementById("tt-copy").onclick=()=>{
    const ta=document.getElementById("tt-msg");
    navigator.clipboard.writeText(ta.value).then(()=>{
      document.getElementById("tt-copy").textContent=isEs?"✓ Copiado!":isFr?"✓ Copié !":"✓ Copied!";
    }).catch(()=>{ta.select();document.execCommand("copy");});
  };

  document.getElementById("tt-verify").onclick=async()=>{
    const urlIn=document.getElementById("tt-url-in").value.trim();
    const statusEl=document.getElementById("tt-status");
    statusEl.style.display="block";
    if(!urlIn||!urlIn.includes("tiktok.com")){
      statusEl.className="tt-status err";
      statusEl.textContent=isEs?"Pega un enlace de TikTok válido.":isFr?"Colle un lien TikTok valide.":"Paste a valid TikTok link.";
      return;
    }
    statusEl.className="tt-status checking";
    statusEl.textContent=isEs?"Verificando...":isFr?"Vérification...":"Checking...";
    // Check the URL is reachable (HEAD request via fetch no-cors just to see it loads)
    // Then save to Supabase and unlock
    try{
      // We can't actually fetch TikTok due to CORS — we trust the URL format and save it
      // The URL is stored in Supabase for manual audit if needed
      await saveProgress(nextLevel,urlIn);
      UNLOCKED=Math.max(UNLOCKED,nextLevel);
      statusEl.className="tt-status ok";
      statusEl.textContent=isEs?"🎉 ¡Nivel "+nextLevel+" desbloqueado!":isFr?"🎉 Niveau "+nextLevel+" débloqué !":"🎉 Level "+nextLevel+" unlocked!";
      setTimeout(()=>{
        overlay.remove();
        S.level=nextLevel;S.idx=0;S.mode="learn";S.quiz=null;
        save();renderLadder();render();
      },1800);
    }catch(e){
      statusEl.className="tt-status err";
      statusEl.textContent=isEs?"Error al guardar. Intenta de nuevo.":isFr?"Erreur. Réessaie.":"Error saving. Try again.";
    }
  };

  document.getElementById("tt-skip").onclick=()=>{overlay.remove();};
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove();});
}

/* ===== ONBOARDING ===== */
function showOnboarding(){
  const uid=genUID();
  const ob=document.createElement("div");
  ob.className="ob-overlay";
  ob.innerHTML=`<div class="ob-card">
    <div style="font-size:3rem">👋</div>
    <h2>Bienvenido a<br><span style="color:var(--cobalt)">Habla.</span></h2>
    <p>Aprende inglés, español y francés gratis.<br>¿Cómo te llamas?</p>
    <input class="ob-input" id="ob-name" type="text" placeholder="Tu nombre..." maxlength="30" autocomplete="given-name" autocorrect="off" spellcheck="false">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:100%">
      <p style="font-size:.8rem;color:var(--muted);margin:0">Tu ID de Habla:</p>
      <div class="ob-id">${uid}</div>
      <p style="font-size:.75rem;color:var(--muted);margin:0">Guárdalo — lo necesitas para desbloquear niveles</p>
    </div>
    <button class="btn primary" id="ob-go" style="width:100%;justify-content:center;font-size:1.05rem;padding:14px" disabled>
      Empezar →
    </button>
  </div>`;
  document.body.appendChild(ob);
  const inp=document.getElementById("ob-name");
  const btn=document.getElementById("ob-go");
  inp.oninput=()=>{btn.disabled=inp.value.trim().length<2;};
  inp.onkeydown=e=>{if(e.key==="Enter"&&!btn.disabled)btn.click();};
  btn.onclick=()=>{
    USER={uid,name:inp.value.trim()};
    saveUser();
    registerUser();
    ob.remove();
    showUserBar();
    loadProgress().then(()=>{loadLocal();render();});
  };
  setTimeout(()=>inp.focus(),100);
}

function showUserBar(){
  const bar=document.getElementById("userBar");
  document.getElementById("uname").textContent=USER.name;
  document.getElementById("uidBadge").textContent=USER.uid;
  bar.hidden=false;
}

/* ===== INIT ===== */
document.querySelectorAll("#dir button").forEach(b=>b.onclick=()=>{S.dir=b.dataset.dir;S.quiz=null;save();render();});
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.quiz=null;render();});
(function(){try{const p=new URLSearchParams(location.search);const b=p.get("back");if(!b)return;
  const u=new URL(b,location.href);if(u.origin!==location.origin)return;
  const a=document.getElementById("back");a.href=u.href;a.hidden=false;
  const n=p.get("n");if(n)document.getElementById("backLbl").textContent=n;}catch(e){}})();

if(loadUser()){
  showUserBar();
  loadProgress().then(()=>{loadLocal();render();});
}else{
  showOnboarding();
}
</script>
