function applyCur(){const roots=[document.querySelector("main")||document.body];roots.forEach(root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentNode.closest("#cur,#curnote,script,style"))continue;if(!_cOrig.has(n)||(_cOrig.get(n).last!==n.nodeValue))_cOrig.set(n,{o:n.nodeValue,last:null});const rec=_cOrig.get(n);const v=conv(rec.o);if(v!==n.nodeValue)n.nodeValue=v;rec.last=n.nodeValue}});
 document.querySelectorAll("#cur button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===CUR));let cn=document.getElementById("curnote");if(!cn){cn=document.createElement("p");cn.id="curnote";cn.className="curnote";const pl=document.querySelector(".prices");pl&&pl.after(cn)}
 const nt=CUR==="mxn"?"":(lang==="es"?`Aproximado · 1 ${CUR.toUpperCase()} ≈ $${FXR[CUR]} MXN · se cobra en pesos`:`Approximate · 1 ${CUR.toUpperCase()} ≈ $${FXR[CUR]} MXN · charged in pesos`);if(cn.textContent!==nt)cn.textContent=nt}
document.getElementById("cur").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;CUR=b.dataset.c;try{localStorage.setItem("mx-precios-cur",CUR)}catch(_){}applyCur()};
new MutationObserver(()=>{if(CUR!=="mxn"&&!window._curBusy){window._curBusy=true;try{applyCur()}finally{window._curBusy=false}}}).observe(document.body,{childList:true,subtree:true,characterData:true});
applyCur();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("../sw.js").catch(()=>{})}
</script>
<div id="offok" style="position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d7a4a;color:#fff;font:700 13px system-ui,sans-serif;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:99;display:none;white-space:nowrap">✓ Funciona sin internet · Works offline</div>
<script>try{if("serviceWorker"in navigator&&"caches"in window)navigator.serviceWorker.ready.then(()=>caches.match(location.pathname)).then(m=>{if(m){const b=document.getElementById("offok");b.style.display="block";setTimeout(()=>b.style.display="none",2500)}}).catch(()=>{})}catch(e){}</script>
<script>try{if(new URLSearchParams(location.search).get("embed")==="1"){}else if(new URLSearchParams(location.search).get("r")==="1"){document.getElementById("backR").style.display="inline-block";try{sessionStorage.setItem("fromR","1")}catch(_){}}else{try{if(sessionStorage.getItem("fromR")==="1")document.getElementById("backR").style.display="inline-block"}catch(_){}}}catch(e){}</script>
