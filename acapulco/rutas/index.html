:root{--bg:#000;--s1:#121012;--s2:#1c1719;--line:rgba(232,196,140,.2);--gold:#e8c48c;--gold2:#d9a35f;--sun:#e0703a;--text:#f6ece0;--muted:#b9aaa0;--green:#25d366;--fs:19px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.35;padding-bottom:calc(30px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-weight:800;font-size:1.05em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:.6em;font-weight:700;letter-spacing:.14em;color:var(--sun)}
.ib{all:unset;cursor:pointer;min-width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:.85em;background:var(--s2);border:1px solid var(--line);color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tab{all:unset;cursor:pointer;text-align:center;padding:10px 4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-weight:800;font-size:.9em;line-height:1.1}
.tab small{display:block;font-size:.62em;font-weight:700;color:var(--muted);margin-top:2px}
.tab[aria-pressed=true]{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f0a;border-color:transparent}
.tab[aria-pressed=true] small{color:#3a2615}
.filters{display:flex;gap:6px;margin-top:8px}
.f{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 4px;border-radius:12px;font-weight:700;font-size:.75em;color:var(--muted);border:1px solid var(--line)}
.f[aria-pressed=true]{color:var(--text);background:var(--s2);border-color:var(--gold2)}
.wrap{padding:14px}
.head h1{font-size:1.45em;line-height:1.1}
.head h1 span{color:var(--gold)}
.head p{color:var(--muted);font-size:.8em;margin-top:4px}
.prog{height:10px;border-radius:99px;background:var(--s2);margin:12px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .3s}
.progt{font-size:.75em;font-weight:700;color:var(--muted)}
.info{margin:12px 0;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:.8em}
.info b{color:var(--gold)}
.promo{display:block;width:100%;all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;margin:0 0 14px;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f0a;font-weight:800;font-size:.85em}
.promo span{display:block;font-weight:700;font-size:.8em;opacity:.8;margin-top:2px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card.done{border-color:rgba(37,211,102,.45)}
.ch{display:flex;gap:12px;align-items:flex-start}
.n{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a0f0a;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.card.done .n{background:var(--green)}
.nm{font-weight:800;font-size:1.15em;line-height:1.15}
.tag{display:inline-block;font-weight:800;font-size:.62em;letter-spacing:.06em;padding:3px 9px;border-radius:99px;color:#0b0b0b;margin-top:6px}
.ad{color:var(--muted);font-size:.78em;margin-top:6px}
.pi{color:var(--gold);font-weight:700;font-size:.9em;margin-top:8px}
.pr{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--s2)}
.pr .free{display:inline-block;font-size:.62em;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--green);color:#05301a;margin-bottom:6px}
.pr .pl{font-weight:800;font-size:.85em}
.pr .now{font-weight:800;font-size:1.25em;color:var(--green)}
.pr s{color:#7d7069;font-size:.8em;margin-left:6px}
.pr .mo{font-size:.75em;color:var(--muted);font-weight:600}
.pr .bs{font-size:.72em;color:var(--muted);margin-top:4px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.a{all:unset;cursor:pointer;text-align:center;padding:12px 4px;border-radius:14px;border:1.5px solid var(--line);font-weight:800;font-size:.78em;line-height:1.15}
.a b{display:block;font-size:1.4em;margin-bottom:2px}
.a small{display:block;font-weight:600;font-size:.8em;color:var(--muted)}
.a.on.v{background:var(--green);border-color:var(--green);color:#05301a}
.a.on.i{background:var(--gold);border-color:var(--gold);color:#1a0f0a}
.a.on.f{background:var(--sun);border-color:var(--sun);color:#1a0a05}
.a.on small{color:inherit;opacity:.75}
textarea{width:100%;margin-top:10px;min-height:64px;resize:vertical;background:#0a0809;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.85em}

.go{all:unset;cursor:pointer;display:block;text-align:center;margin-top:8px;padding:10px;border-radius:12px;font-weight:700;font-size:.75em;color:var(--muted);border:1px dashed var(--line)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:.9em}
.share{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;margin-top:6px;padding:15px;border-radius:16px;font-weight:800;background:var(--green);color:#05301a}
.foot{text-align:center;color:#6d625c;font-size:.65em;margin-top:16px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .box{width:100%;max-height:85vh;overflow:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h2{font-size:1.15em}
.sheet p{color:var(--muted);font-size:.78em;margin:4px 0 10px}
.pl-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.pl-row b{font-size:.9em}
.pl-row .r{text-align:right;font-size:.85em}
.pl-row .r strong{color:var(--green);font-size:1.15em}
.pl-row .r s{color:#7d7069}
.pl-row .r small{display:block;color:var(--muted)}
.close{all:unset;cursor:pointer;display:block;text-align:center;margin-top:14px;padding:14px;border-radius:14px;background:var(--s2);font-weight:800}
.lang{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px;position:relative;height:46px;align-items:center}
.lang button{all:unset;cursor:pointer;font-weight:800;font-size:.8em;padding:0 11px;height:38px;display:grid;place-items:center;border-radius:999px;color:var(--muted);position:relative;z-index:1}
.lang button[aria-pressed=true]{color:#1a0f0a}
.lang .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold2));transition:transform .25s}
.lang.en .knob{transform:translateX(100%)}
.off{display:none;font-size:.6em;font-weight:800;color:#1a0f0a;background:var(--gold);padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
body.is-off .off{display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--s2);border:1px solid var(--gold2);padding:12px 16px;border-radius:14px;font-weight:700;font-size:.8em;transition:.25s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  <div class="prog"><i style="width:${Math.round(done/r.stops.length*100)}%"></i></div><div class="progt">${done} ${t.of} ${r.stops.length} ${t.visited}</div>
  <div class="info">${esc(F(r,"desc"))}<br><b>${t.when}</b> ${t.whenV} · <b>${t.ask}</b> ${t.askV}<br><b>${t.bring}</b> ${esc(F(r,"bring"))}</div>
  <button class="promo" id="promoBtn">${t.promo}<span>${t.promoS}</span></button>
  ${cards||`<div class="empty">${t.empty}</div>`}
  <button class="share" id="share">${t.share}</button>
  <div class="foot">${t.foot}</div>`;
}
function showPrices(){
 const t=L();$("sheetBox").innerHTML=`<h2>${t.pT}</h2><p>${t.pS}</p>
 ${DATA.plans.map(p=>`<div class="pl-row"><b>${esc(F(p,"n"))}</b><div class="r"><strong>${F(p,"now")}</strong> <s>${F(p,"reg")}</s><small>${F(p,"mo")} ${t.y2}</small></div></div>`).join("")}
 <button class="close" id="closeSheet">${t.close}</button>`;
 $("sheet").classList.add("on");
}
function summary(){
 const t=L();const lines=[t.sumT+" · "+new Date().toLocaleDateString(t.locale)];
 DATA.routes.forEach(r=>{const items=r.stops.filter(s=>{const m=st.marks[s.id];return m&&(m.v||m.i||m.f||m.note)});
  if(!items.length)return;lines.push("",t.route+" "+r.num+" · "+F(r,"title"));
  items.forEach(s=>{const m=st.marks[s.id];const f=[m.v?t.sv:"",m.i?t.si:"",m.f?t.sf:""].filter(Boolean).join(", ");
   lines.push("• "+s.n+(f?" — "+f:"")+(m.note?"\n   "+m.note:""))})});
 return lines.length>1?lines.join("\n"):t.none;
}
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;st.route=+b.dataset.r;save();render();scrollTo({top:0})};
$("filters").onclick=e=>{const b=e.target.closest(".f");if(!b)return;st.filter=b.dataset.f;save();render()};
$("bigger").onclick=()=>{st.fs=Math.min(28,st.fs+2);applyFs();save()};
$("smaller").onclick=()=>{st.fs=Math.max(15,st.fs-2);applyFs();save()};
$("prices").onclick=showPrices;
$("lang").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.lang=b.dataset.l;save();applyLang();render()};
$("sheet").onclick=e=>{if(e.target.id==="sheet"||e.target.id==="closeSheet")$("sheet").classList.remove("on")};
$("main").addEventListener("click",async e=>{
 if(e.target.closest("#promoBtn"))return showPrices();
 const go=e.target.closest("[data-go]");if(go){if(!navigator.onLine){toast(L().noNet);return}
  const s=DATA.routes.flatMap(r=>r.stops).find(x=>x.id===go.dataset.go);open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.n+" Acapulco")+"&query_place_id="+s.id,"_blank");return}
 if(e.target.closest("#share")){const t=summary();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(_){return}
  try{await navigator.clipboard.writeText(t);toast(L().copied)}catch(_){toast(L().noCopy)};return}
 const a=e.target.closest(".a");if(!a)return;const id=a.closest(".card").dataset.id,m=mk(id);m[a.dataset.k]=m[a.dataset.k]?0:1;
 if(a.dataset.k!=="v"&&m[a.dataset.k])m.v=1;save();
 const y=scrollY;render();scrollTo({top:y});
});
$("main").addEventListener("input",e=>{if(!e.target.matches("[data-note]"))return;const id=e.target.closest(".card").dataset.id;mk(id).note=e.target.value;save()});
const net=()=>document.body.classList.toggle("is-off",!navigator.onLine);addEventListener("online",net);addEventListener("offline",net);net();
applyFs();applyLang();render();
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}))}
</script>
</body>
</html>
