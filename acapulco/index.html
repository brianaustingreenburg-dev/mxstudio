<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MX Studio ✝️ · Acapulco</title>
<meta name="description" content="Apps, dashboards y códigos QR para restaurantes, cafés, hoteles, resorts y clubs en Acapulco. Soporte 7 días, cambios ilimitados.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MX Studio">
<meta property="og:title" content="MX Studio · Acapulco">
<meta property="og:description" content="Apps, dashboards y códigos QR para tu negocio. Soporte 7 días.">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#0d0a0b; --s2:#161112; --line:rgba(232,196,140,.16); --line2:rgba(232,196,140,.32);
  --gold:#e8c48c; --gold2:#d9a35f; --sun:#e0703a; --text:#f6ece0; --muted:#b9aaa0; --dim:#7d7069; --wa:#25d366;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);min-height:100vh;line-height:1.45;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.gold{background:linear-gradient(135deg,#f3d9a8,var(--gold2) 60%,#c4844a);-webkit-background-clip:text;background-clip:text;color:transparent}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.brand{font-weight:800;letter-spacing:.22em;font-size:12.5px;color:var(--gold)}
.tright{display:flex;gap:8px;align-items:center}
.icon-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold)}
.icon-btn svg{width:17px;height:17px}
.lang{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px;position:relative}
.lang button{all:unset;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.06em;padding:7px 13px;border-radius:999px;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.lang button[aria-pressed=true]{color:#1a0f0a}
.lang .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold2));transition:transform .25s ease}
.lang.en .knob{transform:translateX(100%)}

/* hero */
.hero{text-align:center;padding:10px 0 4px;position:relative}
.glow{position:absolute;left:50%;top:40px;width:340px;height:340px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(224,112,58,.42),rgba(224,112,58,.08) 60%,transparent);filter:blur(10px);z-index:-1;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.65;transform:translateX(-50%) scale(1.08)}}
.logo{width:min(58vw,228px);aspect-ratio:1;display:block;margin:10px auto 16px;filter:drop-shadow(0 0 28px rgba(224,112,58,.5))}
.stars{display:inline-flex;gap:3px;color:var(--gold);margin-bottom:8px}
.stars svg{width:15px;height:15px}
.kicker{font-size:10.5px;font-weight:700;letter-spacing:.3em;color:var(--sun);text-transform:uppercase}
h1{font-size:clamp(27px,8vw,36px);font-weight:800;line-height:1.08;margin:10px 0 8px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;max-width:420px;margin:0 auto}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 4px}
.perk{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.perk svg{width:20px;height:20px;color:var(--gold);margin-bottom:4px}
.perk b{display:block;font-size:13px}
.perk span{font-size:11px;color:var(--muted)}
.offline{display:none;text-align:center;font-size:12px;color:#1a0f0a;background:var(--gold);padding:7px;border-radius:10px;margin-top:12px;font-weight:600}
body.is-off .offline{display:block}

/* section title */
.sec{margin:34px 0 12px;text-align:center}
.sec small{font-size:10.5px;font-weight:700;letter-spacing:.3em;color:var(--sun);text-transform:uppercase}
.sec h2{font-size:22px;font-weight:800;margin-top:6px}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;margin:0 -16px;padding:10px 16px;background:rgba(0,0,0,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid transparent;transition:border-color .2s}
.tabs.stuck{border-bottom-color:var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:var(--s1);white-space:nowrap;transition:background .2s,color .2s}
.tab[aria-selected=true]{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f0a;border-color:transparent}
.tab svg{width:17px;height:17px}
.panel{padding-top:16px;animation:fade .3s ease;touch-action:pan-y}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ptitle{font-size:24px;font-weight:800}
.pintro{color:var(--muted);font-size:14.5px;margin:4px 0 16px}
.note{display:flex;gap:10px;align-items:center;margin:-4px 0 16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(232,196,140,.12),rgba(224,112,58,.08));font-weight:700;font-size:14px;color:var(--gold)}
.note svg{width:20px;height:20px;flex:0 0 auto}

/* demo phone */
.demo{background:radial-gradient(120% 80% at 50% 0%,rgba(224,112,58,.16),transparent 65%),var(--s1);border:1px solid var(--line);border-radius:26px;padding:16px 14px 18px;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#000;border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:16px}
.seg button{all:unset;cursor:pointer;text-align:center;font-size:12.5px;font-weight:700;padding:9px 4px;border-radius:11px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--s2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line2)}
.phone{width:min(100%,290px);margin:0 auto;border-radius:34px;padding:9px;background:linear-gradient(145deg,#2a2220,#0a0808);box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 0 1px rgba(232,196,140,.25),0 0 40px rgba(224,112,58,.15)}
.screen{border-radius:26px;background:#faf6f0;color:#1b1412;min-height:440px;overflow:hidden;position:relative}
.notch{width:86px;height:22px;background:#0a0808;border-radius:0 0 14px 14px;margin:0 auto}
.scr{padding:10px 14px 16px;animation:fade .3s ease}
.s-head{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.s-av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.s-head b{display:block;font-size:14.5px}
.s-head span{font-size:11px;color:#7b6a62}
.s-head .s-rate,.s-rate{display:flex;align-items:center;gap:2px;color:#e0a43a;font-size:11px;font-weight:700}
.s-rate svg{width:11px;height:11px}
.s-chip{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:#f0e4d4;color:#8a5a2c;margin-bottom:8px}
.s-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee3d6;font-size:12.5px}
.s-item b{font-weight:700}
.s-item small{display:block;color:#8b7a72;font-size:10.5px;font-weight:500}
.s-item .p{font-weight:800;color:#b5642f}
.s-btn{display:block;text-align:center;font-weight:800;font-size:12.5px;padding:11px;border-radius:12px;margin-top:10px;color:#fff;background:#1b1412}
.s-btn.swa{background:var(--wa);color:#063117}
.s-btn.alt{background:#f0e4d4;color:#6a3d1a}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s-tile{background:#fff;border:1px solid #efe4d6;border-radius:14px;padding:11px 10px;font-size:12px;font-weight:700}
.s-tile i{display:block;font-style:normal;font-size:18px;margin-bottom:4px}
.s-tile small{display:block;color:#8b7a72;font-weight:500;font-size:10.5px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #d9c3a8;display:grid;place-items:center;font-size:15px}
.stamp.on{background:#6b3e22;border:none;color:#fff}
/* owner dashboard (dark) */
.screen.dark{background:#0d0a0b;color:var(--text)}
.d-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.d-k{background:#161112;border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.d-k b{display:block;font-size:16px;color:var(--gold)}
.d-k span{font-size:9.5px;color:var(--muted)}
.d-lbl{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--sun);text-transform:uppercase;margin:4px 0 6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;padding:8px;background:#161112;border:1px solid var(--line);border-radius:12px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--gold),var(--sun));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bar span{font-size:8.5px;color:var(--dim)}
@keyframes grow{from{transform:scaleY(0)}}
.d-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:8px 10px;background:#161112;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.d-row .w{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(224,112,58,.18);color:#f0a36f}
.d-row .ok{background:rgba(37,211,102,.15);color:#5fe39a}
.demo-note{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}

/* feature blocks */
.block{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.bhead{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.bicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(232,196,140,.18),rgba(224,112,58,.12));color:var(--gold);border:1px solid var(--line)}
.bicon svg{width:19px;height:19px}
.bhead h3{font-size:16px;font-weight:800}
.bhead small{display:block;font-size:10.5px;font-weight:700;color:var(--sun);letter-spacing:.16em;text-transform:uppercase}
.block ul{list-style:none;display:grid;gap:9px}
.block li{display:flex;gap:10px;font-size:14.5px}
.block li svg{flex:0 0 16px;width:16px;height:16px;margin-top:3px;color:var(--gold2)}
.quote{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:15px;color:#1a0f0a;background:linear-gradient(135deg,var(--gold),var(--gold2));margin:6px 0;text-align:center;box-shadow:0 8px 30px rgba(217,163,95,.25)}
.live{display:block;text-align:center;font-weight:700;font-size:13.5px;color:var(--gold);border:1px dashed var(--line2);border-radius:14px;padding:12px;margin:-4px 0 14px;text-decoration:none}
.swipe{text-align:center;font-size:11px;color:var(--dim);margin-top:6px}

/* steps */
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.num{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a0f0a;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.step b{display:block;font-size:15px}
.step span{font-size:13.5px;color:var(--muted)}

/* faq */
.faq details{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.faq summary{cursor:pointer;list-style:none;padding:15px 16px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--gold);font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq p{padding:0 16px 15px;color:var(--muted);font-size:14px}

/* install / footer */
.install{display:none;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:14px;margin-top:22px}
.install.show{display:flex}
.install img{width:44px;height:44px;border-radius:12px}
.install div{flex:1;font-size:13px;color:var(--muted)}
.install b{display:block;color:var(--text);font-size:14px}
.install button{all:unset;cursor:pointer;font-weight:800;font-size:13px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f0a}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:30px 0 8px}
.foot .cross{color:var(--gold);font-size:16px;display:block;margin-bottom:6px}
.foot b{color:var(--gold)}

/* sticky whatsapp */
.wa{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 32px));display:flex;align-items:center;justify-content:center;gap:11px;padding:14px 18px;border-radius:18px;background:var(--wa);color:#05301a;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 10px 34px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);z-index:10}
.wa svg{width:23px;height:23px;flex:0 0 auto}
.wa small{display:block;font-size:11.5px;font-weight:700;opacity:.78}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--s2);border:1px solid var(--line2);color:var(--text);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;transition:.25s;z-index:11;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){.tabs{justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const item=(n,s,p)=>`<div class="s-item"><div><b>${n}</b><small>${s}</small></div><span class="p">${p}</span></div>`;
const tile=(e,n,s)=>`<div class="s-tile"><i>${e}</i>${n}<small>${s}</small></div>`;
const head=(c,l,n,s)=>`<div class="s-head"><div class="s-av" style="background:${c}">${l}</div><div><b>${n}</b>${s}</div></div>`;

const row=(t,b,ok)=>`<div class="d-row"><span>${t}</span><span class="w ${ok?"ok":""}">${b}</span></div>`;

let lang="es",cur="rest",view="c";
try{lang=localStorage.getItem("mx-lang")||((navigator.language||"es").toLowerCase().startsWith("es")?"es":"en");cur=localStorage.getItem("mx-tab")||cur}catch(e){}
try{const h=location.hash.slice(1);if(BIZ.some(b=>b.id===h))cur=h}catch(e){}
if(!BIZ.some(b=>b.id===cur))cur="rest";

const waLink=t=>`https://api.whatsapp.com/send?phone=${PHONE}&text=${encodeURIComponent(t)}`;
const list=a=>`<ul>${a.map(x=>`<li>${ic("check")}<span>${x}</span></li>`).join("")}</ul>`;
const block=(i,k,t,a)=>`<div class="block"><div class="bhead"><div class="bicon">${ic(i)}</div><div><small>${k}</small><h3>${t}</h3></div></div>${list(a)}</div>`;
const $=id=>document.getElementById(id);

function renderDemo(){
 const u=UI[lang],d=DEMO[cur][lang];
 $("demoBox").innerHTML=`<div class="seg"><button type="button" data-v="c" aria-pressed="${view==="c"}">${u.segC}</button><button type="button" data-v="o" aria-pressed="${view==="o"}">${u.segO}</button></div>
 <div class="phone"><div class="screen ${view==="o"?"dark":""}"><div class="notch" style="${view==="o"?"":"background:#0a0808"}"></div><div class="scr">${d[view]()}</div></div></div>
 <div class="demo-note">${u.demoNote}</div>`;
}
function render(){
 const u=UI[lang];
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=u[el.dataset.t]);
 $("lang").classList.toggle("en",lang==="en");
 $("lang").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 $("perks").innerHTML=u.perks.map(p=>`<div class="perk">${ic(p[0])}<b>${p[1]}</b><span>${p[2]}</span></div>`).join("");
 $("tabs").innerHTML=BIZ.map(b=>`<button class="tab" role="tab" aria-selected="${b.id===cur}" data-id="${b.id}">${ic(b.id)}${b[lang].name}</button>`).join("");
 const d=BIZ.find(x=>x.id===cur)[lang], msg=`${u.msg} ${d.one}.`;
 $("panel").innerHTML=`<section class="panel" role="tabpanel">
  <h2 class="ptitle">${d.name}</h2><p class="pintro">${d.intro}</p>${d.note?`<div class="note">${ic("help")}<span>${d.note}</span></div>`:""}
  <div class="demo" id="demoBox"></div>
  ${LIVE[cur]?`<a class="live" href="${LIVE[cur]}" target="_blank" rel="noopener">▶ ${u.live.replace(cur==="rest"?/ \/ (Habitación|Room) 214/:/(Mesa|Table) 5 \/ /,"")}</a>`:""}
  ${block("app",u.appsK,u.apps,d.apps)}
  ${block("dash",u.dashK,u.dash,d.dash)}
  ${block("qr",u.qrK,u.qr,d.qr)}
  ${block("help",u.supK,u.sup,u.support)}
  <a class="quote" href="${waLink(msg)}" target="_blank" rel="noopener">${u.quote} ${d.one} →</a>
  <div class="swipe">← ${u.swipe} →</div>
 </section>`;
 renderDemo();
 $("steps").innerHTML=u.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join("");
 $("faq").innerHTML=u.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
 $("wa").href=waLink(msg);
 document.title=`MX Studio ✝️ · ${d.name}`;
}
function setTab(id,scroll){
 cur=id;view="c";try{localStorage.setItem("mx-tab",cur);history.replaceState(null,"","#"+cur)}catch(_){}
 render();
 const t=document.querySelector(`.tab[data-id="${id}"]`);if(t)t.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
 if(scroll){const y=$("tabs").getBoundingClientRect().top+scrollY;if(scrollY>y)scrollTo({top:y,behavior:"smooth"})}
}
$("lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("mx-lang",lang)}catch(_){}render()});
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)setTab(b.dataset.id)});
$("panel").addEventListener("click",e=>{const b=e.target.closest(".seg button");if(!b)return;view=b.dataset.v;renderDemo()});
/* swipe between businesses */
let sx=0,sy=0;
$("panel").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("panel").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){const i=BIZ.findIndex(b=>b.id===cur),n=(i+(dx<0?1:-1)+BIZ.length)%BIZ.length;setTab(BIZ[n].id,true)}},{passive:true});
/* sticky tab border */
new IntersectionObserver(([en])=>$("tabs").classList.toggle("stuck",!en.isIntersecting),{rootMargin:"-1px 0px 0px 0px"}).observe(document.querySelector(".sec"));
/* toast + share */
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2400)}
$("share").addEventListener("click",async()=>{const u=UI[lang];
 try{if(navigator.share){await navigator.share({title:u.shareT,text:u.shareX,url:URL_SELF});return}}catch(_){return}
 try{await navigator.clipboard.writeText(URL_SELF);toast(u.copied)}catch(_){toast(URL_SELF)}});
/* install */
let deferred=null;const isStandalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;if(!isStandalone)$("install").classList.add("show")});
if(isIOS&&!isStandalone)$("install").classList.add("show");
$("instBtn").addEventListener("click",async()=>{if(deferred){deferred.prompt();deferred=null;$("install").classList.remove("show")}else toast(UI[lang].iosHint)});
/* offline */
const net=()=>document.body.classList.toggle("is-off",!navigator.onLine);
addEventListener("online",net);addEventListener("offline",net);net();
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
