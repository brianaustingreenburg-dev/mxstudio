<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2233">
<meta name="robots" content="noindex">

<title>Ritz Acapulco · Guest App (Demo)</title>
<meta name="description" content="Demo guest app concept by JefeTech: activities, shows, dining, pools and excursions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#f7f3ec; --paper:#fffdf9; --sand:#ece4d6; --line:#e2d8c6;
    --navy:#0f2233; --ink:#1d2a36; --muted:#6b7480; --gold:#b48a4f; --gold-2:#d8b47a;
    --sea:#1f6f78; --ok:#2e7d5b; --closed:#a2503f;
    --serif:"Cormorant Garamond", Georgia, "DejaVu Serif", serif;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--ivory)}
  body{font-family:var(--sans);color:var(--ink);min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto}

  /* demo ribbon */
  .demo{background:var(--navy);color:#cdd6df;font-size:11.5px;letter-spacing:.06em;text-align:center;padding:7px 12px}
  .demo b{color:var(--gold-2);font-weight:600}

  /* hero */
  .hero{position:relative;height:280px;overflow:hidden;color:#fff}
  .hero svg{position:absolute;inset:0;width:100%;height:100%}
  .hero .top{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
  .crest{font-family:var(--serif);font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:.95}
  .lang{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:999px;overflow:hidden;font-size:12px;font-weight:600}
  .lang button{padding:5px 11px;color:#fff}
  .lang button.on{background:#fff;color:var(--navy)}
  .hero .title{position:absolute;left:20px;right:20px;bottom:46px}
  .hero .hello{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;margin-top:6px;text-shadow:0 2px 18px rgba(0,0,0,.25)}
  .hero .sub{margin-top:6px;font-size:13.5px;opacity:.92}
  .stars{color:var(--gold-2);letter-spacing:3px;font-size:12px}

  main{padding:0 16px}
  .sec{display:none;animation:fade .35s ease}
  .sec.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h2{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--navy);margin:26px 0 4px}
  .kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .lead{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:14px}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);margin:26px 0 0}

  /* now/next */
  .now{margin-top:-26px;position:relative;z-index:2;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 10px 30px rgba(15,34,51,.10);display:grid;grid-template-columns:1fr 1px 1fr;gap:14px}
  .now .div{background:var(--line)}
  .now .lab{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .now .what{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--navy);margin-top:4px;line-height:1.15}
  .now .where{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* days + chips */
  .days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:none;width:52px;padding:9px 0;border:1px solid var(--line);border-radius:14px;text-align:center;background:var(--paper)}
  .day .d{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .day .n{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);line-height:1.1}
  .day.on{background:var(--navy);border-color:var(--navy)}
  .day.on .d{color:var(--gold-2)} .day.on .n{color:#fff}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:500;color:var(--ink)}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#fff}

  /* show card */
  .show{margin-top:16px;border-radius:20px;overflow:hidden;background:var(--navy);color:#fff;position:relative}
  .show .art{height:120px;background:
     radial-gradient(120px 80px at 20% 120%,rgba(216,180,122,.55),transparent 70%),
     radial-gradient(160px 90px at 85% 130%,rgba(31,111,120,.8),transparent 70%),
     linear-gradient(180deg,#152f45,#0f2233);position:relative}
  .show .art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 34px,rgba(255,255,255,.04) 34px 36px)}
  .show .badge{position:absolute;top:14px;left:16px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-2);font-weight:700;z-index:1}
  .show .body{padding:4px 18px 18px;margin-top:-46px;position:relative;z-index:1}
  .show h3{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05}
  .show p{font-size:13.5px;color:#c7d0d9;margin-top:6px;line-height:1.45}
  .show .meta{display:flex;gap:14px;margin-top:12px;font-size:13px;color:#fff}
  .show .meta span{display:flex;align-items:center;gap:6px}

  /* timeline */
  .tl{margin-top:8px}
  .ev{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:0}
  .ev .t{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--navy)}
  .ev .n{font-weight:600;font-size:15px}
  .ev .p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--sand);color:var(--ink);white-space:nowrap}
  .tag.live{background:var(--ok);color:#fff}
  .ev.past{opacity:.45}
  .empty{padding:24px 0;color:var(--muted);font-size:14px;text-align:center}

  /* cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:12px}
  .card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card h4{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--navy);line-height:1.1}
  .card .type{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
  .card p{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:8px}
  .hours{margin-top:10px;display:grid;gap:4px}
  .hours div{display:flex;justify-content:space-between;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
  .hours div span:last-child{font-weight:600;color:var(--ink)}
  .status{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .status.open{background:#e3f1ea;color:var(--ok)}
  .status.closed{background:#f4e6e2;color:var(--closed)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:11px 16px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;font-size:14px;width:100%;text-decoration:none}
  .btn.gold{background:var(--gold)}
  .btn.ghost{background:transparent;border:1px solid var(--navy);color:var(--navy)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
  .tile .ic{width:38px;height:38px;border-radius:11px;background:var(--sand);display:grid;place-items:center;color:var(--navy)}
  .tile .ic svg{width:22px;height:22px}
  .tile h5{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-top:10px;line-height:1.1}
  .tile p{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}

  .exc{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:start}
  .exc .pic{width:62px;height:62px;border-radius:14px;display:grid;place-items:center;color:#fff}
  .exc .pic svg{width:30px;height:30px}
  .exc .price{font-size:12px;color:var(--gold);font-weight:700;margin-top:4px;letter-spacing:.04em}

  .info{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden}
  .info .li{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
  .info .li:last-child{border-bottom:0}
  .info .li span:first-child{color:var(--muted)}
  .info .li b{font-weight:600}
  .copy{font-size:12px;font-weight:600;color:var(--gold);margin-left:10px}

  .rate{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
  .rate button{font-size:34px;color:var(--line);transition:transform .15s}
  .rate button.on{color:var(--gold)}
  .rate button:active{transform:scale(1.2)}
  textarea{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;background:#fff;min-height:84px;resize:vertical}

  .foot{text-align:center;font-size:11.5px;color:var(--muted);padding:30px 10px 10px;line-height:1.6}
  .foot b{color:var(--navy)}

  /* bottom nav */
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
  nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  nav button{padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
  nav button svg{width:23px;height:23px}
  nav button.on{color:var(--navy)}
  nav button.on svg{color:var(--gold)}

  .toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;max-width:88%;text-align:center;transition:.25s;z-index:20;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="demo" id="demo"></div>

<div class="wrap">

  </header>

  <main>
    <!-- TODAY -->
    <section class="sec" id="s-today">
      <div class="now">
        <div><div class="lab" id="l-now"></div><div class="what" id="now-what"></div><div class="where" id="now-where"></div></div>
        <div class="div"></div>
        <div><div class="lab" id="l-next"></div><div class="what" id="next-what"></div><div class="where" id="next-where"></div></div>

    <!-- DINE -->
    <section class="sec" id="s-dine">
      <h2 id="h-dine"></h2>

    <!-- RELAX -->

      <div class="card">
        <p id="p-fb" style="margin-top:0"></p>
        <div class="rate" id="rate"></div>

        <button class="btn gold" id="fbsend"></button>

    <div class="foot" id="foot"></div>

</div>

<nav><div class="in" id="nav"></div></nav>

/* ---------- state ---------- */
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let lang = store.get('ritz-lang') || ((navigator.language||'es').startsWith('en') ? 'en' : 'es');
let tab = 'today', filter = 'all', stars = 0;
const nowMx = () => { const s = new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}); return new Date(s); };
let selDay = nowMx().getDay();
const L = o => (o && typeof o === 'object' && 'es' in o) ? o[lang] : o;
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const endMins = (s,e) => { let x = mins(e); if (x <= mins(s)) x += 1440; return x; };
const $ = id => document.getElementById(id);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---------- render ---------- */
function render(){
  const t = T[lang]; document.documentElement.lang = lang;
  $('demo').innerHTML = t.demo; $('tagline').textContent = t.tagline;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  const n = nowMx(), h = n.getHours();
  $('hello').textContent = h<12 ? t.morning : h<19 ? t.afternoon : t.evening;

  // nav
  const tabs = ['today','dine','relax','explore','info'];
  const navIc = [
    '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    '<path d="M5 3v8a3 3 0 0 0 3 3v7M8 3v6M11 3v8a3 3 0 0 1-3 3M17 21V3c-2 1-3 3-3 6v5h3"/>',
    ICON.beach, '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
    '<circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h1v5h1"/>'
  ];
  $('nav').innerHTML = tabs.map((k,i)=>`<button data-t="${k}" class="${tab===k?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${navIc[i]}</svg>${t.nav[i]}</button>`).join('');
  tabs.forEach(k=>$('s-'+k).classList.toggle('on',tab===k));

  renderToday(); renderDine(); renderRelax(); renderExplore(); renderInfo();
  $('foot').innerHTML = t.foot;
}

function programFor(day){ return PROGRAM.filter(e=>!e.days || e.days.includes(day)); }

function renderToday(){
  const t = T[lang], n = nowMx(), today = n.getDay(), cur = n.getHours()*60+n.getMinutes();
  // now / next (always for today)
  const list = programFor(today);
  const nowE = list.filter(e=>cur>=mins(e.s) && cur<endMins(e.s,e.e)).sort((a,b)=>mins(b.s)-mins(a.s))[0];
  const nextE = list.find(e=>mins(e.s)>cur);
  $('l-now').textContent = t.now; $('l-next').textContent = t.next;
  $('now-what').textContent = nowE ? L(nowE.n) : t.nothingNow;
  $('now-where').textContent = nowE ? `${L(nowE.p)} · ${nowE.s}` : '—';
  $('next-what').textContent = nextE ? L(nextE.n) : t.nothingNext;
  $('next-where').textContent = nextE ? `${L(nextE.p)} · ${nextE.s}` : `${L(list[0].n)} · ${list[0].s}`;

  $('h-schedule').textContent = t.schedule;
  // days strip: today + 6
  let d = '';
  for(let i=0;i<7;i++){ const dt = new Date(n); dt.setDate(n.getDate()+i); const wd = dt.getDay();
    d += `<button class="day ${wd===selDay?'on':''}" data-d="${wd}"><div class="d">${t.days[wd]}</div><div class="n">${dt.getDate()}</div></button>`; }
  $('days').innerHTML = d;

  const sh = SHOWS[selDay][lang];
  $('show').innerHTML = `<div class="art"><div class="badge">${t.tonight}</div></div>
    <div class="body"><h3>${sh[0]}</h3><p>${sh[1]}</p>
    <div class="meta"><span>🕘 21:00</span><span>📍 ${t.theater}</span></div></div>`;

  $('chips').innerHTML = Object.entries(t.filters).map(([k,v])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${v}</button>`).join('');

  const isToday = selDay===today;
  const evs = programFor(selDay).filter(e=>filter==='all'||e.c===filter);
  $('tl').innerHTML = evs.length ? evs.map(e=>{
    const on = isToday && cur>=mins(e.s) && cur<endMins(e.s,e.e);
    const past = isToday && cur>=endMins(e.s,e.e);
    const name = e.n.en==='Nightly show' ? `${L(e.n)}: ${sh[0]}` : L(e.n);
    return `<div class="ev ${past?'past':''}"><div class="t">${e.s}</div><div><div class="n">${name}</div><div class="p">${L(e.p)} · ${e.s}–${e.e}</div></div><span class="tag ${on?'live':''}">${on?t.live:t.filters[e.c]}</span></div>`;
  }).join('') : `<div class="empty">${t.empty}</div>`;
}

function isOpen(h){ const n=nowMx(), cur=n.getHours()*60+n.getMinutes();
  return h.some(([s,e])=>{ const a=mins(s), b=endMins(s,e); return (cur>=a&&cur<b)||(cur+1440>=a&&cur+1440<b); }); }

function renderDine(){
  const t=T[lang]; $('h-dine').textContent=t.dine; $('p-dine').textContent=t.pDine;
  $('dine').innerHTML = DINING.map((r,i)=>{ const o=isOpen(r.h);
    return `<div class="card"><div class="row"><div><h4>${r.n}</h4><div class="type">${L(r.t)}</div></div><span class="status ${o?'open':'closed'}">${o?t.open:t.closed}</span></div>
    <p>${L(r.d)}</p><div class="hours">${r.h.map(([s,e,l])=>`<div><span>${L(l)}</span><span>${s} – ${e==='24:00'?'00:00':e}</span></div>`).join('')}</div>
    ${r.reserve?`<button class="btn ghost" data-demo="1">${t.reserve}</button>`:''}</div>`; }).join('');
}

function renderRelax(){
  const t=T[lang]; $('h-relax').textContent=t.relax; $('p-relax').textContent=t.pRelax;
  $('relax').innerHTML = RELAX.map(r=>`<div class="tile"><div class="ic">${svg(r.i)}</div><h5>${L(r.n)}</h5><p>${L(r.d)}</p></div>`).join('');
  $('kids').innerHTML = lang==='es'
    ? `<div class="row"><div><h4>Kids' Club</h4><div class="type">4–12 años · 10:00–17:00</div></div></div><p>Juegos, manualidades, pintacaritas, búsqueda del tesoro y mini disco a las 20:00. Los papás descansan, los niños se divierten.</p>`
    : `<div class="row"><div><h4>Kids' Club</h4><div class="type">Ages 4–12 · 10:00–17:00</div></div></div><p>Games, crafts, face painting, treasure hunts and a mini disco at 8 PM. Parents relax, kids have fun.</p>`;
}

function renderExplore(){
  const t=T[lang]; $('h-explore').textContent=t.explore; $('p-explore').textContent=t.pExplore;
  $('explore').innerHTML = EXPLORE.map(x=>`<div class="card"><div class="exc"><div class="pic" style="background:${x.c}">${svg(x.i)}</div>
    <div><h4>${L(x.n)}</h4><div class="price">${x.pr}</div><p>${L(x.d)}</p></div></div>
    <button class="btn" data-demo="1">${t.request}</button></div>`).join('');
}

function renderInfo(){
  const t=T[lang]; $('h-info').textContent=t.info; $('call').textContent='📞 '+t.call;
  $('info').innerHTML = INFO.map(([k,v,x])=>`<div class="li"><span>${L(k)}</span><span><b>${L(v)}</b>${x==='copy'?`<button class="copy" data-copy="${v}">${t.copied==='Copiado'?'Copiar':'Copy'}</button>`:''}</span></div>`).join('');
  $('h-fb').textContent=t.fb; $('p-fb').textContent=t.pFb; $('fbtext').placeholder=t.fbPh; $('fbsend').textContent=t.send;
  $('rate').innerHTML = [1,2,3,4,5].map(i=>`<button data-s="${i}" class="${i<=stars?'on':''}" aria-label="${i}">★</button>`).join('');
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.l){ lang=b.dataset.l; store.set('ritz-lang',lang); render(); }
  else if(b.dataset.t){ tab=b.dataset.t; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(b.dataset.d){ selDay=+b.dataset.d; renderToday(); }
  else if(b.dataset.f){ filter=b.dataset.f; renderToday(); }
  else if(b.dataset.demo){ toast(T[lang].demoAct); }
  else if(b.dataset.s){ stars=+b.dataset.s; renderInfo(); }
  else if(b.dataset.copy){ try{navigator.clipboard.writeText(b.dataset.copy)}catch(_){} toast(T[lang].copied+': '+b.dataset.copy); }
  else if(b.id==='fbsend'){ if(!stars){ toast(T[lang].pick); return; } stars=0; $('fbtext').value=''; renderInfo(); toast(T[lang].thanks); }
});
const hashTab = (location.hash||'').slice(1); if(['today','dine','relax','explore','info'].includes(hashTab)) tab=hashTab;
render();
setInterval(()=>{ if(tab==='today') renderToday(); if(tab==='dine') renderDine(); }, 60000);
</script>
