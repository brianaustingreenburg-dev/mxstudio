<style>

/* Layout: app shell — sidebar on wide screens, bottom tab bar on phones; talavera cobalt + cempasúchil marigold on a cool paper ground */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#14203A; --muted:#5A6684; --line:#DCE2EC;
  --accent:#1C46B4; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB; --gold:#E39B12; --gold-soft:#FCF0D6;
  --ok:#1E8048; --ok-soft:#DDF2E5; --warn:#A8670E; --warn-soft:#FBEBD0; --bad:#BE2F2A; --bad-soft:#FBE1DF;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 6px 18px rgba(20,32,58,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#161E30; --sunk:#1E2840; --ink:#E7ECF6; --muted:#97A3BE; --line:#28344E;
  --accent:#7C9DFF; --accent-ink:#0D1220; --accent-soft:#1F2C52; --gold:#F2B441; --gold-soft:#3A2E14;
  --ok:#5BC98A; --ok-soft:#163626; --warn:#EDB25A; --warn-soft:#3A2A12; --bad:#F27A72; --bad-soft:#3E1C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161E30; --sunk:#1E2840; --ink:#E7ECF6; --muted:#97A3BE; --line:#28344E;
  --accent:#7C9DFF; --accent-ink:#0D1220; --accent-soft:#1F2C52; --gold:#F2B441; --gold-soft:#3A2E14;
  --ok:#5BC98A; --ok-soft:#163626; --warn:#EDB25A; --warn-soft:#3A2A12; --bad:#F27A72; --bad-soft:#3E1C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-body);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.tile{width:34px;height:34px;border-radius:8px;flex:none;background:
  radial-gradient(circle at 50% 50%,var(--gold) 0 18%,transparent 19%),
  conic-gradient(from 45deg,var(--accent) 0 25%,var(--surface) 0 50%,var(--accent) 0 75%,var(--surface) 0);
  border:2px solid var(--accent)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.1;display:block}
.brand span{font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{padding:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-width:1180px;width:100%;margin:0 auto;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button,.side nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
.tabbar button svg,.side nav button svg{width:22px;height:22px}
.tabbar button[aria-current="page"],.side nav button[aria-current="page"]{color:var(--accent)}
.tabbar button.scan{color:var(--accent-ink)}
.tabbar button.scan span.ic{background:var(--accent);border-radius:14px;padding:6px 14px;display:grid;place-items:center}
@media (min-width:900px){
  .app{grid-template-columns:230px 1fr}

  .side nav button{flex-direction:row;gap:12px;font-size:.92rem;padding:10px 12px;justify-content:flex-start}
  .side nav button[aria-current="page"]{background:var(--accent-soft)}
  .tabbar{display:none}
  .top .brand{display:none}
  main{padding-bottom:40px}
}

/* blocks */

.rowhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-blue{background:var(--accent-soft);color:var(--accent)} .p-gold{background:var(--gold-soft);color:var(--warn)}
.thumb{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;background:var(--sunk);color:var(--muted)}
.t-botanas{background:#FDE7C8;color:#9A5A00} .t-bebidas{background:#DCE6FF;color:#1C46B4} .t-panaderia{background:#F6E2D0;color:#8A4B1A} .t-lacteos{background:#E3F1F7;color:#1D6A86} .t-despensa{background:#E8EFDC;color:#4D6A1F} .t-hogar{background:#EDE3F6;color:#6A3E92} .t-frescos{background:#FBE2E2;color:#A3302B}
:root[data-theme="dark"] .thumb{filter:saturate(.9) brightness(.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thumb{filter:saturate(.9) brightness(.85)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}

.display{background:var(--sunk);border-radius:12px;padding:14px;text-align:right;font-family:var(--f-mono);font-size:1.7rem;overflow-x:auto;white-space:nowrap}

.tabbar{grid-template-columns:repeat(5,1fr)}

const NAV = ["inv","scan","ele","setup","set"];

/* ---------- shell ---------- */
function render(){
  const ae=document.activeElement, fid=ae&&ae.id, s0=ae&&ae.selectionStart, s1=ae&&ae.selectionEnd;
  document.documentElement.lang = S.lang;

  $("#top").innerHTML = header();
  $("#main").innerHTML = ({inv:viewInv, scan:viewScan, ele:viewEle, setup:viewSetup, set:viewSet}[S.view]||viewInv)();

function header(){

function thumb(p){ return `<div class="thumb t-${esc(p.cat||"")}" aria-hidden="true">${esc(initials(p.brand||p.name))}</div>`; }
function pill(p, st){ const l=level(p,st); return `<span class="pill ${l==="out"?"p-bad":l==="low"?"p-warn":"p-ok"}">${stockOf(p,st)}</span>`; }
function expPill(p){ const d=daysTo(p.exp); if (d==null || d>4) return ""; const txt=d<0?t("expired"):d===0?t("today"):d===1?t("tomorrow"):`${d} ${t("daysLeft")}`; return `<span class="pill ${d<=1?"p-bad":"p-warn"}">${txt}</span>`; }

function listHTML(){
  const q=S.q.trim().toLowerCase(), st=S.store;
  const rows=prodList().filter(p=>(S.cat==="all"||p.cat===S.cat)
    && (S.filter==="all" || (S.filter==="low" && level(p,st)!=="ok") || (S.filter==="exp" && (()=>{const d=daysTo(p.exp); return d!=null && d<=4 && stockOf(p,st)>0;})()))
    && (!q || p.name.toLowerCase().includes(q) || String(p.code||"").includes(q) || String(p.brand||"").toLowerCase().includes(q)))

/* ---------- keypad ---------- */
function openPad(id){ S.pad = {id, mode:"set", val:"", store: S.view==="scan" ? S.scanStore : (S.store==="all" ? "1" : S.store)}; }
function padHTML(){
  const P=S.pad; if (!P || !S.products[P.id]) return "";
  const p={id:P.id, ...S.products[P.id]}, cur=stockOf(p,P.store), n=parseInt(P.val||"0",10)||0;

    <div class="rowhead"><div style="display:flex;gap:10px;align-items:center;min-width:0">${thumb(p)}<b style="min-width:0">${esc(p.name)}</b></div><button class="btn ghost" data-act="padClose" aria-label="${t("cancel")}">✕</button></div>
    <div class="padmodes">${[["set","padSet"],["add","padAdd"],["sub","padSub"]].map(([m,k])=>`<button data-act="padMode" data-v="${m}" aria-pressed="${P.mode===m}">${t(k)}</button>`).join("")}</div>
    <div class="padshow"><span class="small muted">${t("current")}: <b>${cur}</b></span><span class="padval">${P.mode==="add"?"+":P.mode==="sub"?"−":""}${P.val||"0"}</span><span class="small">${t("willBe")}: <b>${next}</b> ${t("units")}</span></div>
    <div class="padkeys">${["1","2","3","4","5","6","7","8","9","C","0","⌫"].map(k=>`<button data-act="padKey" data-v="${k}" class="${k==="C"||k==="⌫"?"op":""}">${k}</button>`).join("")}</div>
    <button class="btn primary big" data-act="padSave" ${P.val===""?"disabled":""}>${t("save")} · ${next} ${t("units")}</button>
  </div></div>`;
}
function padSave(){
  const P=S.pad, p=S.products[P.id], k="s"+P.store, cur=p[k]||0, n=parseInt(P.val||"0",10)||0;
  const next = P.mode==="set" ? n : P.mode==="add" ? cur+n : Math.max(0,cur-n);
  p[k]=next; logIt(P.mode==="set"?"set":P.mode==="add"?"in":"adj", `${p.name}: ${cur} → ${next}`, P.store);
  S.pad=null; tick("count"); changed(); toast(`${p.name} · ${S.offline?t("savedQueue"):t("saved")}`);
}

    <label class="btn filebtn" style="align-self:flex-start">${I.cam} ${t("barcode")}<input id="fileBarcode" type="file" accept="image/*" capture="environment"></label></div>`;
}
/* ---------- live camera scanner (one element, moved into the scan screen on each render) ---------- */
const CAM = { el:null, video:null, stream:null, running:false, detector:null, zx:null, lastCode:"", lastAt:0, canvas:null, ctx:null, ac:null };
function camBuild(){
  if (CAM.el) return;
  const el=document.createElement("div"); el.className="cam";
  el.innerHTML=`<video playsinline muted autoplay></video><div class="cam-frame"></div><div class="cam-tools"><button type="button" class="cam-btn" data-cam="torch" hidden aria-label="Luz">💡</button><button type="button" class="cam-btn" data-cam="pause" aria-label="Pausa">⏸</button></div><div class="cam-flash" hidden></div><button type="button" class="cam-open" data-cam="open" hidden></button>`;
  CAM.el=el; CAM.video=el.querySelector("video"); CAM.canvas=document.createElement("canvas"); CAM.ctx=CAM.canvas.getContext("2d",{willReadFrequently:true});
  el.addEventListener("click", async e=>{ const b=e.target.closest("[data-cam]"); if (!b) return;
    if (b.dataset.cam==="pause"){ S.camPaused=!S.camPaused; b.textContent=S.camPaused?"▶":"⏸"; el.classList.toggle("paused",S.camPaused); }
    if (b.dataset.cam==="open"){ camStart(); }
    if (b.dataset.cam==="torch"){ const tr=CAM.stream&&CAM.stream.getVideoTracks()[0]; if (!tr) return; const on=b.getAttribute("aria-pressed")!=="true"; try{ await tr.applyConstraints({advanced:[{torch:on}]}); b.setAttribute("aria-pressed",on); }catch(_){} }
  });
}
function camMsg(k){ const m=document.getElementById("camMsg"); if (m) m.textContent=t(k); }
async function camStart(){
  camBuild(); if (CAM.running || CAM.starting) return; CAM.starting=true;
  const openBtn=CAM.el.querySelector('[data-cam="open"]'); openBtn.hidden=true;
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    CAM.video.srcObject=CAM.stream; await CAM.video.play();
    try{ const caps=CAM.stream.getVideoTracks()[0].getCapabilities(); if (caps&&caps.torch) CAM.el.querySelector('[data-cam="torch"]').hidden=false; }catch(_){}
    if (!CAM.detector && "BarcodeDetector" in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); CAM.detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf"].filter(x=>f.includes(x))}); }catch(_){ CAM.detector=null; } }
    CAM.running=true; camMsg("camHint"); camLoop();
  }catch(e){ openBtn.hidden=false; openBtn.textContent=t("camOpen"); camMsg("camNo"); }
  finally{ CAM.starting=false; }
}
function camStop(){ CAM.running=false; if (CAM.stream){ CAM.stream.getTracks().forEach(x=>x.stop()); CAM.stream=null; } }
async function camLoop(){
  if (!CAM.running) return;
  const v=CAM.video;
  if (!S.camPaused && !S.pad && v.readyState>=2){
    try{
      if (CAM.detector){ const r=await CAM.detector.detect(v); if (r&&r[0]) camHit(r[0].rawValue); }
      else if (window.ZXing){
        const w=v.videoWidth, h=v.videoHeight, cw=Math.min(960,w), ch=Math.round(h*cw/w), cropH=Math.round(ch*0.45), y0=Math.round((ch-cropH)/2);
        CAM.canvas.width=cw; CAM.canvas.height=cropH; CAM.ctx.drawImage(v,0,Math.round(y0*h/ch),w,Math.round(cropH*h/ch),0,0,cw,cropH);
        if (!CAM.zx){ CAM.zx=new ZXing.MultiFormatReader(); const H=new Map(); H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.ITF]); H.set(ZXing.DecodeHintType.TRY_HARDER,true); CAM.zx.setHints(H); }
        try{ camHit(CAM.zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(CAM.canvas)))).getText()); }catch(_){}
      }
    }catch(_){}
  }
  setTimeout(()=>requestAnimationFrame(camLoop), CAM.detector?70:120);
}
function beep(ok){ try{ CAM.ac=CAM.ac||new (window.AudioContext||window.webkitAudioContext)(); const o=CAM.ac.createOscillator(), g=CAM.ac.createGain(); o.type="square"; o.frequency.value=ok?1760:440; g.gain.value=.06; o.connect(g); g.connect(CAM.ac.destination); o.start(); o.stop(CAM.ac.currentTime+(ok?.09:.25)); }catch(_){} try{ navigator.vibrate&&navigator.vibrate(ok?60:[60,60,60]); }catch(_){} }
function camFlash(txt, ok){ const f=CAM.el.querySelector(".cam-flash"); f.textContent=txt; f.className="cam-flash"+(ok?"":" bad"); f.hidden=false; clearTimeout(f._t); f._t=setTimeout(()=>f.hidden=true,1300);
  const fr=CAM.el.querySelector(".cam-frame"); fr.classList.add(ok?"hit":"miss"); setTimeout(()=>fr.classList.remove("hit","miss"),400); }
function camHit(code){
  code=String(code||"").trim(); if (!/^[A-Za-z0-9.\-]{3,40}$/.test(code)) return;
  const now=Date.now();
  if (code===CAM.lastCode && now-CAM.lastAt<1200){ CAM.lastAt=now; return; }   // still in view: count once
  CAM.lastCode=code; CAM.lastAt=now;
  const p=prodList().find(x=>String(x.code)===code);
  if (!p){ beep(false); camFlash("? "+code, false); S.scan={notFound:true, code}; render(); return; }
  beep(true);
  if (S.camMode==="plus"){ const q=S.products[p.id]; const cur=q.s1||0; q.s1=cur+1; logIt("in", `${q.name}: ${cur} → ${q.s1}`, "1"); changed(); camFlash(`+1 ${q.name} · ${q.s1}`, true); }
  else { camFlash(p.name, true); S.scan=null; openPad(p.id); render(); }
}
function afterRender(){
  if (CAM._pad && !S.pad) CAM.lastAt=Date.now();   // just closed the keypad: do not re-read the same code still in view
  CAM._pad=!!S.pad;
  if (S.view==="scan"){ camBuild(); const slot=document.getElementById("camSlot"); if (slot && CAM.el.parentNode!==slot){ slot.appendChild(CAM.el); if (CAM.video.srcObject) CAM.video.play().catch(()=>{}); } if (!CAM.running) camStart(); }
  else if (CAM.running) camStop();
}
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) camStop(); else if (S.view==="scan") camStart(); });
function findCode(code){ code=String(code).trim(); if (!code) return null; const ps=prodList(); return ps.find(p=>String(p.code)===code) || ps.find(p=>p.name.toLowerCase().includes(code.toLowerCase())) || null; }
function showScanned(code){ const p=findCode(code); if (p){ S.scan=null; openPad(p.id); } else S.scan={notFound:true, code}; render(); }
async function decodeBarcode(file){
  const url=URL.createObjectURL(file);
  try{ const img=new Image(); img.src=url; await img.decode();
    if ("BarcodeDetector" in window){ try{ const r=await new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]}).detect(img); if (r&&r[0]) return r[0].rawValue; }catch(e){} }
    if (window.ZXing){ for (const max of [1600,1000,700]){ try{ const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const h=new Map(); h.set(ZXing.DecodeHintType.TRY_HARDER,true); const r=new ZXing.MultiFormatReader(); r.setHints(h); return r.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText(); }catch(e){} } }
    return null; } finally { URL.revokeObjectURL(url); }
}

/* ---------- Eleventa ---------- */
const norm = s => String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function colIndex(head){
  const H=head.map(norm), find=(...tests)=>H.findIndex(h=>tests.some(tt=>tt(h)));
  return { code: find(h=>h==="codigo"||h.startsWith("codigo")||h==="clave"||h==="sku"),
    name: find(h=>h.startsWith("descripcion")||h==="producto"||h==="nombre"),
    cost: find(h=>h.includes("costo")),
    price: find(h=>(h.includes("venta")&&h.includes("precio"))||h==="precio venta"||h==="p venta"||h==="precio"),
    dept: find(h=>h.startsWith("departamento")||h==="depto"),
    qty: find(h=>h.includes("existencia")||h.includes("inventario")||h==="cantidad"||h.startsWith("cantidad")),
    min: find(h=>h.includes("minimo")||h==="inv min") };
}
function parseRows(aoa){
  let hi=-1, ix=null;
  for (let i=0;i<Math.min(aoa.length,15);i++){ const c=colIndex(aoa[i]||[]); if (c.code>-1 && c.name>-1){ hi=i; ix=c; break; } }
  if (hi<0) return null;
  const num=v=>{ const n=parseFloat(String(v??"").replace(/[$,\s]/g,"")); return isNaN(n)?null:n; };
  return aoa.slice(hi+1).filter(r=>r && String(r[ix.code]??"").trim() && String(r[ix.name]??"").trim()).map(r=>({
    code:String(r[ix.code]).trim(), name:String(r[ix.name]).trim(), cost: ix.cost>-1?num(r[ix.cost]):null, price: ix.price>-1?num(r[ix.price]):null,
    dept: ix.dept>-1?String(r[ix.dept]??"").trim():"", qty: ix.qty>-1?num(r[ix.qty]):null, min: ix.min>-1?num(r[ix.min]):null }));
}
const deptToCat = d => { const n=norm(d); for (const [k,v] of Object.entries(T.es.cats)) if (norm(v)===n||k===n) return k;
  if (/refresco|bebida|agua|jugo/.test(n)) return "bebidas"; if (/botana|dulce|galleta/.test(n)) return "botanas"; if (/pan|bimbo/.test(n)) return "panaderia";
  if (/lacteo|leche|queso|crema/.test(n)) return "lacteos"; if (/limpieza|hogar|jabon/.test(n)) return "hogar"; if (/fruta|verdura|huevo|tortilla|carne|fresco/.test(n)) return "frescos"; return "despensa"; };
function previewImport(rows, source){
  const byCode={}; prodList().forEach(p=>byCode[String(p.code)]=p);
  S.imp={rows, source, store: S.store==="all"?"1":S.store};
}
function impStats(){ const I0=S.imp, byCode={}; prodList().forEach(p=>byCode[String(p.code)]=p); let nw=0, ch=0;
  I0.rows.forEach(r=>{ const p=byCode[r.code]; if (!p) nw++; else if (r.qty!=null && (p["s"+I0.store]||0)!==r.qty) ch++; }); return {nw, ch}; }
function applyImport(){
  const I0=S.imp, k="s"+I0.store, byCode={}; prodList().forEach(p=>byCode[String(p.code)]=p);
  I0.rows.forEach(r=>{ let p=byCode[r.code];
    if (!p){ const id=uid("p"); S.products[id]={name:r.name, brand:r.name.split(" ")[0], cat:deptToCat(r.dept), dept:r.dept||"", price:r.price||0, cost:r.cost||0, min:r.min||5, s1:0, s2:0, code:r.code, exp:null}; p=S.products[id]; }
    else p=S.products[p.id];
    p.name=r.name; if (r.price!=null) p.price=r.price; if (r.cost!=null) p.cost=r.cost; if (r.dept) p.dept=r.dept; if (r.min!=null) p.min=r.min; if (r.qty!=null) p[k]=r.qty; });
  S.lastImp=new Date().toISOString(); logIt("imp", `${I0.rows.length} ${S.lang==="es"?"productos":"products"} ← ${I0.source}`, I0.store);
  S.imp=null; tick("imp"); changed(); toast(t("impDone"));
}
function sampleEleventa(){
  const head=["Código","Descripción","Precio Costo","Precio Venta","Precio Mayoreo","Departamento","Existencia","Inv. Mínimo"];
  const rows=prodList().slice(0,22).map((p,i)=>[p.code,p.name,p.cost,p.price,"",p.dept||T.es.cats[p.cat],Math.max(0,(p.s1||0)+((i%5)-2)*3),p.min]);
  rows.push(["7501055300075","Galletas Marías Gamesa 170 g",12.5,17,"","Botanas",24,8],["7501020515343","Atún Dolores en agua 140 g",17.8,24,"","Despensa",18,6],["7501031311309","Pinol Original 828 ml",22,30,"","Limpieza",9,4]);
  return [head,...rows];
}
async function readFile(f){
  if (!window.XLSX){ toast(S.lang==="es"?"Falta conexión para leer Excel. Intenta otra vez con internet.":"Needs internet to read Excel. Try again online."); return; }
  try{ const wb=XLSX.read(await f.arrayBuffer(), {type:"array"}); let rows=null;
    for (const n of wb.SheetNames){ rows=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:""})); if (rows && rows.length) break; }
    if (!rows || !rows.length){ S.imp=null; toast(t("impBad")); render(); return; }
    previewImport(rows, f.name); render();
  }catch(e){ toast(t("impBad")); }
}
function exportAoa(st){
  const head=["Código","Descripción","Precio Costo","Precio Venta","Departamento","Cantidad en inventario","Mínimo","Tipo de venta"];
  return [head, ...prodList().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[String(p.code||""), p.name, p.cost||0, p.price||0, p.dept||T.es.cats[p.cat]||"", p["s"+st]||0, p.min||0, "Unidad"])];
}
let DL=null;
async function doExport(){
  if (!window.XLSX){ toast(S.lang==="es"?"Falta conexión para crear el Excel.":"Needs internet to build the Excel."); return; }
  const st=S.expStore, ws=XLSX.utils.aoa_to_sheet(exportAoa(st)); ws["!cols"]=[{wch:16},{wch:34},{wch:12},{wch:12},{wch:14},{wch:12},{wch:9},{wch:12}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Productos");
  const d=new Date(), name=`eleventa-inventario-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.xlsx`;
  const buf=XLSX.write(wb, {bookType:"xlsx", type:"array"});
  let ok=false;
  if (DL){ try{ await DL.save({filename:name, data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}); ok=true; }catch(e){ if (e && e.code==="declined") return; } }
  if (!ok){ try{ XLSX.writeFile(wb, name); ok=true; }catch(e){ toast(t("expNo")); return; } }
  S.lastExp=new Date().toISOString(); tick("exp2"); logIt("imp", `${prodList().length} ${S.lang==="es"?"productos":"products"} → ${name}`, st); save(); toast(`${t("expDone")} · ${name}`); render();
}

  ${prev}
  <section class="card"><h3>${t("expTitle")}</h3><ol class="steps">${T[S.lang].expSteps.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>

  <div class="banner info small">${t("eleNote")}</div>`;

  return `<h2>${t("set")}</h2><section class="card">

  </section>`;

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const nav=e.target.closest("[data-nav]"); if (nav){ S.view=nav.dataset.nav; S.scan=null; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest("[data-act]"); if (!b || b.tagName==="INPUT") return;
  const a=b.dataset.act, v=b.dataset.v, id=b.dataset.id;
  const H={
    lang(){ S.lang=v; savePrefs(); }, role(){ S.role=v; savePrefs(); },
    store(){ S.store=v; if (v!=="all"){ S.scanStore=v; S.expStore=v; } savePrefs(); },
    toggleOffline(){ S.offline=!S.offline; if (!S.offline && S.pending){ toast(S.lang==="es"?`Conexión de vuelta: ${S.pending} cambios enviados`:`Back online: ${S.pending} changes sent`); S.pending=0; } },
    refresh(){ doRefresh(); return "skip"; },
    filter(){ S.filter=v; }, cat(){ S.cat=v; },
    pad(){ openPad(id); },
    padClose(){ if (e.target.closest("[data-stop]") && !e.target.closest('[data-act="padClose"]')) return "skip"; S.pad=null; },
    padStore(){ S.pad.store=v; }, padMode(){ S.pad.mode=v; },
    padKey(){ const P=S.pad; if (v==="C") P.val=""; else if (v==="⌫") P.val=P.val.slice(0,-1); else if (P.val.length<4) P.val=(P.val==="0"?"":P.val)+v; },
    padSave(){ padSave(); },
    scanStore(){ S.scanStore=v; }, scanClear(){ S.scan=null; }, camMode(){ S.camMode=v; },
    manualFind(){ const c=$("#manualCode").value; if (c.trim()) showScanned(c); return "skip"; },
    quickScan(){ showScanned(S.products[id].code); return "skip"; },
    newProduct(){ const n=$("#np_name").value.trim(); if (!n){ $("#np_name").focus(); return "skip"; } const pid=uid("p"), cat=$("#np_cat").value, price=parseFloat($("#np_price").value)||0, q=parseInt($("#np_qty").value)||0;
      S.products[pid]={name:n, brand:n.split(" ")[0], cat, dept:T.es.cats[cat], price, cost:Math.round(price*0.75*100)/100, min:5, s1:0, s2:0, code:b.dataset.code, exp:null}; S.products[pid]["s"+S.scanStore]=q;
      logIt("new", `${n} (${q})`, S.scanStore); S.scan=null; changed(); toast(t("saved")); },
    trySample(){ previewImport(parseRows(sampleEleventa()), "eleventa-ejemplo.xlsx"); },
    impStore(){ S.imp.store=v; }, impApply(){ applyImport(); }, impCancel(){ S.imp=null; },
    expStore(){ S.expStore=v; }, export(){ doExport(); return "skip"; },
    prog(){ S.setup.prog=v; save(); },
    tick(){ S.setup.done[v]=!S.setup.done[v]; save(); },
    untickAll(){ S.setup.done={}; save(); },
    reset(){ if (!S.resetArm){ S.resetArm=true; setTimeout(()=>{ S.resetArm=false; if (S.view==="set") render(); },4000); return; }
      S.resetArm=false; S.products=seedProducts(); S.log=[]; S.lastImp=null; S.lastExp=null; S.pending=0; S.setup={prog:"eleventa",done:{}}; save(); toast(S.lang==="es"?"Demo reiniciada":"Demo reset"); }
  };
  if (H[a]){ const r=H[a](); if (r!=="skip") render(); }
});
document.addEventListener("input", e=>{ if (e.target.id==="q"){ S.q=e.target.value; $("#list").innerHTML=listHTML(); } });
document.addEventListener("change", async e=>{
  const el=e.target; if (el.type!=="file" || !el.files || !el.files[0]) return; const f=el.files[0]; el.value="";
  if (el.id==="fileEle") return readFile(f);
  if (el.id==="fileBarcode"){ S.scan={reading:true}; render(); const code=await decodeBarcode(f); if (code) showScanned(code); else { S.scan={error:t("notRead")}; render(); } }
});
document.addEventListener("keydown", e=>{
  if (S.pad){ const k=e.key, P=S.pad;
    if (/^[0-9]$/.test(k)){ if (P.val.length<4) P.val=(P.val==="0"?"":P.val)+k; render(); e.preventDefault(); return; }
    if (k==="Backspace"){ P.val=P.val.slice(0,-1); render(); e.preventDefault(); return; }
    if (k==="Escape"){ S.pad=null; render(); return; }
    if (k==="Enter" && P.val!==""){ padSave(); render(); e.preventDefault(); return; } }
  if (e.key==="Enter" && e.target.id==="manualCode"){ e.preventDefault(); const c=e.target.value; if (c.trim()) showScanned(c); }
});
window.addEventListener("online", ()=>{ if (S.offline){ S.offline=false; S.pending=0; render(); } });

/* ---------- refresh ---------- */
let refreshing=false;
async function doRefresh(){
  if (refreshing) return; refreshing=true; const btn=document.querySelector('[data-act="refresh"]'); if (btn) btn.classList.add("spin");
  try{ if (!window.XLSX || !window.ZXing){ try{ sessionStorage.setItem("pdc_inv_view", JSON.stringify({view:S.view, y:scrollY})); }catch(e){} location.reload(); return; }
    load(); if (!S.offline && S.pending) S.pending=0; await new Promise(r=>setTimeout(r,350)); render(); toast(t("refreshed"));
  } finally { refreshing=false; const b2=document.querySelector('[data-act="refresh"]'); if (b2) b2.classList.remove("spin"); }
}
(function(){ const ind=$("#ptr"); let y0=null, dy=0;
  const show=()=>{ ind.style.transform=`translate(-50%, ${Math.min(dy*.5,70)-60}px)`; ind.className="ptr"+(dy>110?" ready":""); ind.innerHTML=I.refresh+(dy>110?t("releaseR"):t("pullR")); };
  addEventListener("touchstart", e=>{ if (scrollY<=0 && e.touches.length===1 && !S.pad && !e.target.closest("input,textarea,select,.tablewrap,.seg")){ y0=e.touches[0].clientY; dy=0; } else y0=null; }, {passive:true});
  addEventListener("touchmove", e=>{ if (y0==null) return; dy=e.touches[0].clientY-y0; if (dy>8 && scrollY<=0) show(); }, {passive:true});
  addEventListener("touchend", ()=>{ if (y0==null) return; const go=dy>110; y0=null; if (go){ ind.className="ptr go"; ind.innerHTML=I.refresh+t("refresh"); ind.style.transform="translate(-50%,10px)"; doRefresh().finally(()=>ind.style.transform="translate(-50%,-60px)"); } else ind.style.transform="translate(-50%,-60px)"; dy=0; }, {passive:true});
})();

/* ---------- boot ---------- */
load(); S.scanStore=S.expStore=(S.store==="all"?"1":S.store);
try{ const x=JSON.parse(sessionStorage.getItem("pdc_inv_view")||"null"); if (x){ sessionStorage.removeItem("pdc_inv_view"); S.view=x.view||S.view; setTimeout(()=>{ scrollTo(0,x.y||0); toast(t("refreshed")); },50); } }catch(e){}
(function(){var last=0;addEventListener("scroll",function(){var t=document.getElementById("top");if(!t)return;var y=scrollY;if(innerWidth>=900||document.body.classList.contains("padopen")){t.classList.remove("hidebar");last=y;return;}if(y>last+4&&y>90)t.classList.add("hidebar");else if(y<last-4||y<90)t.classList.remove("hidebar");last=y;},{passive:true});})();
render();
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
