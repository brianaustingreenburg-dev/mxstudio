<style>

/* Layout: app shell — sidebar on wide screens, bottom tab bar on phones; talavera cobalt + cempasúchil marigold on a cool paper ground */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#14203A; --muted:#5A6684; --line:#DCE2EC;
  --accent:#1C46B4; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB; --gold:#E39B12; --gold-soft:#FCF0D6;

  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#161E30; --sunk:#1E2840; --ink:#E7ECF6; --muted:#97A3BE; --line:#28344E;
  --accent:#7C9DFF; --accent-ink:#0D1220; --accent-soft:#1F2C52; --gold:#F2B441; --gold-soft:#3A2E14;
  --ok:#5BC98A; --ok-soft:#163626; --warn:#EDB25A; --warn-soft:#3A2A12; --bad:#F27A72; --bad-soft:#3E1C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161E30; --sunk:#1E2840; --ink:#E7ECF6; --muted:#97A3BE; --line:#28344E;
  --accent:#7C9DFF; --accent-ink:#0D1220; --accent-soft:#1F2C52; --gold:#F2B441; --gold-soft:#3A2E14;
  --ok:#5BC98A; --ok-soft:#163626; --warn:#EDB25A; --warn-soft:#3A2A12; --bad:#F27A72; --bad-soft:#3E1C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-body);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.tile{width:34px;height:34px;border-radius:8px;flex:none;background:
  radial-gradient(circle at 50% 50%,var(--gold) 0 18%,transparent 19%),
  conic-gradient(from 45deg,var(--accent) 0 25%,var(--surface) 0 50%,var(--accent) 0 75%,var(--surface) 0);
  border:2px solid var(--accent)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.1;display:block}

.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap}

main{padding:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-width:1180px;width:100%;margin:0 auto;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button,.side nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
.tabbar button svg,.side nav button svg{width:22px;height:22px}
.tabbar button[aria-current="page"],.side nav button[aria-current="page"]{color:var(--accent)}
.tabbar button.scan{color:var(--accent-ink)}

@media (min-width:900px){

  .side nav button[aria-current="page"]{background:var(--accent-soft)}
  .tabbar{display:none}
  .top .brand{display:none}
  main{padding-bottom:40px}
}

.thumb{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;background:var(--sunk);color:var(--muted)}
.t-botanas{background:#FDE7C8;color:#9A5A00} .t-bebidas{background:#DCE6FF;color:#1C46B4} .t-panaderia{background:#F6E2D0;color:#8A4B1A} .t-lacteos{background:#E3F1F7;color:#1D6A86} .t-despensa{background:#E8EFDC;color:#4D6A1F} .t-hogar{background:#EDE3F6;color:#6A3E92} .t-frescos{background:#FBE2E2;color:#A3302B}

function nameFrom(p){
  if (!p) return "";
  let n=(p.product_name_es||p.product_name||p.generic_name_es||p.generic_name||"").trim();
  const brand=String(p.brands||"").split(",")[0].trim(), qty=String(p.quantity||"").trim();
  if (!n) return "";

async function readFile(f){
  if (!window.XLSX){ toast(S.lang==="es"?"Falta conexión para leer Excel. Intenta otra vez con internet.":"Needs internet to read Excel. Try again online."); return; }
  try{ const wb=XLSX.read(await f.arrayBuffer(), {type:"array"}); let rows=null;
    for (const n of wb.SheetNames){ rows=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:""})); if (rows && rows.length) break; }
    if (!rows || !rows.length){ S.imp=null; toast(t("impBad")); render(); return; }
    previewImport(rows, f.name); render();
  }catch(e){ toast(t("impBad")); }
}
function exportAoa(st){
  const head=["Código","Descripción","Precio Costo","Precio Venta","Departamento","Cantidad en inventario","Mínimo","Tipo de venta"];
  return [head, ...prodList().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[String(p.code||""), p.name, p.cost||0, p.price||0, p.dept||T.es.cats[p.cat]||"", p["s"+st]||0, p.min||0, "Unidad"])];
}
let DL=null;
async function doExport(){
  if (!window.XLSX){ toast(S.lang==="es"?"Falta conexión para crear el Excel.":"Needs internet to build the Excel."); return; }
  const st=S.expStore, ws=XLSX.utils.aoa_to_sheet(exportAoa(st)); ws["!cols"]=[{wch:16},{wch:34},{wch:12},{wch:12},{wch:14},{wch:12},{wch:9},{wch:12}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Productos");
  const d=new Date(), name=`eleventa-inventario-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.xlsx`;
  const buf=XLSX.write(wb, {bookType:"xlsx", type:"array"});
  let ok=false;
  if (DL){ try{ await DL.save({filename:name, data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}); ok=true; }catch(e){ if (e && e.code==="declined") return; } }
  if (!ok){ try{ XLSX.writeFile(wb, name); ok=true; }catch(e){ toast(t("expNo")); return; } }
  S.lastExp=new Date().toISOString(); tick("exp2"); logIt("imp", `${prodList().length} ${S.lang==="es"?"productos":"products"} → ${name}`, st); save(); toast(`${t("expDone")} · ${name}`); render();
}

const PAIR_KEY="pdc_live_pair", QUEUE_KEY="pdc_live_queue";
const SYNC={ pair:null, rev:0, queue:[], online:false, busy:false, timer:null };
try{ SYNC.pair=JSON.parse(localStorage.getItem(PAIR_KEY)||"null"); SYNC.queue=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]"); }catch(_){}
function applyPair(h){ const k=h.get("k"), u=h.get("u");
  const r=h.get("r")||"https://ntfy.sh";
  if (k && /^[A-Za-z0-9_-]{20,64}$/.test(k) && u && (u==="auto" || /^(https:\/\/|http:\/\/localhost)/.test(u)) && /^(https:\/\/|http:\/\/localhost)/.test(r)){
    const prev=SYNC.pair; SYNC.pair={k, u, r, n:h.get("n")||"", who:(prev&&prev.who)||""}; SYNC.base=null; try{ localStorage.removeItem("pdc_live_base"); }catch(_){} SYNC.rev=0; SYNC.fresh=true;
    try{ localStorage.setItem(PAIR_KEY, JSON.stringify(SYNC.pair)); }catch(_){}
    return true; } return false; }
if (applyPair(new URLSearchParams(location.hash.slice(1)))) history.replaceState(null,"",location.pathname);
if (SYNC.pair && /netlify\.app/i.test(SYNC.pair.u||"")){ SYNC.pair.u="auto"; SYNC.pair.r="https://ntfy.sh"; try{ localStorage.setItem(PAIR_KEY, JSON.stringify(SYNC.pair)); }catch(_){} }
try{ SYNC.base=localStorage.getItem("pdc_live_base")||null; }catch(_){}
SYNC.baseAt=0;
async function storeTopic(k){ const h=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mxinv-topic:"+k)); return "mxinv-"+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,24); }
// where the store computer answers right now
async function apiUrl(){
  const P=SYNC.pair; if (P.u!=="auto") return P.u;
  if (SYNC.base) return SYNC.base+"/api/inventario";
  if (Date.now()-SYNC.baseAt<15000) throw new Error("no link yet");
  SYNC.baseAt=Date.now();
  const r=await fetch(`${P.r||"https://ntfy.sh"}/${await storeTopic(P.k)}/json?poll=1&since=all`,{cache:"no-store"});
  if (!r.ok) throw new Error("relay "+r.status);
  let last=null; for (const line of (await r.text()).split("\n")){ try{ const m=JSON.parse(line); if (m.event==="message" && /^https?:\/\/[^\s]+$/.test((m.message||"").trim())) last=m.message.trim(); }catch(_){} }
  if (!last) throw new Error("store computer not announced");
  SYNC.base=last.replace(/\/+$/,""); try{ localStorage.setItem("pdc_live_base", SYNC.base); }catch(_){}
  return SYNC.base+"/api/inventario";
}
function linkFailed(){ if (SYNC.pair && SYNC.pair.u==="auto"){ SYNC.base=null; try{ localStorage.removeItem("pdc_live_base"); }catch(_){} } }
const syncOn=()=>!!(SYNC.pair&&SYNC.pair.k);
function saveQueue(){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(SYNC.queue)); }catch(_){} }
function syncOp(op){ if (!syncOn()) return; op.opId=uid("o"); op.who=(SYNC.pair.who||""); op.ts=new Date().toISOString(); SYNC.queue.push(op); saveQueue(); syncFlush(); }
function applyLocalOp(op){
  const id="c"+op.code; let p=S.products[id];
  if (op.t==="delete"){ delete S.products[id]; return; }
  if (!p){ if (op.t!=="upsert") return; p=S.products[id]={name:op.name||op.code, brand:"", cat:op.cat||"otros", dept:"", price:0, cost:0, min:0, s1:0, s2:0, code:op.code, exp:null}; }
  if (op.t==="upsert"){ if (op.name) p.name=op.name; if (op.cat) p.cat=op.cat; if (op.qty!==undefined) p.s1=op.qty; }
  if (op.t==="count"){ const n=parseInt(op.val,10)||0, cur=p.s1||0; p.s1=op.mode==="add"?cur+n:op.mode==="sub"?Math.max(0,cur-n):n; }
  p.by=op.who; p.at=op.ts;
}
function mergeRemote(list, full){
  if (full){ const keep={}; S.products=keep; }
  for (const r of list){
    const id="c"+r.code;
    if (r.del){ delete S.products[id]; continue; }
    const p=S.products[id]||(S.products[id]={brand:"", dept:"", price:0, cost:0, min:0, s2:0, exp:null});
    Object.assign(p,{name:r.name, brand:String(r.name||"").split(" ")[0], cat:r.cat||"otros", s1:r.qty||0, code:r.code, eleQty:r.eleQty, by:r.by||"", at:r.at||null});
    if (r.code && r.name && r.name!==r.code) rememberName(r.code, r.name, r.cat);
  }
  SYNC.queue.forEach(applyLocalOp);   // my changes that haven't reached the store yet stay on screen
}
async function syncFlush(){
  if (!syncOn() || SYNC.busy || !SYNC.queue.length) return;
  SYNC.busy=true; const batch=SYNC.queue.slice(0,200);
  try{ const r=await fetch(await apiUrl(), {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({k:SYNC.pair.k, ops:batch})});
    if (!r.ok) throw new Error("http "+r.status);
    SYNC.queue=SYNC.queue.slice(batch.length); saveQueue(); SYNC.online=true;
  }catch(_){ SYNC.online=false; linkFailed(); }
  finally{ SYNC.busy=false; }
  if (SYNC.online && SYNC.queue.length) return syncFlush();
  syncPull();
}
async function syncPull(){
  if (!syncOn()) return;
  try{ const r=await fetch(`${await apiUrl()}?k=${encodeURIComponent(SYNC.pair.k)}&since=${SYNC.rev}`, {cache:"no-store"});
    if (!r.ok) throw new Error("http "+r.status);
    const j=await r.json(); SYNC.online=true; if (j.full) SYNC.cloudCount=j.products.length;
    if ((j.full && j.products.length) || (!j.full && j.products.length)){ mergeRemote(j.products, j.full); save(); }
    SYNC.rev=j.rev||SYNC.rev;
  }catch(_){ SYNC.online=false; linkFailed(); }
  const ae=document.activeElement; if (!S.pad && !S.newp && !(ae && (ae.tagName==="INPUT"||ae.tagName==="SELECT"||ae.tagName==="TEXTAREA"))) render(); else updateHeader();
}

async function storeLoadCloud(){

  const rows=Object.values(SEED.products).map(p=>({code:p.barcode, name:p.name, cat:p.cat, qty:p.s1}));
  if (!rows.length) return;
  try{ const r=await fetch(await apiUrl(),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({k:SYNC.pair.k,t:"import",rows})});
    if (r.ok){ try{ localStorage.setItem(flag,"1"); }catch(_){} SYNC.rev=0; await syncPull(); } }catch(_){}
}
async function syncJoin(){
  // first time on this phone: take the store's list, then send what this phone counted itself
  let mine=[];
  if (SYNC.fresh){ SYNC.fresh=false; mine=Object.values(S.products).filter(p=>p.code && !(p.seed && (p.s1||0)===(p.q0||0))); }
  await syncFlush(); if (!SYNC.queue.length) await syncPull();
  await storeLoadCloud();
  if (mine.length){ for (const p of mine) SYNC.queue.push({t:"upsert", code:p.code, name:p.name, cat:p.cat, qty:p.s1||0, opId:uid("o"), who:SYNC.pair.who||"", ts:new Date().toISOString()}); saveQueue(); await syncFlush(); }
}
