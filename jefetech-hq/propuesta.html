.btn{all:unset;box-sizing:border-box;display:block;text-align:center;cursor:pointer;border-radius:14px;padding:15px 12px;font-weight:800;font-size:16px}

ol.src{padding-left:20px;display:grid;gap:8px;font-size:13px;color:var(--mut)}

</head>
