<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JefeTech Live Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#0d0f14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#0d0f14;border-bottom:1px solid rgba(0,230,118,.15);flex-shrink:0;}
  .header-logo{font-size:15px;font-weight:900;color:#00e676}
  .header-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}
  .layout{display:flex;height:calc(100vh - 94px);height:calc(100dvh - 94px);}
  .pane{flex:1;display:flex;flex-direction:column;border-right:1px solid rgba(0,230,118,.1);}
  .pane:last-child{border-right:none;}
  .pane-label{background:#111318;padding:8px 14px;font-size:11px;font-weight:800;color:rgba(0,230,118,.7);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid rgba(0,230,118,.1);flex-shrink:0;}
  .pane iframe{flex:1;width:100%;border:none;background:#0d0f14;}

  /* Desktop tab bar */
  .dtabs{display:flex;gap:0;border-bottom:1px solid rgba(0,230,118,.15);background:#0b0d13;flex-shrink:0;}
  .dtab{flex:1;border:none;background:none;color:rgba(255,255,255,.45);font-size:12px;font-weight:800;padding:11px 8px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;letter-spacing:.3px;transition:.15s;white-space:nowrap;}
  .dtab[aria-pressed="true"]{color:#00e676;border-bottom-color:#00e676;background:rgba(0,230,118,.04);}

  /* Mobile: single visible pane at a time */
  @media(max-width:700px){
    .header-sub{display:none}
    .layout{height:calc(100vh - 94px);height:calc(100dvh - 94px);}
    .pane{position:absolute;top:94px;left:0;right:0;bottom:0;flex:none;}
    .pane[hidden]{display:none!important}
    .pane-label{display:none}
    .layout{position:relative;}
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-logo">⚡ JefeTech Live Demo</div>
    <div class="header-sub">Full ecosystem — app · owner dashboard · partner dashboard · pricing</div>
  </div>
  <a href="https://go.myjefetech.app/checkout.html?ref=brian" target="_blank" style="background:#ff6b2b;color:#fff;font-size:12px;font-weight:900;padding:9px 16px;border-radius:9px;text-decoration:none;white-space:nowrap">💳 Get Started — $137/mo</a>
</div>

<!-- Tab bar (desktop + mobile) -->
<div class="dtabs" role="tablist">
  <button type="button" class="dtab" data-p="app"     aria-pressed="true" >📱 Crew App</button>
  <button type="button" class="dtab" data-p="dash"    aria-pressed="false">🖥️ Owner Dashboard</button>
  <button type="button" class="dtab" data-p="partner" aria-pressed="false">🤝 Partner Dashboard</button>
  <button type="button" class="dtab" data-p="pricing" aria-pressed="false">💳 Pricing</button>
</div>

<div class="layout">
  <div class="pane" data-pane="app">
    <div class="pane-label">📱 Crew App</div>
    <iframe src="https://myjefetech.app" title="JefeTech App" allow="clipboard-write"></iframe>
  </div>
  <div class="pane" data-pane="dash">
    <div class="pane-label">🖥️ Owner Dashboard</div>
    <iframe src="https://go.myjefetech.app/la-forja.html" title="JefeTech Owner Dashboard" allow="clipboard-write"></iframe>
  </div>
  <div class="pane" data-pane="partner">
    <div class="pane-label">🤝 Partner Dashboard</div>
    <iframe src="https://go.myjefetech.app/partner-demo.html" title="JefeTech Partner Dashboard" allow="clipboard-write"></iframe>
  </div>
  <div class="pane" data-pane="pricing">
    <div class="pane-label">💳 Pricing</div>
    <iframe src="https://go.myjefetech.app/checkout.html?ref=demo" title="JefeTech Pricing" allow="clipboard-write"></iframe>
  </div>
</div>

<script>
(function(){
  var cur = 'app';

  function paint(){
    document.querySelectorAll('.pane').forEach(function(p){
      p.hidden = p.dataset.pane !== cur;
    });
    document.querySelectorAll('.dtab').forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.p === cur ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.dtab').forEach(function(b){
    b.addEventListener('click', function(){ cur = b.dataset.p; paint(); });
  });

  paint();
})();
</script>
