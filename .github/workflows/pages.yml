# Every push to main republishes all pages to GitHub Pages:
#   /brian/  /mexico/  /us/  /partners/  /escaner/  /inventario/  /demo-dashboard.html
name: Publish pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          rm -rf out && mkdir out
          cp shared/demo-dashboard.html out/demo-dashboard.html
          cp shared/demo.html out/demo.html
          cp shared/referral.html out/referral.html
          cp shared/packages.html out/packages.html
          cp shared/la-forja.html out/la-forja.html
          cp shared/checkout.html out/checkout.html
          cp shared/welcome.html out/welcome.html
          cp shared/owner.html out/owner.html
          cp shared/partner-demo.html out/partner-demo.html
          cp -R brian-site out/brian
          cp -R daniel out/mexico
          cp -R cristian out/us
          cp -R partners-site/public out/partners
          cp -R jefetech-app out/app
          cp -R escaner out/escaner
          cp -R inventario out/inventario
          cp -R pie-de-la-cuesta out/pie-de-la-cuesta
          cp jefetech-app/terms.html jefetech-app/privacy.html jefetech-app/refund.html jefetech-app/aviso-de-privacidad.html out/
          find out -name netlify.toml -delete
          rm -f out/brian/_redirects
          touch out/.nojekyll
          printf '<!doctype html><meta charset=utf-8><title>MX Studio</title><meta name=robots content=noindex><p>MX Studio ✝️</p>\n' > out/index.html
      - name: Check the shared inventory service
        env:
          HAS_NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
          HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          mkdir -p out/_diag
          {
            echo "checked: $(date -u +%FT%TZ)"
            echo "--- netlify api"
            curl -s -m 25 -w "\nHTTP %{http_code}\n" "https://mxstudio-partners.netlify.app/api/inventario?k=checkdeploy_0123456789abcdef&since=0" | head -c 600 || echo "curl failed"
            echo "--- netlify home"
            curl -s -o /dev/null -m 25 -w "HTTP %{http_code}\n" "https://mxstudio-partners.netlify.app/" || echo "curl failed"
            echo "--- vercel"
            curl -s -o /dev/null -m 25 -w "home HTTP %{http_code}\n" "https://mxstudio-brian.vercel.app/" || echo "curl failed"
            curl -s -m 25 -w "\napi HTTP %{http_code}\n" "https://mxstudio-brian.vercel.app/api/inventario?k=checkdeploy_0123456789abcdef&since=0" | head -c 400 || echo "curl failed"
            echo "--- secrets present"
            echo "NETLIFY_AUTH_TOKEN=$HAS_NETLIFY VERCEL_TOKEN=$HAS_VERCEL"
          } > out/_diag/service.txt
          cat out/_diag/service.txt
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          cname: go.myjefetech.app
